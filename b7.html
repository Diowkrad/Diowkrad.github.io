<script>
const statusEl = document.getElementById('status');
const canvas = document.getElementById('gpuCanvas');

/* ── ВСЕ ТЕЛА ИЗ ИГРЫ (масштаб стенда) ────────────────────────────────
   У каждой записи: имя, позиция, радиус, цвет-альбедо, тип. */
const SETS = {

    ['ШИНРАРТА-B',   13.2,21.6,-9.3, 0.16, [0.40,0.60,0.90], 3],
    ['Элизия',       36.8, 0, 36.6,  0.19, [0.80,0.28,0.90], 0],
    ['Брэстла',      57.9, 0, 18.0,  0.17, [0.90,0.88,0.15], 2],
    ['Шинрарта-С',   51.3, 0,-39.7,  0.035,[0.92,0.92,0.95], 3],
    ['НЕМЕЗИДА',     -1.2, 0,-42.9,  0.60, [0.40,0.10,1.00], 1],
    ['Диовкрад',    -64.2, 0, 14.9,  0.65, [0.90,0.05,0.05], 2],
    ['Шинрарта-A',    0.0, 0,  0.0,  4.20, [1.00,0.85,0.60], 4]

    ['МАРС',          -6.0, 4.5, 0,  0.70, [0.75,0.35,0.15], 0],
    ['МЕРКУРИЙ',       5.0, 0, 5.0,  0.25, [0.80,0.65,0.35], 0],
    ['ЗЕМЛЯ',          2.6, 0, 0,    0.73, [0.10,0.30,0.22], 0],
    ['ЮПИТЕР',         1.0, 0, 0,    3.10, [0.75,0.60,0.35], 2],
    ['СОЛНЦЕ',         0.0, 0, 0,    4.20, [1.00,0.90,0.65], 4]
  ],
  SIRIUS: [
    ['МАЯК-РАЗРУШЕНИЯ',7.0, 0,-7.0, 0.16, [0.40,0.60,0.90], 3],
    ['СРИУС-1A',       2.0, 0.8,1.5, 4.20, [0.80,0.90,1.00], 3],
    ['СРИУС-A',        0.0, 0, 0,    5.00, [0.85,0.93,1.00], 4]
  ]
};
const MAXB = 10;

function wgslFor(set) {
  const bodies = set;
  let posLines = '', colLines = '';
  const P = [];
  const C = [];
  for (let i = 0; i < MAXB; i++) {
    const b = bodies[i];
    if (b) { P.push(b[1], b[2], b[3], b[4]); C.push(b[5][0], b[5][1], b[5][2], b[6]); }
    else { P.push(0,0,0,0); C.push(0,0,0,0); }
  }
  return { posArr: new Float32Array(P), colArr: new Float32Array(C) };
}

const CODE_STATIC = `
struct Uniforms {
  resTime: vec4<f32>,
  camPos: vec4<f32>,
  camRight: vec4<f32>,
  camUp: vec4<f32>,
  camFwd: vec4<f32>,
  lightPos: vec4<f32>,
  lightCol: vec4<f32>,
  roughMetal: vec4<f32>,
  bodyPos: array<vec4<f32>, 10>,
  bodyCol: array<vec4<f32>, 10>,
};

@group(0) @binding(0) var<uniform> u: Uniforms;

struct VSOut {
  @builtin(position) pos: vec4<f32>,
  @location(0) uv: vec2<f32>,
};
@vertex
fn vs_main(@builtin(vertex_index) vid: u32) -> VSOut {
  var verts = array<vec2<f32>, 3>(vec2<f32>(-1.0,-1.0), vec2<f32>(3.0,-1.0), vec2<f32>(-1.0,3.0));
  var out: VSOut;
  out.pos = vec4<f32>(verts[vid], 0.0, 1.0);
  out.uv = verts[vid];
  return out;
}

// SDF сцены: ближайшая сфера, возвращаем (dist, индекс тела)
fn mapScene(p: vec3<f32>) -> vec2<f32> {
  var md = 1e9;
  var mi = -1;
  for (var i = 0; i < 10; i = i + 1) {
    let r = u.bodyPos[i].w;
    if (r < 0.001) { continue; }
    let d = length(p - u.bodyPos[i].xyz) - r;
    if (d < md) { md = d; mi = i; }
  }
  return vec2<f32>(md, f32(mi));
}

fn calcNormal(p: vec3<f32>) -> vec3<f32> {
  let e = vec2<f32>(0.0005, -0.0005);
  return normalize(e.xyy * mapScene(p + e.xyy).x + e.yyx * mapScene(p + e.yyx).x + e.yxy * mapScene(p + e.yxy).x + e.xxx * mapScene(p + e.xxx).x);
}

fn calcSoftShadow(ro: vec3<f32>, rd: vec3<f32>, mint: f32, maxt: f32) -> f32 {
  var res = 1.0;
  var t = mint;
  for (var i = 0; i < 48; i = i + 1) {
    let h = mapScene(ro + rd * t).x;
    res = min(res, 14.0 * h / max(t, 0.001));
    t = t + clamp(h, 0.02, 0.25);
    if (res < 0.002 || t > maxt) { break; }
  }
  return clamp(res, 0.0, 1.0);
}

fn distributionGGX(N: vec3<f32>, H: vec3<f32>, roughness: f32) -> f32 {
  let a = roughness * roughness; let a2 = a * a;
  let NdotH = max(dot(N,H),0.0); let NdotH2 = NdotH*NdotH;
  let denom = (NdotH2*(a2-1.0)+1.0);
  return a2 / (3.14159265*denom*denom + 0.00001);
}
fn geometrySchlickGGX(NdotV: f32, roughness: f32) -> f32 {
  let r = roughness + 1.0; let k = (r*r)/8.0;
  return NdotV / (NdotV*(1.0-k)+k+0.00001);
}
fn geometrySmith(N: vec3<f32>, V: vec3<f32>, L: vec3<f32>, roughness: f32) -> f32 {
  let NdotV = max(dot(N,V),0.0); let NdotL = max(dot(N,L),0.0);
  return geometrySchlickGGX(NdotV,roughness) * geometrySchlickGGX(NdotL,roughness);
}
fn fresnelSchlick(cosTheta: f32, F0: vec3<f32>) -> vec3<f32> {
  return F0 + (vec3<f32>(1.0) - F0) * pow(clamp(1.0 - cosTheta, 0.0, 1.0), 5.0);
}

// ── ПРОЦЕДУРНЫЕ ШУМЫ (для текстур поверхностей) ──
fn hash13(p: vec3<f32>) -> f32 {
  var pp = fract(p * 0.3183099 + vec3<f32>(0.1, 0.2, 0.3));
  pp = pp * 17.0;
  return fract(pp.x * pp.y * pp.z * (pp.x + pp.y + pp.z));
}
fn vnoise(x: vec3<f32>) -> f32 {
  let i = floor(x);
  let f = fract(x);
  let u = f * f * (3.0 - 2.0 * f);
  let n0 = hash13(i);
  let n1 = hash13(i + vec3<f32>(1.0, 0.0, 0.0));
  let n2 = hash13(i + vec3<f32>(0.0, 1.0, 0.0));
  let n3 = hash13(i + vec3<f32>(1.0, 1.0, 0.0));
  let n4 = hash13(i + vec3<f32>(0.0, 0.0, 1.0));
  let n5 = hash13(i + vec3<f32>(1.0, 0.0, 1.0));
  let n6 = hash13(i + vec3<f32>(0.0, 1.0, 1.0));
  let n7 = hash13(i + vec3<f32>(1.0, 1.0, 1.0));
  return mix(
    mix(mix(n0, n1, u.x), mix(n2, n3, u.x), u.y),
    mix(mix(n4, n5, u.x), mix(n6, n7, u.x), u.y),
    u.z
  );
}
fn fbm3(x: vec3<f32>) -> f32 {
  var v = 0.0; var a = 0.5; var pp = x;
  for (var i = 0; i < 3; i = i + 1) { v = v + a * vnoise(pp); pp = pp * 2.13; a = a * 0.5; }
  return v;
}
fn fbm5(x: vec3<f32>) -> f32 {
  var v = 0.0; var a = 0.5; var pp = x;
  for (var i = 0; i < 5; i = i + 1) { v = v + a * vnoise(pp); pp = pp * 2.07 + vec3<f32>(1.7); a = a * 0.5; }
  return v;
}
// ТЕКСТУРА ПОВЕРХНОСТИ ПО ТИПУ ТЕЛА (kind в bodyCol[i].w)
fn surfaceAlbedo(p: vec3<f32>, N: vec3<f32>, bodyIdx: i32, base: vec3<f32>) -> vec3<f32> {
  let kind = u.bodyCol[bodyIdx].w;
  let k = i32(kind);
  // координаты текстуры от нормали сферы
  var nTex = N;
  if (k == 0) {
    // суша: континенты + океан
    let cont = fbm5(nTex * 3.0);
    let land = smoothstep(0.52, 0.62, cont);
    let landC = mix(vec3<f32>(0.18, 0.5, 0.16), vec3<f32>(0.55, 0.5, 0.28), smoothstep(0.60, 0.78, cont));
    let mdet = fbm3(nTex * 7.0);
    var alb = mix(base * vec3<f32>(0.35), landC * (0.8 + 0.35 * mdet), land);
    // лёд у полюсов (по |N.y|)
    let ice = smoothstep(0.82, 0.95, abs(nTex.y));
    alb = mix(alb, vec3<f32>(0.85, 0.92, 1.0), ice * 0.7);
    // облака
    let cl = smoothstep(0.66, 0.72, fbm5(nTex * 4.0 + vec3<f32>(u.resTime.z * 0.02, 0.0, 0.0)));
    alb = mix(alb, vec3<f32>(1.0), cl * 0.35);
    return alb;
  }
  if (k == 1) {
    // сыр: жёлтый с дырками
    let blobs = fbm3(nTex * 3.5);
    let holes = smoothstep(0.55, 0.75, fbm5(nTex * 6.0 + vec3<f32>(7.3)));
    var alb = mix(vec3<f32>(1.0, 0.78, 0.25), vec3<f32>(0.95, 0.6, 0.15), blobs);
    alb = mix(alb, vec3<f32>(0.25, 0.15, 0.04), holes * 0.8);
    return alb;
  }
  if (k == 2) {
    // газовый гигант: полосы + шторм
    let lat = nTex.y;
    let warp = fbm3(nTex * 2.5 + vec3<f32>(u.resTime.z * 0.01, 0.0, u.resTime.z * 0.008));
    let bands = sin(lat * 14.0 + warp * 3.2);
    var alb = mix(base, base * 1.6, smoothstep(-0.6, 0.6, bands));
    let storm = smoothstep(0.35, 0.5, fbm5(nTex * 5.0 + vec3<f32>(u.resTime.z * 0.05, 0.0, 0.0)));
    alb = mix(alb, vec3<f32>(1.0, 0.95, 0.85), storm * 0.4);
    return alb;
  }
  if (k == 3) {
    // пульсар/светящееся тело: серебристый с пятнами
    let vein = fbm5(nTex * 4.0 + vec3<f32>(0.0, u.resTime.z * 0.06, 0.0));
    let spots = smoothstep(0.42, 0.62, fbm3(nTex * 3.0 + 3.3));
    var alb = mix(base * 0.7, vec3<f32>(1.0), spots);
    alb = mix(alb, vec3<f32>(0.5, 0.65, 1.0), vein * 0.5);
    return alb;
  }
  // звезда (k==4): домен-варп плазма
  let st = nTex * 3.4 + vec3<f32>(0.0, u.resTime.z * 0.03, u.resTime.z * 0.02);
  let q1 = fbm3(st + vec3<f32>(1.3, 5.2, 0.0));
  let q2 = fbm3(st + vec3<f32>(5.2, 1.3, 0.0));
  let r1 = fbm3(st + vec3<f32>(1.3, 5.2, 0.0) + 3.0 * q1);
  let hot = smoothstep(0.5, 0.8, r1);
  var alb = mix(vec3<f32>(1.0, 0.45, 0.15), vec3<f32>(1.0, 0.9, 0.55), hot);
  alb = mix(alb, vec3<f32>(1.0, 0.98, 0.9), q2 * hot * 0.8);
  return alb;
}

fn shadeBody(p: vec3<f32>, N: vec3<f32>, V: vec3<f32>, albedo: vec3<f32>, bodyIdx: i32) -> vec3<f32> {
  let isStar = (u.bodyCol[bodyIdx].w > 3.5);
  if (isStar) {
    // звезда самосветится
    return albedo * 1.6;
  }
  let rough = u.roughMetal.x;
  let lPos = u.lightPos.xyz;
  let lVec = lPos - p;
  let dist = length(lVec);
  let L = lVec / max(dist, 0.0001);
  let H = normalize(V + L);
  let attenuation = 18.0 / (1.0 + 0.10*dist*dist);
  let radiance = u.lightCol.rgb * attenuation;
  let F0 = vec3<f32>(0.04);
  let NDF = distributionGGX(N,H,rough);
  let G = geometrySmith(N,V,L,rough);
  let F = fresnelSchlick(max(dot(H,V),0.0), F0);
  let numerator = NDF*G*F;
  let denominator = 4.0*max(dot(N,V),0.0)*max(dot(N,L),0.0)+0.0001;
  let specular = numerator/denominator;
  let kS = F;
  let kD = vec3<f32>(1.0) - kS;
  let NdotL = max(dot(N,L),0.0);
  let shadow = calcSoftShadow(p + N*0.005, L, 0.02, dist);
  let direct = (kD*albedo/3.14159265 + specular) * radiance * NdotL * shadow;
  let R = reflect(-V,N);
  let skyMix = clamp(R.y*0.5+0.5,0.0,1.0);
  let envColor = mix(vec3<f32>(0.04,0.05,0.08), vec3<f32>(0.22,0.34,0.52), skyMix);
  let ambient = (kD*albedo*0.12 + F*envColor*(1.0-rough*0.65));
  return direct + ambient;
}

@fragment
fn fs_main(in: VSOut) -> @location(0) vec4<f32> {
  var aspect = u.resTime.x / max(u.resTime.y, 1.0);
  let screen = vec2<f32>(in.uv.x * aspect, in.uv.y);
  let ro = u.camPos.xyz;
  let fwd = normalize(u.camFwd.xyz);
  let right = normalize(u.camRight.xyz);
  let up = normalize(u.camUp.xyz);
  let rd = normalize(screen.x*right + screen.y*up + 1.6*fwd);

  var t = 0.0;
  var bodyIdx = -1;
  for (var i = 0; i < 200; i = i + 1) {
    let h = mapScene(ro + rd * t);
    if (h.x < 0.0006) { bodyIdx = i32(h.y); break; }
    t = t + h.x;
    if (t > 400.0) { break; }
  }

  // ── НЕБО ──
  let upv = normalize(u.camUp.xyz);
  let skyGrad = clamp(rd.y * 0.5 + 0.5, 0.0, 1.0);
  // градиент: тёмный зенит → тёплый горизонт
  var col = mix(vec3<f32>(0.012, 0.016, 0.035), vec3<f32>(0.06, 0.10, 0.20), pow(skyGrad, 0.6));
  // млечный путь — широкая полоса
  let bandW = pow(max(1.0 - abs(dot(rd, normalize(vec3<f32>(0.35, 0.85, 0.40)))), 0.0), 4.0);
  col = col + vec3<f32>(0.30, 0.34, 0.45) * bandW * fbm3(rd * 4.0) * 0.35;
  col = col + vec3<f32>(0.6, 0.55, 0.45) * bandW * bandW * 0.10;
  // звёзды: три грида с мерцанием
  for (var L = 0; L < 3; L = L + 1) {
    let sc = 90.0 + f32(L) * 80.0;
    let g = rd * sc;
    let cid = floor(g);
    let f = fract(g) - 0.5;
    let h = hash13(cid + f32(L) * 37.0);
    if (h > 0.975) {
      let off = (vec3<f32>(hash13(cid + 1.0), hash13(cid + 2.0), hash13(cid + 3.0)) - 0.5) * 0.6;
      let dl = length(f - off);
      let tw = 0.55 + 0.45 * sin(u.resTime.z * (1.0 + h * 4.0) + h * 40.0);
      let s = (1.0 - smoothstep(0.0, 0.14, dl)) * tw;
      let tint = mix(vec3<f32>(0.70, 0.80, 1.0), vec3<f32>(1.0, 0.85, 0.60), hash13(cid + 4.0));
      col = col + s * tint * (0.35 + h * 0.8);
    }
  }
  // небесный диск солнца убран: звезда рисуется самим телом через ray-march (bodyIdx),
  // отдельный диск в небе создавал дублирующие круги.

  if (bodyIdx >= 0 && bodyIdx < 10) {
    let p = ro + rd * t;
    let N = calcNormal(p);
    let V = -rd;
    // процедурная текстура поверхности по типу тела (kind в .w)
    let albedo = surfaceAlbedo(p, N, bodyIdx, u.bodyCol[bodyIdx].rgb);
    col = shadeBody(p, N, V, albedo, bodyIdx);
    // солнце-ореол (для звезды-источника света) добавляем в shadeBody по isStar
  }

  // маркер источника света убран: свет остаётся только как освещение тел (см. shadeBody)

  col = col / (col + vec3<f32>(1.0,1.0,1.0));
  col = pow(max(col, vec3<f32>(0.0)), vec3<f32>(1.0/2.2));
  return vec4<f32>(col, 1.0);
}
`;

async function init() {
  if (!navigator.gpu) { severity('navigator.gpu отсутствует'); return; }
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) { severity('Не удалось получить GPUAdapter'); return; }
  const device = await adapter.requestDevice();
  device.addEventListener('uncapturederror', (e) => { severity('WebGPU Error: ' + e.error.message); });

  const context = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(window.innerWidth*dpr));
    canvas.height = Math.max(1, Math.floor(window.innerHeight*dpr));
    context.configure({ device, format, alphaMode: 'opaque' });
  }
  window.addEventListener('resize', resize); resize();

  const shaderModule = device.createShaderModule({ code: CODE_STATIC });
  const info = await shaderModule.getCompilationInfo();
  const errs = info.messages.filter(m => m.type === 'error');
  if (errs.length > 0) { severity(errs.map(e => 'Строка '+e.lineNum+': '+e.message).join('\n')); return; }

  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: shaderModule, entryPoint: 'vs_main' },
    fragment: { module: shaderModule, entryPoint: 'fs_main', targets: [{ format }] },
    primitive: { topology: 'triangle-list' }
  });

  // uniform buffer: 7 vec4 (112) + 10*2 vec4 (320) = 432 bytes
  const uniformBuffer = device.createBuffer({ size: 448, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
  });

  // ── свободная камера ──
  let camPos = [0, 6, -80];
  let yaw = 0.0, pitch = 0.12;
  let keys = {};
  const roughEl = document.getElementById('rough');
  const lColEl = document.getElementById('lightColor');
  const speedEl = document.getElementById('speed');
  const setSel = document.getElementById('setSel');

  // свет: перетаскивается
  let lightPos = [6.0, 8.0, 8.0];
  let dragging = false, lookDrag = false, lx = 0, ly = 0, lmode = false;

  window.addEventListener('keydown', e => { keys[e.code] = true; });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    if (e.button === 2) { lmode = true; dragging = true; }
    else if (e.button === 0) { lookDrag = true; dragging = true; }
    lx = e.clientX; ly = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  window.addEventListener('pointerup', () => { dragging = false; lookDrag = false; lmode = false; });
  window.addEventListener('pointermove', e => {
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    if (!dragging) return;
    if (lmode) {
      // перетащить свет: перемещение в плоскости, перпендикулярной взгляду
      const f0 = [Math.cos(yaw)*Math.cos(pitch), Math.sin(pitch), Math.sin(yaw)*Math.cos(pitch)];
      const rr = [Math.sin(pitch)*Math.cos(yaw), -Math.cos(pitch), Math.sin(pitch)*Math.sin(yaw)];
      const uu = [-Math.sin(yaw), 0, Math.cos(yaw)];
      for (let q=0; q<3; q++) lightPos[q] += (-dx*0.06*rr[q] + dy*0.06*uu[q]);
      lightPos[0] = Math.max(-60, Math.min(60, lightPos[0]));
      lightPos[1] = Math.max(-60, Math.min(60, lightPos[1]));
      lightPos[2] = Math.max(-60, Math.min(60, lightPos[2]));
    } else if (lookDrag) {
      yaw -= dx * 0.005;
      pitch = Math.max(-1.4, Math.min(1.4, pitch + dy*0.005));
    }
  });

  // ── кадр ──
  let lastTime = performance.now();
  let frames = 0, fpsTime = lastTime, fps = 60;
  const uData = new Float32Array(112);

  function fwdVec() {
    return [Math.cos(yaw)*Math.cos(pitch), Math.sin(pitch), Math.sin(yaw)*Math.cos(pitch)];
  }
  function rightVec() { return [Math.sin(yaw), 0, -Math.cos(yaw)]; }
  function upVec() {
    const f = fwdVec();
    const r = rightVec();
    return [r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  }

  function frame(now) {
    const dt = Math.min((now - lastTime)*0.001, 0.05);
    lastTime = now;
    frames++;
    if (now - fpsTime >= 500) { fps = Math.round(frames*1000/(now-fpsTime)); frames=0; fpsTime=now; }

    // движение WASD + shift/space
    const sp = parseFloat(speedEl.value) * dt;
    const f = fwdVec(), r = rightVec();
    let mv = [0,0,0];
    if (keys['KeyW']) { mv[0]+=f[0]; mv[1]+=f[1]; mv[2]+=f[2]; }
    if (keys['KeyS']) { mv[0]-=f[0]; mv[1]-=f[1]; mv[2]-=f[2]; }
    if (keys['KeyD']) { mv[0]+=r[0]; mv[1]+=r[1]; mv[2]+=r[2]; }
    if (keys['KeyA']) { mv[0]-=r[0]; mv[1]-=r[1]; mv[2]-=r[2]; }
    if (keys['ShiftLeft']||keys['ShiftRight']) { mv[1]-=1; }
    if (keys['Space']) { mv[1]+=1; }
    const ml = Math.hypot(mv[0],mv[1],mv[2]);
    if (ml > 0.001) { const s = sp/ml; camPos[0]+=mv[0]*s; camPos[1]+=mv[1]*s; camPos[2]+=mv[2]*s; }

    const uP = upVec();

    // набор тел
    const curSet = SETS[setSel.value] || SETS['HOME'];
    const wg = wgslFor(curSet);

    const lRgb = hexToRgb(lColEl.value);
    const rough = parseFloat(roughEl.value);

    uData[0] = canvas.width; uData[1] = canvas.height; uData[2] = now*0.001; uData[3]=0;
    uData[4] = camPos[0]; uData[5] = camPos[1]; uData[6] = camPos[2]; uData[7]=0;
    uData[8] = r[0]; uData[9] = r[1]; uData[10] = r[2]; uData[11]=0;
    uData[12] = uP[0]; uData[13] = uP[1]; uData[14] = uP[2]; uData[15]=0;
    uData[16] = f[0]; uData[17] = f[1]; uData[18] = f[2]; uData[19]=0;
    uData[20] = lightPos[0]; uData[21] = lightPos[1]; uData[22] = lightPos[2]; uData[23]=0;
    uData[24] = lRgb[0]; uData[25] = lRgb[1]; uData[26] = lRgb[2]; uData[27]=0;
    uData[28] = rough; uData[29] = 0; uData[30] = 0; uData[31]=0;
    // тела: offset 32 -> bodyPos (10 vec4), offset 72 -> bodyCol (10 vec4)
    for (let q=0; q<40; q++) { uData[32+q] = wg.posArr[q]; uData[72+q] = wg.colArr[q]; }

    device.queue.writeBuffer(uniformBuffer, 0, uData);

    const encoder = device.createCommandEncoder();
    const view = context.getCurrentTexture().createView();
    const pass = encoder.beginRenderPass({ colorAttachments: [{ view, clearValue: {r:0.02,g:0.03,b:0.05,a:1}, loadOp:'clear', storeOp:'store' }] });
    pass.setPipeline(pipeline); pass.setBindGroup(0, bindGroup); pass.draw(3); pass.end();
    device.queue.submit([encoder.finish()]);

    statusEl.textContent = `WebGPU OK · ${fps} FPS · ${canvas.width}x${canvas.height}\n${curSet.map((b,i)=>b[0]+':'+b[4].toFixed(2)).join(' · ')}`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function severity(msg) { statusEl.style.color = '#f87171'; statusEl.textContent = 'Ошибка: ' + msg; console.error(msg); }
function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; }
init();
</script>
</body>
</html>
