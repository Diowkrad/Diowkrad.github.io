<!DOCTYPE html>

<head>

<title>☩ Миниатюры небесных тел — DIOWKRAD ☩</title>
<style>
:root{ --bg:#05060c; --gold:#f7cc1d; --ink:#90bc0f; --dim:#5a6b8c; --wood1:#5a3a1e; --wood2:#7a4f2a; }
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{ background:radial-gradient(1200px 700px at 50% -10%,#141a2e 0%,transparent 60%),var(--bg);     overflow: auto;
  color:var(--ink); font-family:'Courier New',Courier,monospace;
  display:flex; flex-direction:column; align-items:center; min-height:100vh; user-select:none; }
h1{ margin-top:26px; font-size:1.4rem; letter-spacing:4px; color:var(--gold);
  text-shadow:0 0 14px rgba(247,204,29,.5),2px 2px 0 #4a3a00; text-align:center; }
.sub{ margin-top:6px; font-size:.7rem; letter-spacing:2px; color:var(--dim); text-transform:uppercase; }
.stage{ flex:1; width:100%; max-width:1500px; display:flex; justify-content:space-around; align-items:flex-end; padding:18px 10px 0; }
.celestial{ display:flex; flex-direction:column; align-items:center; width:200px; }
.string{ width:2px; height:150px; background:linear-gradient(to bottom,#ffffff22,#ffffff44); box-shadow:0 0 4px rgba(255,255,255,.25); }
canvas.orb{ width:300px; height:300px;border-radius: 8%; display:block; margin:8px 0; 
  filter: drop-shadow(0 0 24px rgba(144,188,15,.30)) drop-shadow(0 0 48px rgba(120,160,255,.18)); }
.tag{ font-size:1.2rem; letter-spacing:2px; color:var(--ink); text-shadow:0 0 8px rgba(144,188,15,.6); margin-top:6px; }
.shelf{ width:100%; max-width:1500px; }
.plank{ height:26px; border-radius:4px;box-shadow: 0 0 10px rgba(247, 204, 29, 0.55), 0 0 20px rgba(247, 204, 29, 0.25), 2px 2px 0 #000; background:linear-gradient(to bottom,var(--wood2),var(--wood1));
  box-shadow:0 8px 16px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.18); border:2px inset #3a2410; }
.plank::before{ content:''; position:absolute; width:100%; height:4px; top:3px; left:0; background:rgba(255,255,255,.09); }
.shelf-label{ text-align:center; margin:8px 0 8px; font-size:.7rem; letter-spacing:3px; color:var(--dim); }
#diag{ position:fixed; left:8px; bottom:4px; font-size:11px; color:#f66; z-index:99; pointer-events:none; }
</style>
</head>
<body>
<h1>☩ HITOMI OF LEGENDS v1.2.5 ☩</h1>
<h2>☩ ЗВЕЗДНАЯ СИСТЕМА ШИНРАРТА ☩</h2>
<main class="stage">
<div class="celestial"><canvas class="orb" data-planet="0"></canvas><div class="string"></div><div class="tag">ХИТОМИ</div></div>
<div class="celestial"><canvas class="orb" data-planet="1"></canvas><div class="string"></div><div class="tag">ЧИЗИЯ</div></div>
<div class="celestial"><canvas class="orb" data-planet="2"></canvas><div class="string"></div><div class="tag">НГАЛИН</div></div>
<div class="celestial"><canvas class="orb" data-planet="3"></canvas><div class="string"></div><div class="tag">ШИНРАРТА-B</div></div>
</main>
<section class="shelf"><div class="plank"></div><div class="shelf-label"></div></section>
<div id="diag" Style="display:None;">…</div>
<script>
var errs=[];
var VERT='attribute vec2 aPos;void main(){ gl_Position = vec4(aPos,0.0,1.0); }';
var FRAG_SRC="precision highp float;\nuniform vec2  uRes;\nuniform float uTime;\nuniform float uCamA;\nuniform float uSunA;\nuniform float uPlanet;\nuniform float uSplash;\n\n#define R    1.0\n#define CAMR (uPlanet > 2.5 ? 2.55 : (uPlanet > 0.5 && uPlanet < 1.5 ? 4.20 : 2.40))\n#define FOT  0.577350\n\n/* --- хэш и шумы (средний слой) --- */\nfloat hash13(vec3 p){\n  p = fract(p*0.3183099 + vec3(0.1,0.2,0.3));\n  p *= 17.0;\n  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));\n}\nfloat vnoise(vec3 x){\n  vec3 i = floor(x);\n  vec3 f = fract(x);\n  f = f*f*(3.0-2.0*f);\n  float n0=hash13(i);\n  float n1=hash13(i+vec3(1.0,0.0,0.0));\n  float n2=hash13(i+vec3(0.0,1.0,0.0));\n  float n3=hash13(i+vec3(1.0,1.0,0.0));\n  float n4=hash13(i+vec3(0.0,0.0,1.0));\n  float n5=hash13(i+vec3(1.0,0.0,1.0));\n  float n6=hash13(i+vec3(0.0,1.0,1.0));\n  float n7=hash13(i+vec3(1.0,1.0,1.0));\n  return mix(mix(mix(n0,n1,f.x),mix(n2,n3,f.x),f.y),\n             mix(mix(n4,n5,f.x),mix(n6,n7,f.x),f.y),f.z);\n}\n/* тяжёлый: 5 октав */\nfloat fbm5(vec3 p){\n  float v=0.0, a=0.5;\n  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=p*2.07+vec3(1.7); a*=0.5; }\n  return v;\n}\n/* средний: 3 октавы */\nfloat fbm3(vec3 p){\n  float v=0.0, a=0.5;\n  for(int i=0;i<3;i++){ v+=a*vnoise(p); p=p*2.13; a*=0.5; }\n  return v;\n}\n\n/* --- звёзды: три слоя гридов с мерцанием --- */\nvec3 stars(vec3 rd){\n  vec3 c = vec3(0.0);\n  for(int L=0; L<3; L++){\n    float sc = 90.0 + float(L)*80.0;\n    vec3 g  = rd*sc;\n    vec3 id = floor(g);\n    vec3 fr = fract(g) - 0.5;\n    float h = hash13(id + float(L)*37.0);\n    if(h > 0.975){\n      vec3 off = (vec3(hash13(id+1.0), hash13(id+2.0), hash13(id+3.0)) - 0.5)*0.6;\n      float d  = length(fr - off);\n      float tw = 0.55 + 0.45*sin(uTime*(1.0+h*4.0) + h*40.0);\n      float s  = (1.0 - smoothstep(0.0, 0.14, d))*tw;\n      vec3 tint = mix(vec3(0.70,0.80,1.0), vec3(1.0,0.85,0.60), hash13(id+4.0));\n      c += s*tint*(0.35 + h*0.8);\n    }\n  }\n  return c;\n}\n\nvoid main(){\n  vec2 uv = (gl_FragCoord.xy*2.0 - uRes)/uRes.y;\n\n  /* --- камера: орбита вокруг планеты, взгляд на центр --- */\n  vec3 camPos = vec3(cos(uCamA)*CAMR, sin(uCamA)*CAMR, 0.0);\n  if(uPlanet > 2.5){ camPos.y -= 0.14*uSplash; }\n  vec3 sC = (uPlanet > 2.5) ? vec3(0.0, -0.14*uSplash, 0.0) : vec3(0.0);\n  vec3 fwd   = normalize(sC - camPos);\n  vec3 up0   = vec3(-sin(uCamA), cos(uCamA), 0.0);\n  vec3 right = normalize(cross(fwd, up0));\n  vec3 upv   = cross(right, fwd);\n  vec3 rd    = normalize(fwd + (uv.x*right + uv.y*upv)*FOT);\n\n  /* солнце — экваториальный круг с лёгким наклоном; луна — отстает на 0.9 рад */\n  float st = sin(uSunA), ct = cos(uSunA);\n  vec3 sunDir  = normalize(vec3(ct, 0.22*st, st));\n  vec3 moonDir = normalize(vec3(cos(uSunA+0.9), 0.25, sin(uSunA+0.9)));\n\n  /* пересечение луча со сферой планеты */\n  vec3 wC = camPos - sC;\n  float b    = dot(wC, rd);\n  float cc   = dot(wC, wC) - R*R;\n  float disc = b*b - cc;\n  float tHit = -b - sqrt(max(disc, 0.0));\n  bool hitP  = (disc > 0.0) && (tHit > 0.0);\n\n  float dayLocal = dot(normalize(camPos), sunDir);\n  float dayness  = smoothstep(-0.25, 0.30, dayLocal);\n\n  /* цвет атмосферы по планете: ХИТОМИ голубая, ЧИЗИЯ #905000, НГАЛИН #300090 */\n  vec3 atmC = vec3(0.30,0.55,1.0);\n  if(uPlanet > 0.5 && uPlanet < 1.5){ atmC = vec3(0.565,0.314,0.0); }\n  else if(uPlanet > 1.5 && uPlanet < 2.5){ atmC = vec3(0.188,0.0,0.565); }\n  else if(uPlanet > 2.5){ atmC = vec3(0.039,0.118,0.302); }\n\n  vec3 col = vec3(0.0);\n  float outA = 0.0;\n\n  if(hitP){\n    /* ---- ПЛАНЕТА ---- */\n    vec3 p = camPos + rd*tHit;\n    vec3 n = normalize(p - sC);\n    float nl  = dot(n, sunDir);\n    float lit = smoothstep(-0.06, 0.18, nl);\n\n    if(uPlanet < 0.5){\n    /* континенты: тяжёлый fbm по нормали, планета медленно вращается */\n    vec3  sp   = n*2.6 + vec3(0.0, 0.0, uTime*0.004);\n    float cont = fbm5(sp);\n    float land = smoothstep(0.46, 0.54, cont);\n    /* ДЕТАЛЬ: волнение береговой линии (турбулентность) — плавнее граница суши/океана */\n    float coast = fbm3(n*8.0 + vec3(0.0, uTime*0.006, 0.0));\n    land = mix(land, smoothstep(0.40, 0.60, cont - 0.10*coast), 0.35);\n    vec3 ocean = vec3(0.02,0.10,0.22);\n    vec3 landc = mix(vec3(0.08,0.26,0.10), vec3(0.42,0.36,0.20), smoothstep(0.52,0.78,cont));\n\n    /* ДЕТАЛЬ: микро-рельеф суши (горы/равнины) — доп. fbm, не меняет границы суши */\n    float mdet = fbm3(n*12.0 + vec3(uTime*0.003, uTime*0.001, 0.0));\n    landc *= 0.85 + 0.30*mdet;\n\n    float ice  = smoothstep(0.80, 0.94, abs(n.y));\n    vec3 surf  = mix(ocean, landc, land);\n    surf = mix(surf, vec3(0.85,0.90,0.95), ice);\n\n    /* облака: второй тяжёлый слой, свой дрейф */\n    float cl = fbm5(n*4.2 + vec3(uTime*0.010, 0.0, -uTime*0.006));\n    cl = smoothstep(0.50, 0.74, cl);\n    surf = mix(surf, vec3(0.95,0.97,1.0), cl*0.9);\n\n    vec3 colDay = surf*(0.15 + 1.05*lit);\n    /* блик океана */\n    vec3 hv = normalize(sunDir - rd);\n    float spec = pow(max(dot(n,hv),0.0), 60.0)*(1.0-land)*(1.0-ice)*(1.0-cl)*lit;\n    colDay += vec3(0.9,0.95,1.0)*spec*0.6;\n\n    /* ночь: огни городов на суше, мерцание */\n    float cellH = hash13(floor(n*90.0));\n    float city  = step(0.80, cellH)*land*(1.0-cl)*(1.0-ice);\n    vec3 colNight = surf*0.03 + vec3(1.0,0.75,0.35)*city*0.9*(0.6+0.4*sin(uTime*2.0+cellH*50.0));\n\n    col = mix(colNight, colDay, lit);\n\n    /* атмосферный ободок на лимбе */\n    float fres = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);\n    col += vec3(0.25,0.5,1.0)*fres*(0.2 + 0.8*lit)*1.1;\n\n    /* полярные сияния на ночном полюсе */\n    float aurZ = smoothstep(0.72, 0.92, abs(n.y))*(1.0-lit);\n    float aur  = fbm3(n*5.0 + vec3(0.0, uTime*0.2, 0.0));\n    col += vec3(0.10,0.90,0.45)*aurZ*smoothstep(0.45,0.75,aur)*0.55;\n    }\n    else if(uPlanet < 1.5){\n      /* ---- ЧИЗИЯ: газовый гигант с полосами и штормом ---- */\n      float lat = n.y;\n      float warp = fbm3(n*2.6 + vec3(uTime*0.008, 0.0, 0.0));\n      float bands = sin(lat*16.0 + warp*3.2);\n      float bands2 = sin(lat*34.0 + 1.7);\n      vec3 band1 = vec3(0.87, 0.80, 0.62);\n      vec3 band2 = vec3(0.72, 0.55, 0.34);\n      vec3 band3 = vec3(0.93, 0.88, 0.74);\n      vec3 surf = mix(band1, band2, smoothstep(-0.6, 0.6, bands));\n      surf = mix(surf, band3, 0.5 + 0.5*sin(lat*7.0 + 1.0));\n      surf = mix(surf, band2*0.92, 0.25*smoothstep(0.3, 0.9, bands2));\n      vec3 sdir = normalize(vec3(cos(uTime*0.02 + 2.0), -0.30, sin(uTime*0.02 + 2.0)));\n      float angS = acos(clamp(dot(n, sdir), -1.0, 1.0));\n      float storm = 1.0 - smoothstep(0.05, 0.16, angS);\n      surf = mix(surf, vec3(0.80, 0.42, 0.22), storm*0.85);\n      surf *= 0.92 + 0.16*fbm3(n*9.0 + vec3(uTime*0.05, 0.0, 0.0));\n      col = surf*(0.06 + 1.05*lit);\n      float fresA = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);\n      col += vec3(0.90, 0.75, 0.50)*fresA*(0.2 + 0.8*lit)*0.8;\n    }\n    else if(uPlanet < 2.5) {\n      /* ---- НГАЛИН: магматический мир с реками лавы ---- */\n      float rock = fbm5(n*3.2);\n      vec3 surf = mix(vec3(0.05, 0.045, 0.05), vec3(0.16, 0.13, 0.12), rock);\n      float riv1 = fbm3(n*3.5 + vec3(0.0, uTime*0.02, uTime*0.013));\n      float riv2 = fbm3(n*7.0 - vec3(uTime*0.015, 0.0, 0.0));\n      float lava = (1.0 - smoothstep(0.0, 0.02, abs(riv1 - 0.5)))\n                 + 0.7*(1.0 - smoothstep(0.0, 0.015, abs(riv2 - 0.5)));\n      lava = min(lava, 1.0);\n      float pulse = 0.75 + 0.25*sin(uTime*1.5 + riv1*40.0);\n      col = surf*(0.05 + 0.9*lit) + vec3(1.0, 0.38, 0.06)*lava*pulse*(1.4 + (1.0 - lit)*2.2);\n      float fresP = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);\n      col += vec3(1.0, 0.45, 0.10)*fresP*0.25;\n    } else {\n      /* ---- ШИНРАРТА-B: нейтронная звезда — поверхность как у НГАЛИН, эффект голубой #eff5f9 ---- */\n      float rock = fbm5(n*3.2);\n      vec3 surf = mix(vec3(0.05,0.045,0.05), vec3(0.16,0.13,0.12), rock);\n      float riv1 = fbm3(n*3.5 + vec3(0.0, uTime*0.02, uTime*0.013));\n      float riv2 = fbm3(n*7.0 - vec3(uTime*0.015, 0.0, 0.0));\n      float lava = (1.0 - smoothstep(0.0, 0.02, abs(riv1 - 0.5)))\n                 + 0.7*(1.0 - smoothstep(0.0, 0.015, abs(riv2 - 0.5)));\n      lava = min(lava, 1.0);\n      float pulse = 0.75 + 0.25*sin(uTime*1.5 + riv1*40.0);\n      col = surf*(0.05 + 0.9*lit) + vec3(0.937,0.961,0.976)*lava*pulse*(1.6 + (1.0 - lit)*2.6);\n      float fresP = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);\n      col += vec3(0.60,0.80,1.0)*fresP*0.45;\n    }\n\n    /* мягкий антиалиасинг лимба: альфа модели */\n    outA = clamp(0.5 + disc/0.024, 0.0, 1.0);\n  } else {\n    /* ореол атмосферы у лимба — полупрозрачное свечение вокруг модели */\n    float closest = length(camPos - rd*b);\n    float atmo = 1.0 - smoothstep(1.0, 1.22, closest);\n    if(uPlanet < 2.5){ col += atmC*atmo*dayness*0.85; outA = max(outA, atmo*dayness*0.85); }\n    else { col += vec3(0.05,0.10,0.24)*atmo; outA = max(outA, atmo*0.9); }\n\n/* луна: диск с кратерами, свечение */\n    float dM = dot(rd, moonDir);\n    float mdisc = smoothstep(0.99950, 0.99980, dM);\n    if(mdisc > 0.0){\n      vec3 lp = rd - moonDir*dM;\n      float cr = fbm3(lp*260.0);\n      vec3 mc = vec3(0.78,0.78,0.74)*(0.55 + 0.45*cr);\n      float mlit = smoothstep(-0.15, 0.15, dot(moonDir, sunDir));\n      vec3 mc2 = mc*mix(0.10, 1.0, mlit);\n      col = mix(col, mc2, mdisc);\n      col += vec3(0.60,0.65,0.85)*pow(max(dM,0.0), 900.0)*0.30;\n      outA = max(outA, mdisc);\n    }\n/* СЫРНЫЕ ЛУНЫ ЧИЗИИ: 4 диска на скайбоксе, дрейф за солнцем */\n    if(uPlanet > 0.5 && uPlanet < 1.5){\n      for(int ci=0; ci<4; ci++){\n        float cang = uSunA + 2.1 + 0.77*float(ci);\n        vec3 cdir = normalize(vec3(cos(cang), 0.15 + 0.18*float(ci), sin(cang)));\n        float dC = dot(rd, cdir);\n        float cthr = 0.99960 - 0.00007*float(ci);\n        float cdisc = smoothstep(cthr, cthr + 0.00035, dC);\n        if(cdisc > 0.0){\n          vec3 lp = rd - cdir*dC;\n          float crel = fbm3(lp*420.0);\n          float holes = smoothstep(0.30, 0.62, fbm3(lp*160.0 + vec3(7.3)));\n          vec3 cheese = vec3(1.00,0.82,0.30)*(0.55 + 0.45*crel);\n          cheese = mix(cheese, vec3(0.42,0.28,0.08), holes*0.55);\n          float clit = smoothstep(-0.15, 0.15, dot(cdir, sunDir));\n          vec3 cc2 = cheese*mix(0.10, 1.0, clit);\n          col = mix(col, cc2, cdisc);\n          col += vec3(1.00,0.90,0.60)*pow(max(dC,0.0), 900.0)*0.25;\n          outA = max(outA, cdisc);\n        }\n      }\n    }\n  }\n\n/* СЫРНЫЕ ЛУНЫ ШИНРАРТА-B: 8 дисков на скайбоксе, дрейф за солнцем */\n    if(!hitP && uPlanet > 2.5){\n      for(int ci=0; ci<8; ci++){\n        float cang = uSunA + 2.1 + 0.55*float(ci);\n        vec3 cdir = normalize(vec3(cos(cang), 0.10 + 0.13*float(ci), sin(cang)));\n        float dC = dot(rd, cdir);\n        float cthr = 0.99955 - 0.00006*float(ci);\n        float cdisc = smoothstep(cthr, cthr + 0.00022, dC);\n        if(cdisc > 0.0){\n          vec3 lp2 = rd - cdir*dC;\n          float chz = fbm3(lp2*240.0);\n          vec3 cheese = vec3(0.95,0.78,0.30)*(0.55 + 0.45*chz);\n          float clit = smoothstep(-0.15, 0.15, dot(cdir, sunDir));\n          vec3 cc2 = cheese*mix(0.10, 1.0, clit);\n          col = mix(col, cc2, cdisc);\n          col += vec3(1.00,0.90,0.60)*pow(max(dC,0.0), 900.0)*0.25;\n          outA = max(outA, cdisc);\n        }\n      }\n    }\n/* ---- КОЛЬЦА АУРЕЛИИ: плоскость с наклоном, щель, тень планеты ---- */\n  /* FIX: не рисовать кольца, когда луч попадает в планету — звезда непрозрачна */\n  if(!hitP && uPlanet > 0.5 && uPlanet < 1.5){\n    vec3 nR = normalize(vec3(0.22, 1.0, 0.18));\n    float denom = dot(rd, nR);\n    if(abs(denom) > 0.0035){\n      float tR = -dot(camPos, nR)/denom;\n      if(tR > 0.05 && (!hitP || tR < tHit)){\n        vec3 q = camPos + rd*tR;\n        float rr = length(q);\n        if(rr > 1.45 && rr < 2.35){\n          float gap = smoothstep(1.76, 1.78, rr)*(1.0 - smoothstep(1.84, 1.86, rr));\n          float band = 0.55 + 0.45*sin(rr*95.0 + 2.4*sin(rr*17.0));\n          float edge = smoothstep(1.45, 1.52, rr)*(1.0 - smoothstep(2.28, 2.35, rr));\n          float shadow = smoothstep(-0.06, 0.10, dot(normalize(q), sunDir));\n          float bright = (0.18 + 0.82*shadow)*(0.55 + 0.45*abs(dot(nR, sunDir)));\n          float alpha = edge*(1.0 - gap*0.92)*(0.35 + 0.65*band);\n          alpha *= clamp(abs(denom)*30.0, 0.0, 1.0);\n          col = mix(col, vec3(0.85, 0.76, 0.58)*bright, alpha*0.9);\n          outA = max(outA, alpha*0.9);\n        }\n      }\n    }\n  }\n/* ДЖЕТТЫ ШИНРАРТА-B: струи в стиле Elite Dangerous — длинная светящаяся плазма,\n     тёплое ядро у полюса, холодное свечение на конце, турбулентные завихрения */\n  if(uPlanet > 2.5){\n    vec3 jC = sC;\n    vec3 jW = camPos - jC;\n    float bJ = rd.y;\n    float dJd = dot(rd, jW);\n    float eJ = jW.y;\n    float denJ = 1.0 - bJ*bJ;\n    if(abs(denJ) > 0.0001){\n      float sJ = (eJ - dJd*bJ)/denJ;\n      float tJ = sJ*bJ - dJd;\n      if(tJ > 0.0){\n        float aJ = abs(sJ);\n        /* длинные струи: вдоль оси до 6.5, колокол у полюса */\n        float along = smoothstep(0.86, 1.02, aJ)*(1.0 - smoothstep(1.15, 6.5, aJ));\n        /* расширение струи с высотой — конус плазмы */\n        float wJ = 0.04;   /* постоянная ширина струи (не расширяется при отлёте) */\n        vec3 cpt = camPos + tJ*rd - jC - vec3(0.0, sJ, 0.0);\n        float rJ = length(cpt);\n        /* турбулентность: закрученные струи — смещение ядра по aJ+second cooperative */\n        float turb = 0.55 + 0.45*sin(aJ*7.0 - uTime*0.0833);\n        float off = 0.30*(1.0 - exp(-aJ*1.4));\n        float prof = exp(-(rJ*rJ)/(wJ*wJ)*0.5);\n        /* тёплое основание / холодная плазма сверху + неоновый обод */\n        float cool = smoothstep(0.8, 4.2, aJ);\n        vec3 jetCol = mix(vec3(1.0,0.55,0.20), vec3(0.45,0.75,1.0), cool);\n        float twinkle = 0.75 + 0.25*sin(uTime*0.0833 + aJ*5.0);\n        /* основной светящийся шлейф */\n        col += jetCol*along*prof*twinkle*1.6;\n        /* яркое ядро */\n        float core = exp(-(rJ*rJ)/(wJ*wJ*0.10)*0.5);\n        col += vec3(0.95,0.97,1.0)*along*core*twinkle*1.1;\n        /* закрутка: лёгкое смещение потока от оси создаёт живой вихрь */\n        float swirl = exp(-( (rJ - off*turb)*(rJ - off*turb) )/(wJ*wJ*0.6)*0.5);\n        col += jetCol*along*swirl*turb*0.6;\n        outA = max(outA, min(1.0, along*(prof*1.6 + core*1.1)));\n      }\n    }\n  }\n  /* дизеринг против бандинга + тонмаппинг + лёгкая гамма + виньетка */\n  col += (hash13(vec3(gl_FragCoord.xy*1.0, fract(uTime)*100.0)) - 0.5)/255.0;\n  col = col/(1.0 + col*0.30);\n  col = pow(col, vec3(0.92));\n  float vig = 1.0 - 0.22*dot(uv*0.55, uv*0.55);\n  col *= max(vig, 0.0);\n  gl_FragColor = vec4(col, outA);\n}";
function mk(gl,t,s,v){ var sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){ var lg=gl.getShaderInfoLog(sh); errs.push((v?'V':'F')+':'+lg); throw new Error('sh'); }
  return sh; }
function setup(cv){
  try{
    var gl=cv.getContext('webgl',{antialias:false,alpha:true,premultipliedAlpha:false,depth:false});
    if(!gl) throw new Error('nogl');
    var vs=mk(gl,gl.VERTEX_SHADER,VERT,true), fs=mk(gl,gl.FRAGMENT_SHADER,FRAG_SRC,false);
    var pr=gl.createProgram(); gl.attachShader(pr,vs); gl.attachShader(pr,fs); gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error('link:'+gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    var b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    var a=gl.getAttribLocation(pr,'aPos'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);

      uCamA:gl.getUniformLocation(pr,'uCamA'), uSunA:gl.getUniformLocation(pr,'uSunA'),
      uPL:gl.getUniformLocation(pr,'uPlanet'), uSP:gl.getUniformLocation(pr,'uSplash'),
      p:parseInt(cv.dataset.planet,10) };
  }catch(e){ errs.push(cv.dataset.planet+':'+e.message); return null; }
}
var bodies=[];
document.querySelectorAll('canvas.orb').forEach(function(cv){ cv.width=cv.height=360; var h=setup(cv); if(h) bodies.push(h); });
var ORBIT_PERIOD=2275.193, DAY_CYCLE=3600.000, CAM_R=1.034047;
var last=performance.now();
function frame(now){
  var dt=Math.min((now-last)/1000,0.1); last=now;
  for(var i=0;i<bodies.length;i++){
    var B=bodies[i], g=B.gl, tnow=performance.now()/1000;
    var simT=tnow*60;

}
