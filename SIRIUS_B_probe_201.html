<script>
(function(){
  var b=document.querySelector('.mishka-wrap .bear');
  if(!b) return;
  function jump(){
    b.classList.remove('jumping');
    void b.offsetWidth;
    b.classList.add('jumping');
  }
  b.addEventListener('pointerdown',jump);
  b.addEventListener('animationend',function(e){ if(e.animationName==='mg-jump') b.classList.remove('jumping'); });

  /* Реакция медведя на нажатие нотных клавиш (раскладки из «УПРАВЛЕНИЕ»):
     2 ряда: ZSXDCVGBHNM,.;/' + Q2W3ER5T6Y7UI9O0P[]'
     1 ряд:  AWSEDFTGYHUJKOLP;'
     Любая из них заставляет медведя прыгнуть в такт нажатию.
     Автоповтор (e.repeat) пропускаем, чтобы зажатая клавиша не везла перезапуск. */
  var NOTE_KEYS={};
  ('ZSXDCVGBHNM,.;/\"Q2W3ER5T6Y7UI9O0P[]\'AWSEDFTGYHUJKOLP').split('').forEach(function(k){ NOTE_KEYS[k.toLowerCase()]=1; });
  document.addEventListener('keydown',function(e){
    if(e.repeat) return;
    var t=e.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
    if(!NOTE_KEYS[(e.key||'').toLowerCase()]) return;
    jump();
  });
})();
</script>

const ORBIT_PERIOD_SIM_SEC = (2*Math.PI*PLANET_RADIUS_KM/FLIGHT_SPEED_KMH)*3600.0;

/* шейдеры — дословно из стенда R46, без изменений */
const VERT = 'attribute vec2 aPos;\nvoid main(){ gl_Position = vec4(aPos, 0.0, 1.0); }';



const FRAG_BASE = `precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform float uCamA;
uniform float uSunA;
uniform vec3 uL0;
uniform vec3 uL1;
uniform float uPlanet;
uniform float uSplash;

#define R    1.0
#define CAMR __CAMR__
#define FOT  __FOT__

/* --- хэш и шумы (средний слой) --- */
float hash13(vec3 p){
  p = fract(p*0.3183099 + vec3(0.1,0.2,0.3));
  p *= 17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}
float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f*f*(3.0-2.0*f);
  float n0=hash13(i);
  float n1=hash13(i+vec3(1.0,0.0,0.0));
  float n2=hash13(i+vec3(0.0,1.0,0.0));
  float n3=hash13(i+vec3(1.0,1.0,0.0));
  float n4=hash13(i+vec3(0.0,0.0,1.0));
  float n5=hash13(i+vec3(1.0,0.0,1.0));
  float n6=hash13(i+vec3(0.0,1.0,1.0));
  float n7=hash13(i+vec3(1.0,1.0,1.0));
  return mix(mix(mix(n0,n1,f.x),mix(n2,n3,f.x),f.y),
             mix(mix(n4,n5,f.x),mix(n6,n7,f.x),f.y),f.z);
}
/* тяжёлый: 5 октав */
float fbm5(vec3 p){
  float v=0.0, a=0.5;
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=p*2.07+vec3(1.7); a*=0.5; }
  return v;
}
/* средний: 3 октавы */
float fbm3(vec3 p){
  float v=0.0, a=0.5;
  for(int i=0;i<3;i++){ v+=a*vnoise(p); p=p*2.13; a*=0.5; }
  return v;
}

/* --- звёзды: три слоя гридов с мерцанием --- */
vec3 stars(vec3 rd){
  vec3 c = vec3(0.0);
  for(int L=0; L<3; L++){
    float sc = 90.0 + float(L)*80.0;
    vec3 g  = rd*sc;
    vec3 id = floor(g);
    vec3 fr = fract(g) - 0.5;
    float h = hash13(id + float(L)*37.0);
    if(h > 0.975){
      vec3 off = (vec3(hash13(id+1.0), hash13(id+2.0), hash13(id+3.0)) - 0.5)*0.6;
      float d  = length(fr - off);
      float tw = 0.55 + 0.45*sin(uTime*(1.0+h*4.0) + h*40.0);
      float s  = (1.0 - smoothstep(0.0, 0.14, d))*tw;
      vec3 tint = mix(vec3(0.70,0.80,1.0), vec3(1.0,0.85,0.60), hash13(id+4.0));
      c += s*tint*(0.35 + h*0.8);
    }
  }
  return c;
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes)/uRes.y;

  /* --- камера: орбита через полюса, ось планеты = Y --- */
  vec3 camPos = vec3(cos(uCamA)*CAMR, sin(uCamA)*CAMR, 0.0);
if(uPlanet > 2.5){ camPos.y -= 0.14*uSplash; }
  vec3 fwd = vec3(-sin(uCamA), cos(uCamA), 0.0);
  vec3 up0 = normalize(camPos);
  fwd = normalize(mix(fwd, -up0, 0.22));
  vec3 right = normalize(cross(fwd, up0));
  vec3 upv   = cross(right, fwd);
  vec3 rd    = normalize(fwd + (uv.x*right + uv.y*upv)*FOT);

  /* солнце — экваториальный круг с лёгким наклоном; луна — отстает на 0.9 рад */
  float st = sin(uSunA), ct = cos(uSunA);
    vec3 sunDir = normalize(uL0);
    vec3 moonDir = normalize(uL1);

  /* пересечение луча со сферой планеты */
  vec3 sC = (uPlanet > 2.5) ? vec3(0.0, -0.14*uSplash, 0.0) : vec3(0.0);
  vec3 wC = camPos - sC;
  float b    = dot(wC, rd);
  float cc   = dot(wC, wC) - R*R;
  float disc = b*b - cc;
  float tHit = -b - sqrt(max(disc, 0.0));
  bool hitP  = (disc > 0.0) && (tHit > 0.0);

  float dayLocal = dot(normalize(camPos), sunDir);
  float dayness  = smoothstep(-0.25, 0.30, dayLocal);

  vec3 col = vec3(0.0);

  if(hitP){
    /* ---- ПЛАНЕТА ---- */
    vec3 p = camPos + rd*tHit;
    vec3 n = normalize(p);
    float nl  = dot(n, sunDir);
    float lit = smoothstep(-0.06, 0.18, nl);

    /* континенты: тяжёлый fbm по нормали, планета медленно вращается */
    vec3  sp   = n*2.6 + vec3(0.0, 0.0, uTime*0.004);
    float cont = fbm5(sp);
    float land = smoothstep(0.46, 0.54, cont);
    /* ДЕТАЛЬ: волнение береговой линии (турбулентность) — плавнее граница суши/океана */
    float coast = fbm3(n*8.0 + vec3(0.0, uTime*0.006, 0.0));
    land = mix(land, smoothstep(0.40, 0.60, cont - 0.10*coast), 0.35);
    vec3 ocean = vec3(0.02,0.10,0.22);
    vec3 landc = mix(vec3(0.08,0.26,0.10), vec3(0.42,0.36,0.20), smoothstep(0.52,0.78,cont));

    /* ДЕТАЛЬ: микро-рельеф суши (горы/равнины) — доп. fbm, не меняет границы суши */
    float mdet = fbm3(n*12.0 + vec3(uTime*0.003, uTime*0.001, 0.0));
    landc *= 0.85 + 0.30*mdet;

    float ice  = smoothstep(0.80, 0.94, abs(n.y));
    vec3 surf  = mix(ocean, landc, land);
    surf = mix(surf, vec3(0.85,0.90,0.95), ice);

    /* облака: второй тяжёлый слой, свой дрейф */
    float cl = fbm5(n*4.2 + vec3(uTime*0.010, 0.0, -uTime*0.006));
    cl = smoothstep(0.50, 0.74, cl);
    surf = mix(surf, vec3(0.95,0.97,1.0), cl*0.9);

    vec3 colDay = surf*(0.15 + 1.05*lit);
    /* блик океана */
    vec3 hv = normalize(sunDir - rd);
    float spec = pow(max(dot(n,hv),0.0), 60.0)*(1.0-land)*(1.0-ice)*(1.0-cl)*lit;
    colDay += vec3(0.9,0.95,1.0)*spec*0.6;

    /* ночь: огни городов на суше, мерцание */
    float cellH = hash13(floor(n*90.0));
    float city  = step(0.80, cellH)*land*(1.0-cl)*(1.0-ice);
    vec3 colNight = surf*0.03 + vec3(1.0,0.75,0.35)*city*0.9*(0.6+0.4*sin(uTime*2.0+cellH*50.0));

    col = mix(colNight, colDay, lit);

    /* ШИНРАРТА-B: поверхность как у НГАЛИН, эффект голубой #eff5f9 */
    if(uPlanet > 2.5){
      vec3 nS = normalize(p - sC);
      float rock = fbm5(nS*3.2);
      vec3 surfS = mix(vec3(0.05,0.045,0.05), vec3(0.16,0.13,0.12), rock);
      float riv1 = fbm3(nS*3.5 + vec3(0.0, uTime*0.02, uTime*0.013));
      float riv2 = fbm3(nS*7.0 - vec3(uTime*0.015, 0.0, 0.0));
      float lavS = (1.0 - smoothstep(0.0, 0.02, abs(riv1 - 0.5))) + 0.7*(1.0 - smoothstep(0.0, 0.015, abs(riv2 - 0.5)));
      lavS = min(lavS, 1.0);
      float pulS = 0.75 + 0.25*sin(uTime*1.5 + riv1*40.0);
      col = surfS*(0.05 + 0.9*lit) + vec3(0.937,0.961,0.976)*lavS*pulS*(1.6 + (1.0 - lit)*2.6);
      float fresS = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);
      col += vec3(0.60,0.80,1.0)*fresS*0.45;
    }

    /* атмосферный ободок на лимбе */
    float fres = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);
    col += vec3(0.25,0.5,1.0)*fres*(0.2 + 0.8*lit)*1.1;

    /* полярные сияния на ночном полюсе */
    float aurZ = smoothstep(0.72, 0.92, abs(n.y))*(1.0-lit);
    float aur  = fbm3(n*5.0 + vec3(0.0, uTime*0.2, 0.0));
    col += vec3(0.10,0.90,0.45)*aurZ*smoothstep(0.45,0.75,aur)*0.55;
  } else {
    /* ---- НЕБО ---- */
    float daySky = smoothstep(-0.15, 0.35, dayLocal);

    /* ночь: база + звёзды + млечный путь */
    vec3 night = vec3(0.003,0.005,0.011);
    night += stars(rd)*1.3;
    float bandW = pow(max(1.0 - abs(dot(rd, normalize(vec3(0.35,0.85,0.40)))), 0.0), 5.0);
    night += vec3(0.45,0.5,0.7)*bandW*fbm3(rd*4.0)*0.42;
    night += vec3(0.8,0.75,0.6)*bandW*bandW*0.12; /* тёплая центральная полоса млечного пути */

    /* день: градиент к горизонту, зарево у солнца, облака на куполе */
    float horiz = 1.0 - abs(dot(rd, up0));
    vec3 day = mix(vec3(0.22,0.42,0.82), vec3(0.60,0.80,1.0), horiz*0.85);
    float sunAmt = max(dot(rd, sunDir), 0.0);
    day += vec3(0.45,0.80,1.0)*pow(sunAmt, 8.0)*0.35; /* голубое свечение пульсара */
    day += vec3(0.35,0.60,0.92)*pow(sunAmt, 3.0)*0.14;
    float skycl = fbm5(rd*3.0 + vec3(uTime*0.020, 0.0, uTime*0.013));
    skycl = smoothstep(0.52, 0.78, skycl)*(0.30 + 0.70*horiz);
    day = mix(day, vec3(1.0), skycl*0.75);

    col = mix(night, day, daySky);

    if(uPlanet > 2.5){ col = night; }

    /* голубой ореол атмосферы у лимба (лучи мимо планеты) */
    float closest = length(camPos - rd*b);
    /* Гасим ореол, когда луч уходит ОТ планеты (b>0 — ближайшая к центру точка
       луча позади камеры): при развороте камеры на 180° не должно быть засветки.
       Атмосфера планеты остаётся при взгляде на неё (b<0). */
    float atmFwd = 1.0 - smoothstep(-0.2, 0.4, b);
    float atmo = (1.0 - smoothstep(1.0, 1.22, closest))*atmFwd;
    if(uPlanet < 2.5){ col += vec3(0.30,0.55,1.0)*atmo*dayness*0.85; } else { col += vec3(0.05,0.10,0.24)*atmo; }

  }


  /* ДЖЕТТЫ ШИНРАРТА-B: струи в стиле Elite Dangerous — длинная светящаяся плазма,
     тёплое ядро у полюса, холодное свечение на конце, турбулентные завихрения */
  if(uPlanet > 2.5){
    vec3 jC = sC;
    vec3 jW = camPos - jC;
    float bJ = rd.y;
    float dJd = dot(rd, jW);
    float eJ = jW.y;
    float denJ = 1.0 - bJ*bJ;
    if(abs(denJ) > 0.0001){
      float sJ = (eJ - dJd*bJ)/denJ;
      float tJ = sJ*bJ - dJd;
      if(tJ > 0.0){
        float aJ = abs(sJ);
        /* длинные струи: вдоль оси до 6.5, колокол у полюса */
        float along = smoothstep(0.86, 1.02, aJ)*(1.0 - smoothstep(1.15, 6.5, aJ));
        /* расширение струи с высотой — конус плазмы */
        float wJ = 0.04;   /* постоянная ширина струи (не расширяется при отлёте) */
        vec3 cpt = camPos + tJ*rd - jC - vec3(0.0, sJ, 0.0);
        float rJ = length(cpt);
        /* турбулентность: закрученные струи — смещение ядра по aJ+second cooperative */
        float turb = 0.55 + 0.45*sin(aJ*7.0 - uTime*0.0833);
        float off = 0.30*(1.0 - exp(-aJ*1.4));
        float prof = exp(-(rJ*rJ)/(wJ*wJ)*0.5);
        /* тёплое основание / холодная плазма сверху + неоновый обод */
        float cool = smoothstep(0.8, 4.2, aJ);
        vec3 jetCol = mix(vec3(1.0,0.55,0.20), vec3(0.45,0.75,1.0), cool);
        float twinkle = 0.75 + 0.25*sin(uTime*0.0833 + aJ*5.0);
        /* основной светящийся шлейф */
        col += jetCol*along*prof*twinkle*1.6;
        /* яркое ядро */
        float core = exp(-(rJ*rJ)/(wJ*wJ*0.10)*0.5);
        col += vec3(0.95,0.97,1.0)*along*core*twinkle*1.1;
        /* закрутка: лёгкое смещение потока от оси создаёт живой вихрь */
        float swirl = exp(-( (rJ - off*turb)*(rJ - off*turb) )/(wJ*wJ*0.6)*0.5);
        col += jetCol*along*swirl*turb*0.6;
      }
    }
  }
  /* дизеринг против бандинга */
  col += (hash13(vec3(gl_FragCoord.xy*1.0, fract(uTime)*100.0)) - 0.5)/255.0;
  /* PBR-тонмаппинг: white-preserving Reinhard (SuperDuperVanilla) + гамма 2.2 */
  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
  float wpres = 1.5; /* WHITE_PRESERVATION */
  float tm = (luma * (1.0 + luma / (wpres*wpres))) / (1.0 + luma);
  col = pow(max(col * (tm / max(luma, 1e-6)), 0.0), vec3(1.0 / 2.2));
  /* мягкая виньетка */
  float vig = 1.0 - 0.16*dot(uv*0.6, uv*0.6);
  col *= max(vig, 0.0);
  gl_FragColor = vec4(col, 1.0);
}`;

const FRAG = `precision highp float;

uniform float uTime;
uniform float uCamA;
uniform float uSunA;
uniform vec3 uL0;
uniform vec3 uL1;

uniform float uRingOn; uniform vec3 uRingC; uniform float uRingSp; uniform float uRingIn; uniform float uRingOut;

uniform float uPIcur;     /* строка палитры текущей планеты */
uniform vec3  uOceanC; uniform vec3 uLand1C; uniform vec3 uLand2C; uniform vec3 uIceC; uniform float uIceCov;

/* CUR-страж: 1 = рисуется текущая планета (живые настройки), 0 = дальние (константы игры) */
float gCur = 0.0;
#define CURE(u, d) ((gCur > 0.5) ? (u) : (d))
#define SPIN ((gCur > 0.5) ? uSpin : (paln(9.0, 0.0)*8.0))
#define SCL  ((gCur > 0.5) ? uSurfScale : (paln(7.0, 0.0)*8.0))
float gRow = 0.0;
vec4 palV(float slot){ return texture2D(uPal, vec2((slot + 0.5)/16.0, (clamp(gRow, 0.0, 8.0) + 0.5)/9.0)); }
vec3 palc(float slot){ return palV(slot).rgb; }
float paln(float slot, float ch){
  vec4 v = palV(slot);
  return (ch < 0.5) ? v.r : (ch < 1.5) ? v.g : (ch < 2.5) ? v.b : v.a;
}
    /* гиперпространство: тип (индекс) 4-й планеты */

#define R    1.0

/* --- хэш и шумы (средний слой) --- */

  p *= 17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}
float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f*f*(3.0-2.0*f);
  float n0=hash13(i);
  float n1=hash13(i+vec3(1.0,0.0,0.0));
  float n2=hash13(i+vec3(0.0,1.0,0.0));

  float n6=hash13(i+vec3(0.0,1.0,1.0));
  float n7=hash13(i+vec3(1.0,1.0,1.0));
  return mix(mix(mix(n0,n1,f.x),mix(n2,n3,f.x),f.y),
             mix(mix(n4,n5,f.x),mix(n6,n7,f.x),f.y),f.z);
}
/* тяжёлый: 5 октав */
float fbm5(vec3 p){

}

float fbm3(vec3 p){

}

    float sc = 90.0 + float(L)*80.0;
    vec3 g  = rd*sc;
    vec3 id = floor(g);
    vec3 fr = fract(g) - 0.5;
    float h = hash13(id + float(L)*37.0);
    if(h > 0.975){
      vec3 off = (vec3(hash13(id+1.0), hash13(id+2.0), hash13(id+3.0)) - 0.5)*0.6;
      float d  = length(fr - off);

      float s  = (1.0 - smoothstep(0.0, 0.14, d))*tw;

    }
  }

}

/* ОСВЕЩЁННАЯ ПОВЕРХНОСТЬ ПЛАНЕТЫ: единый источник истины — близкая и дальние
   планеты рисуются одной функцией, поэтому ЛОД 1-в-1 повторяет анимацию реальной. */
vec3 shadeSurface(int k, vec3 n, float lit, vec3 rd, vec3 sunDir){
  vec3 r = vec3(0.0);
  if(k == 0){
    vec3  sp   = n*(2.6*SCL) + vec3(0.0, 0.0, uTime*0.004*SPIN);
    float cont = fbm5(sp);
    float land = smoothstep(0.46, 0.54, cont);
    float coast = fbm3(n*(8.0*SCL) + vec3(0.0, uTime*0.006*SPIN, 0.0));
    land = mix(land, smoothstep(0.40, 0.60, cont - 0.10*coast), 0.35);
    vec3 ocean = palc(0.0);
    vec3 landc = mix(palc(1.0), palc(2.0), smoothstep(0.52,0.78,cont));
    float mdet = fbm3(n*(12.0*SCL) + vec3(uTime*0.003*SPIN, uTime*0.001*SPIN, 0.0));
    landc *= 0.85 + 0.30*mdet;
    float ice  = smoothstep(0.94 - 0.28*paln(7.0, 1.0), 0.94, abs(n.y));
    vec3 surf  = mix(ocean, landc, land);
    surf = mix(surf, palc(3.0), ice);
    float cl = fbm5(n*(4.2*SCL) + vec3(uTime*0.010*SPIN, 0.0, -uTime*0.006*SPIN));
    cl = smoothstep(0.62 - (0.12 + 0.24*paln(7.0, 2.0)), 0.62 + (0.12 + 0.24*paln(7.0, 2.0)), cl);
    surf = mix(surf, palc(4.0), cl*0.9);
    vec3 colDay = surf*(0.15 + 1.05*lit);
    vec3 hv = normalize(sunDir - rd);
    float spec = pow(max(dot(n,hv),0.0), 60.0)*(1.0-land)*(1.0-ice)*(1.0-cl)*lit;
    colDay += vec3(0.9,0.95,1.0)*spec*0.6;
    float cellH = hash13(floor(n*90.0));
    float city  = step(0.80, cellH)*land*(1.0-cl)*(1.0-ice);
    vec3 colNight = surf*0.03 + palc(5.0)*city*paln(8.0, 0.0)*(0.6+0.4*sin(uTime*2.0+cellH*50.0));
    r = mix(colNight, colDay, lit);
    float fres = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);
    r += vec3(0.25,0.5,1.0)*fres*(0.2 + 0.8*lit)*1.1;
    float aurZ = smoothstep(0.72, 0.92, abs(n.y))*(1.0-lit);
    float aur  = fbm3(n*5.0 + vec3(0.0, uTime*0.2, 0.0));
    r += palc(6.0)*aurZ*smoothstep(0.45,0.75,aur)*paln(8.0, 1.0);
  } else if(k == 1){
    float lat = n.y;
    float warp = fbm3(n*(2.6*SCL) + vec3(uTime*0.008*SPIN, 0.0, 0.0));
    float bands = sin(lat*16.0 + warp*3.2);
    float bands2 = sin(lat*34.0 + 1.7);
    vec3 band1 = palc(0.0);
    vec3 band2 = palc(1.0);
    vec3 band3 = palc(2.0);
    vec3 surf = mix(band1, band2, smoothstep(-0.6, 0.6, bands));
    surf = mix(surf, band3, 0.5 + 0.5*sin(lat*7.0 + 1.0));
    surf = mix(surf, band2*0.92, 0.25*smoothstep(0.3, 0.9, bands2));
    vec3 sdir = normalize(vec3(cos(uTime*0.02*SPIN + 2.0), -0.30, sin(uTime*0.02*SPIN + 2.0)));
    float angS = acos(clamp(dot(n, sdir), -1.0, 1.0));
    float storm = 1.0 - smoothstep(0.05, 0.16, angS);
    surf = mix(surf, palc(3.0), storm*paln(7.0, 3.0));
    surf *= 0.92 + 0.16*fbm3(n*(9.0*SCL) + vec3(uTime*0.05*SPIN, 0.0, 0.0));
    r = surf*(0.06 + 1.05*lit);
    float fresA = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);
    r += palc(4.0)*fresA*(0.2 + 0.8*lit)*0.8;
    float azi = dot(n, rd);
    float entry = smoothstep(-0.20, 0.05, azi);
    float blurAtm = entry*0.50;
    r = mix(r, palc(5.0)*(0.5 + 0.6*lit), blurAtm);
    float fogT = fbm3(n*6.0 + vec3(uTime*0.02, 0.0, uTime*0.011))-0.5;
    float fogB = smoothstep(-0.10, 0.30, fogT);
    float fogWide = 0.5 + 0.5*sin(lat*20.0 + fogT*7.0 + uTime*0.03);
    float fogAmt = fogB*(0.30 + 0.70*fogWide)*(0.55 + 0.45*entry)*(0.75 + 0.25*lit);
    r = mix(r, palc(6.0), clamp(fogAmt, 0.0, 1.0)*0.55);
  } else if(k == 2){
    float rock = fbm5(n*3.2);
    vec3 surf = mix(palc(0.0), palc(1.0), rock);
    float riv1 = fbm3(n*(3.5*SCL) + vec3(0.0, uTime*0.02*SPIN, uTime*0.013*SPIN));
    float riv2 = fbm3(n*(7.0*SCL) - vec3(uTime*0.015*SPIN, 0.0, 0.0));
    float lava = (1.0 - smoothstep(0.0, 0.02, abs(riv1 - 0.5)))
               + 0.7*(1.0 - smoothstep(0.0, 0.015, abs(riv2 - 0.5)));
    lava = min(lava, 1.0);
    float pulse = 0.75 + 0.25*sin(uTime*1.5*(paln(8.0, 2.0)*8.0) + riv1*40.0);
    r = surf*(0.05 + 0.9*lit) + palc(2.0)*lava*pulse*(1.4 + (1.0 - lit)*2.2);
    float fresP = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);
    r += palc(3.0)*fresP*0.25;
  } else {
    float rock = fbm5(n*3.2);
    vec3 surf = mix(palc(0.0), palc(1.0), rock);
    float riv1 = fbm3(n*(3.5*SCL) + vec3(0.0, uTime*0.02*SPIN, uTime*0.013*SPIN));
    float riv2 = fbm3(n*(7.0*SCL) - vec3(uTime*0.015*SPIN, 0.0, 0.0));
    float lava = (1.0 - smoothstep(0.0, 0.02, abs(riv1 - 0.5)))
               + 0.7*(1.0 - smoothstep(0.0, 0.015, abs(riv2 - 0.5)));
    lava = min(lava, 1.0);
    float pulse = 0.75 + 0.25*sin(uTime*1.5*(paln(8.0, 2.0)*8.0) + riv1*40.0);
    r = surf*(0.05 + 0.9*lit) + palc(2.0)*lava*pulse*(1.6 + (1.0 - lit)*2.6);
    float fresP = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);
    r += palc(3.0)*fresP*0.45;
  }
  return r;
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes)/uRes.y;

  /* --- камера: свободный полёт — позиция и базис приходят из JS --- */
  vec3 camPos = uCamPos;
  vec3 fwd    = normalize(uCamF);
  vec3 right  = normalize(uCamR);
  vec3 upv    = normalize(uCamU);
  vec3 rd     = normalize(fwd + (uv.x*right + uv.y*upv)*FOT);
  vec3 up0    = normalize(camPos);

  /* солнце — экваториальный круг с лёгким наклоном; луна — отстает на 0.9 рад */
  float st = sin(uSunA), ct = cos(uSunA);
    vec3 sunDir = normalize(uL0);
    vec3 moonDir = normalize(uL1);

  /* пересечение луча со сферой планеты */
  vec3 sC = (uPlanet > 2.5) ? vec3(0.0, -0.14*uSplash, 0.0) : vec3(0.0);
  vec3 wC = camPos - sC;
  float b    = dot(wC, rd);
  float cc   = dot(wC, wC) - R*R;
  float disc = b*b - cc;
  float tHit = -b - sqrt(max(disc, 0.0));
  bool hitP  = (uHyper < 0.5) && (disc > 0.0) && (tHit > 0.0); /* PHANTOM-GATE: в гипере/суперкруизе сфера текущей планеты не существует — её место занимает дальний цикл реестра */

  float dayLocal = dot(normalize(camPos), sunDir);
  float dayness  = smoothstep(-0.25, 0.30, dayLocal);

  /* ПУЗЫРЬ АТМОСФЕРЫ: дневное небо живёт только внутри пузыря R=1.90 */
  float camR  = length(camPos);
  float atmIn = 1.0 - smoothstep(1.786, 1.90, camR);

  /* цвет атмосферы по планете: ХИТОМИ голубая, ЧИЗИЯ #905000, НГАЛИН #300090 */
  vec3 atmC = uAtmC;

  vec3 col = vec3(0.0);

  if(hitP){
    /* ---- ПЛАНЕТА (ЛОД 1-в-1: единая функция поверхности) ---- */
    vec3 p = camPos + rd*tHit;
    vec3 n = normalize(p - sC);
    float nl  = dot(n, sunDir);
    float lit = smoothstep(-0.06, 0.18, nl);
    int ki = (uPlanet < 0.5) ? 0 : ((uPlanet < 1.5) ? 1 : ((uPlanet < 2.5) ? 2 : 3));
    gRow = uPIcur;
    gCur = 1.0;
    col = shadeSurface(ki, n, lit, rd, sunDir);
  } else {
    /* ---- НЕБО ---- */
    /* ГИПЕРПРОСТРАНСТВО = готовое небо планеты ХИТОМИ (без магмы/градиентов),
       солнце заморожено в одной точке (см. uSunA при hypOn), луны выкинуты. */
    float daySky = smoothstep(-0.15, 0.35, dayLocal);

    /* ночь: база + звёзды + млечный путь */
    vec3 night = vec3(0.003,0.005,0.011);
    night += stars(rd)*1.3;
    float bandW = pow(max(1.0 - abs(dot(rd, normalize(vec3(0.35,0.85,0.40)))), 0.0), 5.0);
    night += vec3(0.45,0.5,0.7)*bandW*fbm3(rd*4.0)*0.42;
    night += vec3(0.8,0.75,0.6)*bandW*bandW*0.12; /* тёплая центральная полоса млечного пути */

    /* день: градиент к горизонту, зарево у солнца, облака на куполе */
    float horiz = 1.0 - abs(dot(rd, up0));
    vec3 day = mix(atmC*0.83, mix(atmC, vec3(1.0), 0.42), horiz*0.85);
    float sunAmt = max(dot(rd, sunDir), 0.0);
    day += vec3(0.45,0.80,1.0)*pow(sunAmt, 8.0)*0.35; /* голубое свечение пульсара */
    day += vec3(0.35,0.60,0.92)*pow(sunAmt, 3.0)*0.14;
    float skycl = fbm5(rd*3.0 + vec3(uTime*0.020, 0.0, uTime*0.013));
    skycl = smoothstep(0.52, 0.78, skycl)*(0.30 + 0.70*horiz);
    day = mix(day, vec3(1.0), skycl*0.75);

    col = mix(night, day, daySky*atmIn);
    if(uPlanet > 2.5){ col = night; } else {
    }

    /* GRID-256: межзвёздная сетка — 1 клетка = 256 св.лет, только в транзите */
    if(uHyper > 0.5 && abs(rd.y) > 1.0e-4){
      float tg = -camPos.y/rd.y;
      if(tg > 0.0){
        vec3 gpt = camPos + rd*tg;
        vec2 gq = gpt.xz;
        vec2 gd = abs(fract(gq + 0.5) - 0.5);
        float lw = tg*0.0012;
        float gline = 1.0 - smoothstep(lw, lw*3.0, min(gd.x, gd.y));
        float gfade = exp(-tg*0.016);
        col = mix(col, vec3(0.10,0.55,0.35), clamp(gline*gfade, 0.0, 1.0)*0.9);
      }
    }

    /* ореол атмосферы у лимба (лучи мимо планеты) */
    float closest = length(camPos - rd*b);
    /* Гасим ореол, когда луч уходит ОТ планеты (b>0 — ближайшая к центру точка
       луча позади камеры): при развороте камеры на 180° не должно быть засветки.
       Атмосфера планеты остаётся при взгляде на неё (b<0). */
    float atmFwd = 1.0 - smoothstep(-0.2, 0.4, b);
    float atmo = (1.0 - smoothstep(1.0, uAtmSize, closest))*atmFwd;
    if(uPlanet < 2.5){
      col += atmC*atmo*dayness*atmIn*uAtmGlow;
      /* ЧИЗИЯ: анизотропное размытие входа в атмосферу — внешний ореол шире и мягче,
         по мере входа в толщу атмосферы (atmo 0→1) добавляется туманное свечение до 50% */
      if(uPlanet > 0.5 && uPlanet < 1.5){
        float atmoIn = smoothstep(0.15, 1.0, atmo);
        col = mix(col, vec3(0.88, 0.70, 0.42)*(0.5 + 0.5*dayness), atmoIn*0.5);
      }
    } else { col += CURE(uAtmC, vec3(0.05,0.10,0.24))*atmo; }

  }
  


  /* ДЖЕТТЫ ШИНРАРТА-B: струи в стиле Elite Dangerous — длинная светящаяся плазма,
     тёплое ядро у полюса, холодное свечение на конце, турбулентные завихрения */
  if(uHyper <= 0.5 && (uPlanet > 2.5 || uJetsOn > 0.5)){
    vec3 jC = (uPlanet > 2.5) ? vec3(0.0, -0.14*uSplash, 0.0) : vec3(0.0);
    vec3 jW = camPos - jC;
    float bJ = rd.y;
    float dJd = dot(rd, jW);
    float eJ = jW.y;
    float denJ = 1.0 - bJ*bJ;
    if(abs(denJ) > 0.0001){
      float sJ = (eJ - dJd*bJ)/denJ;
      float tJ = sJ*bJ - dJd;
      if(tJ > 0.0){
        float aJ = abs(sJ);
        /* длинные струи: вдоль оси до 6.5, колокол у полюса */
        float along = smoothstep(0.86, 1.02, aJ)*(1.0 - smoothstep(1.15, uJetsLen, aJ));
        /* расширение струи с высотой — конус плазмы */
        float wJ = 0.04;   /* постоянная ширина струи (не расширяется при отлёте) */
        vec3 cpt = camPos + tJ*rd - jC - vec3(0.0, sJ, 0.0);
        float rJ = length(cpt);
        /* турбулентность: закрученные струи — смещение ядра по aJ */
        float turb = 0.55 + 0.45*sin(aJ*7.0 - uTime*uJetsSp);
        float off = 0.30*(1.0 - exp(-aJ*1.4));
        float prof = exp(-(rJ*rJ)/(wJ*wJ)*0.5);
        /* тёплое основание / холодная плазма сверху + неоновый обод */
        float cool = smoothstep(0.8, 4.2, aJ);
        vec3 jetCol = mix(uJetsC1, uJetsC2, cool);
        float twinkle = 0.75 + 0.25*sin(uTime*uJetsSp + aJ*5.0);
        /* основной светящийся шлейф */
        col += jetCol*along*prof*twinkle*1.6;
        /* яркое ядро */
        float core = exp(-(rJ*rJ)/(wJ*wJ*0.10)*0.5);
        col += vec3(0.95,0.97,1.0)*along*core*twinkle*1.1;
        /* закрутка: лёгкое смещение потока от оси создаёт живой вихрь */
        float swirl = exp(-( (rJ - off*turb)*(rJ - off*turb) )/(wJ*wJ*0.6)*0.5);
        col += jetCol*along*swirl*turb*0.6;
      }
    }
  }
  /* ---- ДАЛЬНИЕ ПЛАНЕТЫ (3D-ЛОД) + ГИПЕР 4-я: корректное перекрытие без z-буфера.
       Ищем ближайшую по лучу сферу (минимальный t) среди всех кандидатов и рисуем
       только её — это убирает просвечивание/наложение планет сквозь планеты. ---- */
  float bestT = 1.0e9;
  vec3 sphCol = vec3(0.0);
  bool haveSph = false;
  for(int di = 0; di < 8; di++){
    if(di >= int(uPCount + 0.5)) break;
    vec3 pc = uP[di];
    int dk = int(uPKa[di] + 0.5);
    if(di < int(uPCount + 0.5)){
      vec3 wc = camPos - pc;
      float bb = dot(wc, rd);
      float cc2 = dot(wc, wc) - R*R;
      float dsc = bb*bb - cc2;
      if(dsc > 0.0){
        float th = -bb - sqrt(dsc);
        if(th > 0.0 && th < bestT && (!hitP || th < tHit)){
          vec3 pp = camPos + rd*th;
          vec3 nn = normalize(pp - pc);
          float dnl  = dot(nn, sunDir);
          float dlit = smoothstep(-0.02, 0.10, dnl);
          gRow = uPIa[di];
          gCur = 0.0;
          sphCol = shadeSurface(dk, nn, dlit, rd, sunDir);
          float muL = clamp(dot(nn, -rd), 0.0, 1.0);
          sphCol *= (0.38 + 0.62*pow(muL, 0.55));
          float bt2 = (dnl - 0.015)/0.085;
          float bandT = exp(-bt2*bt2);
          sphCol += vec3(1.0, 0.44, 0.20)*bandT*0.30*max(dlit, 0.12);
          bestT = th; haveSph = true;
        }
      }
    }
  }
  /* гиперпространство: 4-я сфера (текущая планета, мировые координаты) — тоже кандидат */
  if(uHyper > 0.5){
    vec3 wc4 = camPos - uP4;
    float bb4 = dot(wc4, rd);
    float cc4 = dot(wc4, wc4) - R*R;
    float ds4 = bb4*bb4 - cc4;
    if(ds4 > 0.0){
      float th4 = -bb4 - sqrt(ds4);
      if(uHyper > 0.5 && th4 > 0.0 && th4 < bestT && (!hitP || th4 < tHit)){
        vec3 pp4 = camPos + rd*th4;
        vec3 nn4 = normalize(pp4 - uP4);
        float nl4  = dot(nn4, sunDir);
        float lit4 = smoothstep(-0.02, 0.10, nl4);
        gRow = uPIcur;
        gCur = 1.0;
        sphCol = shadeSurface(int(uPK4 + 0.5), nn4, lit4, rd, sunDir);
        float muL4 = clamp(dot(nn4, -rd), 0.0, 1.0);
        sphCol *= (0.38 + 0.62*pow(muL4, 0.55));
        float bt24 = (nl4 - 0.015)/0.085;
        float bandT4 = exp(-bt24*bt24);
        sphCol += vec3(1.0, 0.44, 0.20)*bandT4*0.30*max(lit4, 0.12);
        bestT = th4; haveSph = true;
      }
    }
  }
  if(haveSph){ col = sphCol; }
/* ---- КОЛЬЦА АУРЕЛИИ: плоскость с наклоном, щель, тень планеты ---- */
  /* RING-DEPTH: кольца — последний слой глубины (после планет); окклюзия на пиксель */
  if(uHyper <= 0.5 && uRingOn > 0.5){
    vec3 nR = normalize(vec3(0.22, 1.0, 0.18));
    float denom = dot(rd, nR);
    if(abs(denom) > 0.0035){
      float tR = -dot(camPos, nR)/denom;
      if(tR > 0.05 && (!hitP || tR < tHit) && (!haveSph || tR < bestT)){
        vec3 q = camPos + rd*tR;
        float rr = length(q);
        if(rr > uRingIn && rr < uRingOut){
          float gap = smoothstep(mix(uRingIn,uRingOut,0.3444), mix(uRingIn,uRingOut,0.3667), rr)*(1.0 - smoothstep(mix(uRingIn,uRingOut,0.4333), mix(uRingIn,uRingOut,0.4556), rr));
          float band = 0.55 + 0.45*sin(rr*95.0 + 2.4*sin(rr*17.0));
          float edge = smoothstep(uRingIn, mix(uRingIn,uRingOut,0.0778), rr)*(1.0 - smoothstep(mix(uRingIn,uRingOut,0.9222), uRingOut, rr));
          float shadow = smoothstep(-0.06, 0.10, dot(normalize(q), sunDir));
          float bright = (0.18 + 0.82*shadow)*(0.55 + 0.45*abs(dot(nR, sunDir)));
          float alpha = edge*(1.0 - gap*0.92)*(0.35 + 0.65*band);
          alpha *= clamp(abs(denom)*30.0, 0.0, 1.0);
          /* Убрать дальнюю дугу колец (за планетой от камеры): оставить только
             полукольцо на ближней стороне. dot(q,camPos)>0 — та же сторона, что камера. */
          float nearHalf = step(0.0, dot(q, camPos));
          alpha *= nearHalf;
          col = mix(col, uRingC*bright, alpha*0.9);
          /* ТУМАН В КОЛЬЦАХ (ЧИЗИЯ): лёгкая слоистая дымка, гуще у внутреннего края
             и на ночной стороне — как застывший туман диска кол. */
          float rngFog = fbm3(q*3.5 + vec3(uTime*0.015, 0.0, 0.0));
          float fogR = smoothstep(1.45, 1.55, rr)*(1.0 - smoothstep(1.9, 2.2, rr));
          float fogRing = clamp((0.35 + 0.65*rngFog)*fogR*(0.6 + 0.4*shadow)*abs(denom)*20.0, 0.0, 1.0);
          col = mix(col, uRingC*bright, fogRing*0.35);
        }
      }
    }
  }
  /* дизеринг против бандинга */
  col += (hash13(vec3(gl_FragCoord.xy*1.0, fract(uTime)*100.0)) - 0.5)/255.0;
  /* PBR-тонмаппинг: white-preserving Reinhard (SuperDuperVanilla) + гамма 2.2 */
  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
  float wpres = 1.5; /* WHITE_PRESERVATION */
  float tm = (luma * (1.0 + luma / (wpres*wpres))) / (1.0 + luma);
  col = pow(max(col * (tm / max(luma, 1e-6)), 0.0), vec3(1.0 / 2.2));
  /* мягкая виньетка */
  float vig = 1.0 - 0.16*dot(uv*0.6, uv*0.6);
  col *= max(vig, 0.0);
  gl_FragColor = vec4(col, 1.0);
}`;

function sh(type, srcStr){
  const s = gl.createShader(type);
  gl.shaderSource(s, srcStr);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s) || 'неизвестная ошибка';
    console.error('R46 ФОН: ошибка шейдера:\n' + log);

  }
  return s;
}

function fxHex(h, d){
  if(typeof h !== 'string'){ return d; }
  var m = /^#?([0-9a-fA-F]{6})$/.exec(h.trim());
  if(!m){ return d; }
  var v = parseInt(m[1], 16);
  return [((v>>16)&255)/255, ((v>>8)&255)/255, (v&255)/255];
}
function fxNum(v, d){ return (typeof v === 'number' && isFinite(v)) ? v : d; }

   колонки 0..6 — surf-цвета по типу, 7 — (scale/8, icecov, cloudcov, stormk),
   8 — (cityk, aurk, pulse/8), 9 — (spin/8). NEAREST+CLAMP, юнит 0. ==== */
var PAL_TEX = null, PAL_SIG = '';
function palBuildUpload(){
  if(!gl || !uPal) return;
  var pl = (PLANETS_DB && PLANETS_DB.planets) ? PLANETS_DB.planets : [];
  var sig = JSON.stringify(pl);
  if(PAL_TEX && sig === PAL_SIG) return;
  PAL_SIG = sig;
  var W = 16, H = 9;
  var data = new Uint8Array(W*H*4);
  function pc(h, dh){
    var r = fxHex(h, null);
    if(!r) r = fxHex(dh, null);
    return r || [1, 1, 1];
  }
  function put(row, col, rgb, a){
    var o = ((row*W) + col)*4;
    data[o] = Math.round(Math.max(0, Math.min(1, rgb[0]))*255);
    data[o+1] = Math.round(Math.max(0, Math.min(1, rgb[1]))*255);
    data[o+2] = Math.round(Math.max(0, Math.min(1, rgb[2]))*255);
    data[o+3] = Math.round(Math.max(0, Math.min(1, a || 0))*255);
  }
  for(var i = 0; i < H; i++){
    var e = pl[i] || {};
    var f = e.fx || {};
    var d = FXDEF[pKind(i)] || FXDEF[0];
    var surf = f.surf || d.surf;
    var kind = pKind(i);
    var s = kind === 1
      ? [surf.b1, surf.b2, surf.b3, surf.storm, surf.fres, surf.haze, surf.fog]
      : kind === 2
      ? [surf.r1, surf.r2, surf.lava, surf.fres, surf.r1, surf.r1, surf.r1]
      : kind === 3
      ? [surf.r1, surf.r2, surf.river, surf.fres, surf.r1, surf.r1, surf.r1]
      : [surf.ocean, surf.land1, surf.land2, surf.ice, surf.cloud, surf.city, surf.aur];
    for(var c2 = 0; c2 < 7; c2++) put(i, c2, pc(s[c2], d.surf[['ocean','land1','land2','ice','cloud','city','aur'][c2]] || d.surf.r1), 0);
    put(i, 7, [fxNum(surf.scale, d.surf.scale)/8, fxNum(surf.icecov, d.surf.icecov), fxNum(surf.cloudcov, d.surf.cloudcov), fxNum(surf.stormk, d.surf.stormk)], 0);
    put(i, 8, [fxNum(surf.cityk, d.surf.cityk), fxNum(surf.aurk, d.surf.aurk), fxNum(f.pulse, d.pulse)/8, 0], 0);

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

function resize(){
  /* OPT: ограничиваем DPR фона (база только рендер фона, не интерфейса) */
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.max(1, Math.floor(innerWidth  * dpr * RENDER_SCALE));
  const h = Math.max(1, Math.floor(innerHeight * dpr * RENDER_SCALE));
  if(cv.width !== w || cv.height !== h){
    cv.width = w; cv.height = h;
    gl.viewport(0, 0, w, h);
  }
}

/* OPT: ПАРАЛЛАКС фона — координата курсора (-1..1) с плавным сглаживанием.
   Используется только для фоновой камеры (стартовая сцена), механики игры не трогает. */
let _parX = 0, _parY = 0;          /* текущая сглаженная позиция */
let _parTX = 0, _parTY = 0;        /* целевая (raw) позиция курсора */
addEventListener('mousemove', function(ev){
  _parTX = (ev.clientX / Math.max(1, innerWidth)) * 2 - 1;
  _parTY = (ev.clientY / Math.max(1, innerHeight)) * 2 - 1;
}, { passive: true });
const PARALLAX_AMOUNT = 0.008;     /* малый сдвиг, чтобы не ломать картинку */

/* главный цикл: RAF сам замирает в фоновой вкладке, dt зажат сверху.
   Камера: свободный полёт из игрового скрипта (__gameState) либо
   орбитальное зеркало R46 (пилот выключен / игровой шейдер не собрался). */
let simTime = 0, last = performance.now();
let _uSP = null; /* OPT: кэш последнего uniform uSplash */
function frame(now){
  resize();
  const dt = Math.min((now - last)/1000, 0.1);
  last = now;
  const g = window.__gameState;
  /* В ГИПЕРКРУИЗЕ солнце не движется: замораживаем simTime (и __bgSim/sunA),
     чтобы освещение и положение солнца стояли, как просил пользователь. */
  const hypOn = !!(g && g.active && (window.inTransit || window.warp));
  if(!hypOn){ simTime += dt*SIM_TIME_SCALE; }
  window.__bgSim = simTime;
  const sunA = 2*Math.PI*simTime/DAY_CYCLE_SIM_SEC;
  /* OPT: плавная интерполяция параллакса (target приближается к курсору) */
  _parX += (_parTX - _parX) * Math.min(1, dt*6);
  _parY += (_parTY - _parY) * Math.min(1, dt*6);

  if(g && g.active){
    gl.uniform1f(uPL, pKind(g.planet));
    gl.uniform3f(uCP, g.pos[0], g.pos[1], g.pos[2]);
    gl.uniform3f(uCR, g.right[0], g.right[1], g.right[2]);
    gl.uniform3f(uCU, g.up[0], g.up[1], g.up[2]);
    gl.uniform3f(uCF, g.fwd[0], g.fwd[1], g.fwd[2]);
  } else {
    const camA = START_PHASE_RAD + 2*Math.PI*simTime/ORBIT_PERIOD_SIM_SEC;
    /* ПАРАЛЛАКС: лёгкий сдвиг орбитальной камеры за курсором (только фон) */
    const pxOff = _parX * PARALLAX_AMOUNT, pyOff = _parY * PARALLAX_AMOUNT * 0.6;
    const cx = Math.cos(camA)*CAM_R + pxOff, cy = Math.sin(camA)*CAM_R - ((!g || !g.active) && pKind(window.__splashPlanet || 0) === 3 ? 0.14 : 0) + pyOff;
    let f0x = -Math.sin(camA), f0y = Math.cos(camA);
    let u0x = Math.cos(camA), u0y = Math.sin(camA);
    let f1x = f0x*0.78 - u0x*0.22, f1y = f0y*0.78 - u0y*0.22;
    const f1l = Math.sqrt(f1x*f1x + f1y*f1y) || 1;
    f1x /= f1l; f1y /= f1l;
    /* right = fwd x up0 (z-компоненты нулевые у обоих) */
    const r1z = f1x*u0y - f1y*u0x;
    /* upv = right x fwd */
    const p1x = -r1z*f1y, p1y = r1z*f1x;
    gl.uniform1f(uPL, (g && g.active) ? pKind(g.planet) : pKind(window.__splashPlanet || 0));
    gl.uniform3f(uCP, cx, cy, 0);
    gl.uniform3f(uCF, f1x, f1y, 0);
    gl.uniform3f(uCR, 0, 0, r1z);
    gl.uniform3f(uCU, p1x, p1y, 0);
  }

  gl.uniform2f(uRes, cv.width, cv.height);
  gl.uniform1f(uT, simTime);
  gl.uniform1f(uSA, sunA);
  /* STARLIGHT-2: направления на два нейтронных источника (K-002 в нуле, K-001) */
  try{
    var curS = (g && g.active) ? g.planet : (window.__splashPlanet || 0);
    var cwL = null;
    if(g && g.active){
      cwL = [g.pos[0], g.pos[1], g.pos[2]];
      if(!hypOn && Array.isArray(window.PW) && Array.isArray(window.PW[curS])){
        var _c0 = window.PW[curS];
        cwL = [cwL[0] + _c0[0], cwL[1] + _c0[1], cwL[2] + _c0[2]];
      }
    }
    if(cwL){
      var d0x = -cwL[0], d0y = -cwL[1], d0z = -cwL[2];
      var n0 = Math.sqrt(d0x*d0x + d0y*d0y + d0z*d0z);

      gl.uniform3f(uL0L, d0x/n0, d0y/n0, d0z/n0);
      var k1 = (Array.isArray(window.PW) && Array.isArray(window.PW[1])) ? window.PW[1] : [52.0, 0.0, -48.0];
      var d1x = k1[0] - cwL[0], d1y = k1[1] - cwL[1], d1z = k1[2] - cwL[2];
      var n1 = Math.sqrt(d1x*d1x + d1y*d1y + d1z*d1z);
      if(n1 < 1e-6){ d1x = 1; d1y = 0; d1z = 0; n1 = 1; }
      gl.uniform3f(uL1L, d1x/n1, d1y/n1, d1z/n1);
    } else {
      gl.uniform3f(uL0L, 0.55, 0.30, 0.78);
      gl.uniform3f(uL1L, -0.60, 0.20, 0.50);
    }
  }catch(e){}
  fxPush((g && g.active) ? g.planet : (window.__splashPlanet || 0));
  /* hyper: в гиперпространстве шейдер рисует небо Нгалин + 4 сферы + солнце */
  gl.uniform1f(uHY, hypOn ? 1.0 : 0.0);
  /* 3D-ЛОД: передаём мировые позиции дальних планет (в кадре текущего игрока).
     Камера в этом шейдере — относительная к текущей планете (position близко к 0),
     поэтому позиция планеты k = PW[k] - PW[current]. Маска uPActive в битах. */
  {
    var cur = (g && g.active) ? g.planet : (window.__splashPlanet || 0);
    var list = [], klist = [], pilist = [];
    var WPSRC = window.PW;
    if(Array.isArray(WPSRC) && Array.isArray(WPSRC[cur]) && typeof PKIND !== 'undefined'){
      for(var pp = 0; pp < WPSRC.length; pp++){
        if(pp === cur) continue;
        /* hyper: камера в мировых координатах → позиции планет тоже мировые.
           normal: камера относительно текущей планеты → позиции PW[pp]-PW[cur]. */
        var off = hypOn
          ? [WPSRC[pp][0], WPSRC[pp][1], WPSRC[pp][2]]
          : [WPSRC[pp][0]-WPSRC[cur][0], WPSRC[pp][1]-WPSRC[cur][1], WPSRC[pp][2]-WPSRC[cur][2]];
        list.push(off); klist.push(pKind(pp));   /* шейдеру нужен ТИП поверхности (0..3) */
        pilist.push(pp);                         /* и СТРОКА палитры (индекс планеты) */
      }
    }
    if(uP && uPC && list.length){
      var flat = new Float32Array(24), kf = new Float32Array(8), pf = new Float32Array(8);
      for(var f2 = 0; f2 < list.length && f2 < 8; f2++){
        flat[f2*3] = list[f2][0]; flat[f2*3+1] = list[f2][1]; flat[f2*3+2] = list[f2][2];
        kf[f2] = klist[f2];
        pf[f2] = pilist[f2];
      }
      gl.uniform3fv(uP, flat);
      gl.uniform1fv(uPKa, kf);
      gl.uniform1fv(uPIa, pf);
      gl.uniform1f(uPC, Math.min(list.length, 8));
    }
    /* ГИПЕРПРОСТРАНСТВО: 4-я сфера = текущая планета (в мировых координатах,
       камера гиперкруиза уже в мире). Позиция PW[cur] и ТИП её поверхности. */
    if(uP4 && window.PW && window.PW[cur]) gl.uniform3f(uP4, window.PW[cur][0], window.PW[cur][1], window.PW[cur][2]);
    if(uK4 && window.PW && window.PW[cur]) gl.uniform1f(uK4, pKind(cur));
    if(uPIcur) gl.uniform1f(uPIcur, cur);
    if(window.DIAG_DUMP){ window.__diagP = { cur: cur, list: list, klist: klist }; }
  }
  /* OPT: uSplash меняется редко — не шлём одинаковое значение каждый кадр */
  const spNow = (g && g.active) ? 0.0 : 1.0;
  if(_uSP !== spNow){ gl.uniform1f(uSP, spNow); _uSP = spNow; }
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();

function playMagnet(){

function hotSelect(i){

function costTxt(c){
  var parts = [];
  if(c.ck) parts.push(c.ck + '\u{1F9C1}');
  if(c.ch) parts.push(c.ch + '\u{1F9C0}');
  if(c.mn) parts.push(c.mn + '\u{1F31D}');
  return parts.join(' ') || '\u2014';
}
function canPay(c){
  return (c.ck || 0) <= provCk && (c.ch || 0) <= provCh && (c.mn || 0) <= moonStock;
}
function payCost(c){
  if(!canPay(c)) return false;
  provCk -= (c.ck || 0); provCh -= (c.ch || 0); moonStock -= (c.mn || 0);
  segUpdate(); saveScore();
  return true;
}
function hotDeny(i){
  hotDenyT = 0.6;
  if(hotCells[i]) hotCells[i].style.borderColor = '#ff5a4a';
}
function updHotbar(){
  for(var i = 0; i < hotCells.length; i++){
    var cell = hotCells[i], d = HOT_DEFS[i];
    if(!cell || !d) continue;
    var st = cell.querySelector('.hotSt');
    var sel = (i === hotSel);
    cell.style.borderColor = sel ? ((hotDenyT > 0) ? '#ff5a4a' : '#f79e1d') : '#333';
    cell.style.boxShadow = sel ? '0 0 8px rgba(247,158,29,.7),2px 2px 0 #000' : '2px 2px 0 #000';
    if(st){
      if(d.id === 'shield') st.textContent = (immuneT > 0) ? (Math.ceil(immuneT) + 'с') : ('\u00D7' + moonStock);
      else if(d.id === 'magnet') st.textContent = (magnetT > 0) ? (Math.ceil(magnetT) + 'с') : costTxt(d.cost);
      else if(d.id === 'freeze') st.textContent = (freezeT > 0) ? (Math.ceil(freezeT) + 'с') : costTxt(d.cost);
      else if(d.id === 'flash') st.textContent = (pepBanT > 0) ? (Math.ceil(pepBanT) + 'с') : costTxt(d.cost);
      else st.textContent = costTxt(d.cost);
    }
    var busy = (d.id === 'magnet' && magnetT > 0) || (d.id === 'freeze' && freezeT > 0) || (d.id === 'flash' && pepBanT > 0);
    var can = d.id === 'exch' || busy || (d.id === 'shield' ? moonStock > 0 : canPay(d.cost));
    cell.style.opacity = (sel || can) ? '1' : '0.55';
  }
}
function useHot(i){
  if(!gameOn || gameOver) return;
  var d = HOT_DEFS[i];
  if(!d) return;
  if(inTransit && (d.id === 'volley' || d.id === 'homing' || d.id === 'flash')){
    hotDeny(i); return; /* фантом-фикс: выстрелы не летают в гиперпространстве */
  }
  if(d.id === 'shield'){
    if(immuneT > 0) return;
    if(moonStock < 1){ hotDeny(i); return; }
    useImmunity();
    return;
  }
  if(d.id === 'magnet'){
    if(magnetT > 0) return;
    if(!payCost(d.cost)){ hotDeny(i); return; }
    magnetT = MAG_T;
    playMagnet();
    return;
  }
  if(d.id === 'volley'){
    if(!payCost(d.cost)){ hotDeny(i); return; }
    fireVolley();
    return;
  }
  if(d.id === 'homing'){
    if(!payCost(d.cost)){ hotDeny(i); return; }
    fireHoming();
    return;
  }
  if(d.id === 'flash'){
    if(pepBanT > 0) return;
    if(!payCost(d.cost)){ hotDeny(i); return; }
    doFlash();
    return;
  }
  if(d.id === 'freeze'){
    if(freezeT > 0) return;
    if(!payCost(d.cost)){ hotDeny(i); return; }
    freezeT = CFG.FREEZE_T;
    playMagnet();
    return;
  }
  if(d.id === 'exch') doExchange();
}

function doExchange(){
  if(provCk > 0){
    provCh += provCk;
    provCk = 0;
  } else if(provCh >= 2){
    var n = Math.floor(provCh / 2);
    provCk += n;

  var el = document.createElement('div');
  el.textContent = (type === 'ch') ? '\u{1F9C0}' : '\u{1F9C1}';

}
function fireVolley(){
  var base = Math.atan2(shotAimY - shotY, shotAimX - shotX) || 0;
  for(var i = 0; i < 10; i++) spawnShot('ch', base + (-0.55 + 1.1*i/9), 980, 1.4);
  playPickup('cheese');
}
function fireHoming(){
  for(var i = 0; i < 5; i++) spawnShot('ck', -Math.PI/2 + (Math.random()-0.5)*0.8, 820, 3.0);
  playPickup('cake');
}
function tickShots(dt){
  if(inTransit){
    for(var si = shots.length - 1; si >= 0; si--){
      var sh0 = shots[si];
      if(sh0.el && sh0.el.parentNode) sh0.el.parentNode.removeChild(sh0.el);
    }
    shots.length = 0;
    return;
  }
  for(var i = shots.length - 1; i >= 0; i--){
    var sh = shots[i];
    if(sh.type === 'ck'){
      var best = null, bd = 1e18;
      for(var k = 0; k < ITEMS.length; k++){
        var it = ITEMS[k];
        if(!it || it.kind !== 'pepper' || it.dead || it.planet !== planet || it._sx == null) continue;
        var dx = it._sx - sh.x, dy = it._sy - sh.y, dd = dx*dx + dy*dy;
        if(dd < bd){ bd = dd; best = Math.atan2(dy, dx); }
      }
      if(best != null){
        var diff = best - sh.a;
        while(diff > Math.PI) diff -= 2*Math.PI;
        while(diff < -Math.PI) diff += 2*Math.PI;
        sh.a += Math.max(-6*dt, Math.min(6*dt, diff));
      }
    }
    sh.x += Math.cos(sh.a)*sh.v*dt;
    sh.y += Math.sin(sh.a)*sh.v*dt;
    sh.life -= dt;
    var dead = sh.life <= 0 || sh.x < -60 || sh.x > innerWidth + 60 || sh.y < -60 || sh.y > innerHeight + 60;
    if(!dead){
      for(var k2 = 0; k2 < ITEMS.length && sh.hits > 0; k2++){
        var it2 = ITEMS[k2];
        if(!it2 || it2.kind !== 'pepper' || it2.dead || it2.planet !== planet || it2._sx == null) continue;
        var dx2 = it2._sx - sh.x, dy2 = it2._sy - sh.y;
        if(dx2*dx2 + dy2*dy2 < 48*48){
          sh.hits--;
          killPepper(it2);
          if(sh.type === 'ck') dead = true;
        }
      }
    }
    if(dead){
      if(sh.el && sh.el.parentNode) sh.el.parentNode.removeChild(sh.el);
      shots.splice(i, 1);
    } else {
      sh.el.style.transform = 'translate(' + sh.x.toFixed(1) + 'px,' + sh.y.toFixed(1) + 'px)';
    }
  }
}

/* ---------- ПРОЕКЦИЯ И ПЕРЕКРЫТИЯ ---------- */
var RING_N = norm([0.22, 1.0, 0.18]);
var RING_IN = 1.45, RING_OUT = 2.35, GAP_IN = 1.76, GAP_OUT = 1.86;
function ringOccl(camPos, dir, dist){
  var denom = dot(dir, RING_N);
  if(Math.abs(denom) < 1e-4) return false;
  var t = -dot(camPos, RING_N)/denom;
  if(t <= 0 || t >= dist) return false;
  var q = add(camPos, mul(dir, t));
  var r = len(q);
  return (r > RING_IN && r < RING_OUT && !(r > GAP_IN && r < GAP_OUT));
}
function project(p, cam, W, H){
  var v = sub(p, cam.pos);
  var dist = len(v);
  var z = dot(v, cam.fwd);
  /* OPT: плавнее порог — меньше «прилипания»/рывков спрайтов у камеры */
  if(z < 0.01) return null;
  var dir = mul(v, 1/(dist||1));
  var tC = -dot(cam.pos, dir) - OCCL_Y*dir[1];
  if(tC > 0 && tC < dist){
    var q = add(cam.pos, mul(dir, tC));
    if(dot(q,q) + OCCL_Y*(2.0*q[1] + OCCL_Y) < 1.0){
      var ox = dot(v, cam.right)/(z*CFG.FOV_TAN);
      var oy = dot(v, cam.up)/(z*CFG.FOV_TAN);
      var osx = (ox*H + W)/2;
      var osy = (H - oy*H)/2;
      return { occl: true, x: osx, y: osy, z: z };
    }
  }
  var ux = dot(v, cam.right)/(z*CFG.FOV_TAN);
  var uy = dot(v, cam.up)/(z*CFG.FOV_TAN);
  var sx = (ux*H + W)/2;
  var sy = (H - uy*H)/2;
  if(sx < -90 || sx > W + 90 || sy < -90 || sy > H + 90) return null;
  return { x: sx, y: sy, z: z };
}
function sunDirNow(simT){
  var sa = 2*Math.PI*simT/3600.0;
  return norm([Math.cos(sa), 0.22*Math.sin(sa), Math.sin(sa)]);
}

    provCh = Math.max(0, provCh - CFG.PEPPER_CH);
    boostFuel = Math.max(0, boostFuel - CFG.BOOST_PEPPER);
    hurt(1, pr);

/* ---------- ФИЗИКА ПОЛЁТА ---------- */
function physics(dt){
  var P = inTransit ? FT : F;
  var ty = 0, tp = 0, tr = 0;
  if(keys.KeyD) ty += 1;
  if(keys.KeyA) ty -= 1;
  if(keys.ArrowUp) tp += 1;
  if(keys.ArrowDown) tp -= 1;
  if(keys.KeyE) tr += 1;
  if(keys.KeyQ) tr -= 1;
  var k = Math.min(1, dt*CFG.RESP);
  yawV   += (ty*CFG.YAW_MAX   - yawV)*k;
  if(!drag) pitchV += (tp*CFG.PITCH_MAX - pitchV)*k;
  rollV  += (tr*CFG.ROLL_MAX  - rollV)*k;
  if(keys.KeyW) speed += CFG.SPD_RATE*boostMul*dt;
  if(keys.KeyS) speed -= CFG.SPD_RATE*dt;
  var dn = -1, dd = 1e9;
  if(inTransit){
    var dn2 = -1, dd2 = 1e9;
    for(var ki = 0; ki < PW.length; ki++){
      var dk = len(sub(FT.pos, PW[ki]));
      if(dk < dd){ dd2 = dd; dn2 = dn; dd = dk; dn = ki; }
      else if(dk < dd2){ dd2 = dk; dn2 = ki; }
    }
    /* SINE-BOOST: разгон по синусоиде от объекта к объекту — у звезды ×1, на середине перегона ×3 */
    sineMul = 1.0;
    if(dd2 < 1e9 && dd + dd2 > 0.0){
      var tS = Math.min(1, Math.max(0, dd/(dd + dd2)));
      sineMul = 1 + 2*Math.sin(Math.PI*tS);
    }
    var ceil = CFG.SPD_MAX*(1 + Math.max(0, dd - 2)*FSD_SC_GAIN);
    ceil = Math.min(ceil, CFG.SPD_MAX*FSD_SC_CAP)*boostMul*sineMul;
    speed = Math.max(CFG.SPD_MIN, Math.min(ceil, speed));
    /* ГИПЕРПРОСТРАНСТВО = свободный 3D-полёт во все стороны, как вокруг планеты,
       только в мировых координатах: без принудительного коридора/перегона.
       FT.pos двигается по направлению взгляда (ниже: P.pos += P.fwd*speed*dt). */
  } else {
    speed = Math.max(CFG.SPD_MIN, Math.min(CFG.SPD_MAX*boostMul, speed));
  }
  if(Math.abs(rollV) > 1e-6){
    P.right = rotAxis(P.right, P.fwd, rollV*dt);
    P.up    = rotAxis(P.up,    P.fwd, rollV*dt);
  }
  if(Math.abs(pitchV) > 1e-6){
    P.fwd = rotAxis(P.fwd, P.right, pitchV*dt);
    P.up  = rotAxis(P.up,  P.right, pitchV*dt);
  }
  if(Math.abs(yawV) > 1e-6){
    P.fwd   = rotAxis(P.fwd,   P.up, yawV*dt);
    P.right = rotAxis(P.right, P.up, yawV*dt);
  }
  P.fwd = norm(P.fwd);
  P.right = norm(sub(P.right, mul(P.fwd, dot(P.right, P.fwd))));
  P.up = cross(P.right, P.fwd);
  var finChk = P.fwd[0]+P.fwd[1]+P.fwd[2]+P.right[0]+P.right[1]+P.right[2]+P.up[0]+P.up[1]+P.up[2]+P.pos[0]+P.pos[1]+P.pos[2];
  if(!isFinite(finChk)){
    if(inTransit){ FT.pos = PW[planet].slice(); FT.fwd = [0,0,1]; FT.up = [0,1,0]; FT.right = [1,0,0]; }
    else resetBasis();
  }
  P.pos = add(P.pos, mul(P.fwd, speed*dt));
  if(inTransit){
    /* стыковка с любой планетой: дальняя граница гиперпространства */
    if(dn >= 0 && dd < FSD_SOI){ /* стыковка с любой планетой: влет из гиперпространства открыт */
      planet = dn;
      inTransit = false;
      F.pos = sub(FT.pos, PW[dn]);
      var rr0 = len(F.pos);
      if(rr0 < CFG.MINR) F.pos = mul(F.pos, CFG.MINR/(rr0||1));
      F.fwd = P.fwd; F.right = P.right; F.up = P.up;
      speed = Math.min(speed, CFG.SPD_MAX*boostMul);
      targetIdx = -1;
      toastFx('СТЫКОВКА: ' + PLANET_NAMES[dn]);
      setSpaceMode();
    }
  } else {
    var r = len(F.pos);
    if(r < CFG.MINR){
      var nrm = mul(F.pos, 1/(r||1));
      F.pos = mul(nrm, CFG.MINR);
      var inw = dot(F.fwd, nrm);
      if(inw < 0) F.fwd = norm(sub(F.fwd, mul(nrm, inw)));
    }
    /* выход из зоны планеты — суперкруиз */
    if(r > FSD_SOI){
      FT = { pos: add(PW[planet], F.pos), fwd: F.fwd, up: F.up, right: F.right };
      inTransit = true;
      setSpaceMode();
      toastFx('ГИПЕРПРОСТРАНСТВО: ПЛАНЕТЫ ВИДНЫ НА НЕБЕ', '#7dff8a');
    }
  }
}

/* ---------- ОТРИСОВКА СПРАЙТОВ ---------- */
function drawSprites(cam, W, H, bgSim, dt){
  var sun = sunDirNow(bgSim), i, it, pr, p;
  var bearWp = add(cam.pos, mul(cam.fwd, BEAR_D));
  for(i = 0; i < ITEMS.length; i++){
    it = ITEMS[i];
    if(it.planet !== planet || inTransit){ it.el.style.display = 'none'; continue; }
    if(it.dead){ it.el.style.display = 'none'; continue; }
    if(freezeT <= 0) it.angle += it.w*dt;
    p = rotAxis(it.p0, it.axis, it.angle);
    if(magnetT > 0 && gameOn && (it.kind === 'cake' || it.kind === 'cheese')){
      var mr = MAG_R * (((it.sz || 0.052) > 0.09) ? 1.6 : 1);
      var dv = sub(p, bearWp), dl3 = len(dv);
      if(dl3 < mr && dl3 > 0.001){
        var kp = Math.min(1, (1 - dl3/mr) * 3.0 + 0.4);
        var np2 = sub(p, mul(dv, kp*dt*4));
        it.p0 = rotAxis(np2, it.axis, -it.angle);
        p = np2;
      }
    }
    
    pr = project(p, cam, W, H);
    if(!pr || pr.occl){ it.el.style.display = 'none'; continue; }
    if(PLANETS_DB.planets[planet].rings){
      var v2 = sub(p, cam.pos), d2 = len(v2);
      if(ringOccl(cam.pos, mul(v2, 1/(d2||1)), d2)){ it.el.style.display = 'none'; continue; }
    }
    var size = Math.max(14, Math.min(H*1.2, ((it.sz || 0.052)/pr.z)*H));
    /* OPT: плавный фейд по дальности — убирает рывки «прилипания» спрайта к камере */
    var op = Math.min(1, Math.max(0.0, (Math.min(pr.z, 3.0) - 0.03)/0.10));
    var dl = dot(norm(p), sun);
    it.el.style.display = 'block';
    it.el.style.transform = 'translate(' + pr.x.toFixed(1) + 'px,' + pr.y.toFixed(1) + 'px) translate(-50%,-50%)';
    it.el.style.fontSize = size.toFixed(1) + 'px';
    it.el.style.opacity = op.toFixed(2);
    it.el.style.filter = 'brightness(' + (0.45 + 0.55*Math.max(0, dl)).toFixed(2) + ')';
    it.el.style.zIndex = String(5000 - Math.round(pr.z*100));
    if(it.kind === 'pepper'){ it._sx = pr.x; it._sy = pr.y; }
    if(gameOn && !(it.kind === 'pepper' && (immuneT > 0 || freezeT > 0 || pepBanT > 0)) && len(sub(p, bearWp)) < CFG.PICK_RAD*(it.kind === 'moon' ? 1.5 : ((it.sz || 0.052) > 0.09 ? 2 : 1))) collect(it, pr);
  }
  if(bearWrap && gameOn && !paused){
    var bpr = project(bearWp, cam, W, H);
    if(bpr && !bpr.occl){
      var bv = sub(bearWp, cam.pos), bd = len(bv);
      var bo = (PLANETS_DB.planets[planet].rings) ? ringOccl(cam.pos, mul(bv, 1/(bd||1)), bd) : false;
      if(!bo){
        var bdl = dot(norm(bearWp), sun);
        var bsize = Math.max(28, Math.min(H*0.9, (BEAR_SZ/bpr.z)*H));
        var bank = Math.max(-28, Math.min(28, rollV/(CFG.ROLL_MAX||1)*28));
        bearWrap.style.display = 'block';
        bearWrap.style.transform = 'translate(' + bpr.x.toFixed(1) + 'px,' + bpr.y.toFixed(1) + 'px) translate(-50%,-50%) rotate(' + bank.toFixed(1) + 'deg)';
        bearWrap.style.width = bsize.toFixed(1) + 'px';
        bearWrap.style.height = bsize.toFixed(1) + 'px';
        bearWrap.style.opacity = Math.min(1, Math.max(0.15, (Math.min(bpr.z, 3.0) - 0.10)/0.10)).toFixed(2);
        bearWrap.style.filter = 'brightness(' + (0.45 + 0.55*Math.max(0, bdl)).toFixed(2) + ')';
        bearWrap.style.zIndex = String(5000 - Math.round(bpr.z*100));
        ensureAura();
        if(auraEl) auraEl.style.display = (magnetT > 0) ? 'block' : 'none';
        shotX = bpr.x; shotY = bpr.y;
        var aimW = add(cam.pos, mul(F.fwd, 5.0));
        var apr = project(aimW, cam, W, H);
        if(apr && !apr.occl){ shotAimX = apr.x; shotAimY = apr.y; }
      } else bearWrap.style.display = 'none';
    } else bearWrap.style.display = 'none';
  } else if(bearWrap) bearWrap.style.display = 'none';
}

/* ---------- HUD И ПЕРЕКЛЮЧЕНИЕ ПЛАНЕТ ---------- */
function updHud(){
  /* HUD-МИНИМУМ: скорость (сатурация 999) + множитель синуса в транзите */
  var spd = Math.min(999, Math.round(speed*256)); /* 1 ед. = 256 св.лет */
  var txt = 'СКОРОСТЬ: ' + spd + ' св.лет/с';
  if(inTransit) txt += '\nСИНУС: \u00D7' + sineMul.toFixed(2);
  if(mouseCtl) txt += '\nМЫШЬ: ВКЛ (P — вернуть курсор)';
  /* OPT: кэш текста — не пишем в DOM, если значение не изменилось */
  if(hudTxtEl){
    if(hudTxtEl.__last !== txt){ hudTxtEl.textContent = txt; hudTxtEl.__last = txt; }
  } else if(hud._last !== txt){ hud.textContent = txt; hud._last = txt; }
  var pct = Math.round(speed/CFG.SPD_MAX*100);
  if(hudThrSegEl) segSetN(hudThrSegEl, Math.max(0, Math.min(250, pct)), 3);

function switchPlanet(dir){

  if(dir > 0){

    }

}

/* ---------- НЕБО ГИПЕРПРОСТРАНСТВА: 3D-скайбокс — звёзды в мировых направлениях,
   вращаются со взглядом (крен/тангаж/рысканье/мышь), как ночное небо у планет ---------- */
var hypCv = null, hypCtx = null, hypStars = null, hypBand = null, hypConst = null,

function initHypSky(){
  if(hypCv) return;

  hypCv.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;display:none;';

function hypRand(a){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function hypGenStars(){
  hypStars = []; hypBand = [];
  var NG = norm([0.32, 0.86, 0.38]);              /* плоскость «млечного пути» */
  var A = norm(cross(NG, [1, 0, 0])), B = norm(cross(NG, A));
  var i, u, phi, s, d;
  for(i = 0; i < 620; i++){                        /* фоновые звёзды по всей сфере */
    u = hypRand(1000 + i)*2 - 1; phi = hypRand(2000 + i)*6.28318; s = Math.sqrt(1 - u*u);
    hypStars.push({ d: [s*Math.cos(phi), u, s*Math.sin(phi)],
      r: 0.5 + hypRand(3000 + i)*1.5, a: 0.25 + hypRand(4000 + i)*0.7,
      ph: hypRand(5000 + i)*6.28, sp: 0.35 + hypRand(6000 + i)*1.5,
      bl: hypRand(7000 + i) < 0.16 });
  }
  for(i = 0; i < 780; i++){                        /* звёзды, прижатые к млечному пути */
    u = (hypRand(9000 + i)*2 - 1) * 0.16; phi = hypRand(11000 + i)*6.28318;
    d = norm(add(mul(A, Math.cos(phi)), mul(B, Math.sin(phi))));
    d = norm(add(d, mul(NG, u)));
    hypStars.push({ d: d, r: 0.4 + hypRand(12000 + i)*1.2, a: 0.2 + hypRand(13000 + i)*0.65,
      ph: hypRand(14000 + i)*6.28, sp: 0.3 + hypRand(15000 + i)*1.3,
      bl: hypRand(16000 + i) < 0.12 });
  }
  for(i = 0; i < 230; i++){                        /* мягкое свечение вдоль полосы */
    phi = hypRand(17000 + i)*6.28318;
    d = norm(add(mul(A, Math.cos(phi)), mul(B, Math.sin(phi))));
    hypBand.push({ d: d, r: 26 + hypRand(18000 + i)*60, a: 0.02 + hypRand(19000 + i)*0.05 });
  }
  hypConst = [];                                   /* 5 созвездий из ярких звёзд */
  for(var c = 0; c < 5; c++){
    u = hypRand(21000 + c)*2 - 1; phi = hypRand(22000 + c)*6.28318; s = Math.sqrt(1 - u*u);
    var cd = [s*Math.cos(phi), u, s*Math.sin(phi)], pts = [];
    for(i = 0; i < 6; i++){
      pts.push(norm(add(cd, mul(norm([hypRand(23000 + c*10 + i)*2 - 1, hypRand(24000 + c*10 + i)*2 - 1, hypRand(25000 + c*10 + i)*2 - 1]), 0.10 + hypRand(26000 + c*10 + i)*0.07))));
    }

    { d: norm([0.7, 0.25, 0.6]),   r: 210, a: 0.085, col: '123,92,255' },

    { d: norm([0.2, -0.65, -0.6]), r: 190, a: 0.06,  col: '96,120,255' }
  ];
}
function drawHypSky(dt, cam){
  if(!hypCv) initHypSky();
  var on = gameOn && !!(inTransit || warp);
  /* курсор: прячем в суперкруизе и варпе, показываем у планеты и на паузе */
  var cur = (on && !paused) ? 'none' : '';
  if(document.documentElement.style.cursor !== cur) document.documentElement.style.cursor = cur;
  var bg0 = document.getElementById('glbg');
  /* ГИПЕРПРОСТРАНСТВО рендерит webGL-фон(#glbg, uHyper=1) — готовый рендер ХИТОМИ.
     2D-канвас hypCv не нужен и скрыт. */
  if(bg0) bg0.style.opacity = '';
  if(hypCv) hypCv.style.display = 'none';
  if(!on){ hypOnLast = false; return; }
  hypOnLast = true;
  return; /* гиперпространство = webGL-шейдер (#glbg), 2D-канвас отключён */
  hypOnLast = true;
  var W = window.innerWidth, H = window.innerHeight;
  if(hypCv.width !== W || hypCv.height !== H){ hypCv.width = W; hypCv.height = H; }
  var ctx = hypCtx;
  hypT += (dt || 0.016);
  if(!hypStars) hypGenStars();
  var BIG = 1e6, i, pr;
  for(i = 0; i < hypNeb.length; i++){              /* туманности — под звёздами */
    var nb = hypNeb[i];
    pr = project(mul(nb.d, BIG), cam, W, H);
    if(pr && !pr.occl){
      var gr = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, nb.r);
      gr.addColorStop(0, 'rgba(' + nb.col + ',' + nb.a + ')');
      gr.addColorStop(1, 'rgba(' + nb.col + ',0)');
      ctx.fillStyle = gr;
      ctx.fillRect(pr.x - nb.r, pr.y - nb.r, nb.r*2, nb.r*2);
    }
  }
  for(i = 0; i < hypBand.length; i++){             /* свечение млечного пути */
    var bd = hypBand[i];
    pr = project(mul(bd.d, BIG), cam, W, H);
    if(pr && !pr.occl){
      var gb2 = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, bd.r);
      gb2.addColorStop(0, 'rgba(110,125,175,' + bd.a.toFixed(3) + ')');
      gb2.addColorStop(1, 'rgba(110,125,175,0)');
      ctx.fillStyle = gb2;
      ctx.fillRect(pr.x - bd.r, pr.y - bd.r, bd.r*2, bd.r*2);
    }
  }
  for(i = 0; i < hypStars.length; i++){            /* звёзды: проекция направления + мерцание */
    var st = hypStars[i];
    pr = project(mul(st.d, BIG), cam, W, H);
    if(!pr || pr.occl) continue;
    var tw = 0.72 + 0.28*Math.sin(hypT*st.sp + st.ph);
    var al = Math.min(1, st.a*tw);
    if(st.r > 1.4){                                /* крупные звёзды — с ореолом */
      ctx.fillStyle = 'rgba(255,244,214,' + (al*0.35).toFixed(3) + ')';
      ctx.fillRect(pr.x - 2.2, pr.y - 2.2, 4.4, 4.4);
    }
    ctx.fillStyle = st.bl ? ('rgba(160,190,255,' + al.toFixed(3) + ')') : ('rgba(226,232,244,' + al.toFixed(3) + ')');
    ctx.fillRect(pr.x, pr.y, st.r, st.r);
  }
  ctx.strokeStyle = 'rgba(150,170,230,0.22)';      /* созвездия: линии между звёздами */
  ctx.lineWidth = 1;
  for(var c2 = 0; c2 < hypConst.length; c2++){
    var P0 = null, cl = hypConst[c2], L = cl.length;
    for(i = 0; i <= L; i++){
      pr = project(mul(cl[i % L], BIG), cam, W, H);
      if(pr && !pr.occl){
        ctx.fillStyle = 'rgba(210,225,255,0.95)';
        ctx.fillRect(pr.x - 1.5, pr.y - 1.5, 3, 3);
        if(P0){ ctx.beginPath(); ctx.moveTo(P0.x, P0.y); ctx.lineTo(pr.x, pr.y); ctx.stroke(); }
        P0 = pr;
      } else P0 = null;
    }
  }
}

/* ================= ☩ ПРОЦЕДУРНЫЕ НЕБЕСНЫЕ ТЕЛА ☩ =================
   Рендер 1:1: разрешение канвы равно размеру тела на экране, перерисовка
   каждый кадр. Без LOD и троттлинга. Текстуры суши/облаков/сыра
   предрассчитаны один раз (512x256), пульсар рисуется градиентами. */
var PB_TEX = null, PB_HOLES = null, PB_RB = null, PB_RF = null;
function pbHash(x, y, z, sd){
  var n = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177) ^ Math.imul(sd|0, 974711);
  n = Math.imul(n ^ (n >>> 13), 1103515245);
  return ((n ^ (n >>> 16)) >>> 0)/4294967296;
}
function pbVn(px, py, pz, sd){
  var xi = Math.floor(px), yi = Math.floor(py), zi = Math.floor(pz);
  var xf = px - xi, yf = py - yi, zf = pz - zi;
  var sx = xf*xf*(3-2*xf), sy = yf*yf*(3-2*yf), sz = zf*zf*(3-2*zf);
  var c000 = pbHash(xi,yi,zi,sd), c100 = pbHash(xi+1,yi,zi,sd);
  var c010 = pbHash(xi,yi+1,zi,sd), c110 = pbHash(xi+1,yi+1,zi,sd);
  var c001 = pbHash(xi,yi,zi+1,sd), c101 = pbHash(xi+1,yi,zi+1,sd);
  var c011 = pbHash(xi,yi+1,zi+1,sd), c111 = pbHash(xi+1,yi+1,zi+1,sd);
  var x00 = c000+(c100-c000)*sx, x10 = c010+(c110-c010)*sx;
  var x01 = c001+(c101-c001)*sx, x11 = c011+(c111-c011)*sx;
  var y0 = x00+(x10-x00)*sy, y1 = x01+(x11-x01)*sy;
  return y0+(y1-y0)*sz;
}
function pbFbm(px, py, pz, sd){
  var v = 0.55*pbVn(px, py, pz, sd);
  v += 0.275*pbVn(px*2.07, py*2.07, pz*2.07, sd+11);
  v += 0.1375*pbVn(px*4.28, py*4.28, pz*4.28, sd+23);
  return v/0.9625;
}
function pbInitTex(){
  if(PB_TEX) return;
  var TW = 512, TH = 256;
  PB_HOLES = [];
  for(var h = 0; h < 16; h++){
    var ta = pbHash(h,1,2,7)*Math.PI*2, pa = Math.acos(2*pbHash(h,3,4,9)-1);
    PB_HOLES.push({ d: [Math.sin(pa)*Math.cos(ta), Math.cos(pa), Math.sin(pa)*Math.sin(ta)], r: 0.07 + 0.07*pbHash(h,5,6,3) });
  }
  PB_TEX = [];
  for(var k = 0; k < PLANET_NAMES.length; k++){
    if(pKind(k) === 3){ PB_TEX.push(null); continue; } /* пульсар: без текстуры */
    var terr = new Uint8ClampedArray(TW*TH*3), cloud = new Uint8ClampedArray(TW*TH);
    for(var y = 0; y < TH; y++){
      var lat = (0.5 - y/(TH-1))*Math.PI;

      for(var x = 0; x < TW; x++){

          var rind = Math.min(1, Math.max(0, (Math.abs(lat)-0.95)/0.5));
          r1 = Math.round(r1*(1-rind)+138*rind); g1 = Math.round(g1*(1-rind)+92*rind); b1 = Math.round(b1*(1-rind));
          for(var h2 = 0; h2 < 16; h2++){
            var dd2 = vx*PB_HOLES[h2].d[0] + vy*PB_HOLES[h2].d[1] + vz*PB_HOLES[h2].d[2];
            if(dd2 > Math.cos(PB_HOLES[h2].r)){ r1 = 92; g1 = 58; b1 = 0; }
            else if(dd2 > Math.cos(PB_HOLES[h2].r*1.25)){

          } else {

function pbSpherePixel(tex, nx, ny, spin, drift, L, out){

function pbPulsar(ctx, cw, ch, simT){

  var uy = dot(v, cam.up)/(z*CFG.FOV_TAN);

      sfx.music.pause();
      sfx.music.src = trackFor(window.__splashPlanet);
      sfx.music.play().catch(function(){});
    }
  }catch(e){}
  if(SPLASH_TOAST && SPLASH_TOAST.parentNode) SPLASH_TOAST.remove();
  SPLASH_TOAST = document.createElement('div');
  SPLASH_TOAST.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;font:700 12px/1 monospace;letter-spacing:2px;color:#7dff8a;background:#0c150cdd;border:3px outset #950;border-radius:8px;padding:9px 16px;pointer-events:none;';
  SPLASH_TOAST.textContent = 'ЗАСТАВКА: ' + nm;
  document.body.appendChild(SPLASH_TOAST);
  setTimeout(function(){ if(SPLASH_TOAST && SPLASH_TOAST.parentNode) SPLASH_TOAST.remove(); }, 1800);
}
window.addEventListener('keydown', function(e){
  if(e.code === 'KeyZ' && !e.repeat && !gameOn){
    e.preventDefault(); e.stopPropagation();
    /* SPLASH-Z: переключение заставок по Z отключено (протокол Сириус-B) */
    return;
  }
  if(gameOn && e.code === 'Escape' && !e.repeat){
    e.preventDefault(); e.stopPropagation();
    cancelWarp();
    document.body.classList.toggle('dgame');
    return;
  }
  if(gameOn && e.code === 'KeyO' && !e.repeat){
    e.preventDefault(); e.stopPropagation();
    setPaused(!paused);
    return;
  }
  if(gameOn && !paused && !warp && e.code === 'KeyR' && !e.repeat){
    e.preventDefault(); e.stopPropagation();
    tryBoost();
    return;
  }
  if(gameOn && !paused && !warp && e.code === 'KeyT' && !e.repeat){
    e.preventDefault(); e.stopPropagation();
    useHot(hotSel);
    return;
  }
  if(gameOn && !paused && !warp && /^Digit[1-7]$/.test(e.code) && !e.repeat){
    e.preventDefault(); e.stopPropagation();
    hotSelect(parseInt(e.code.slice(5), 10) - 1);
    return;
  }
  if(!gameOn || paused || warp || !KEYSET[e.code]) return;
  e.preventDefault(); e.stopPropagation();
  if(e.code === 'KeyY' && !e.repeat) cycleTarget();
  else if(e.code === 'KeyG' && !e.repeat) fsdJump(1);
  else if(e.code === 'KeyJ' && !e.repeat) fsdJump(-1);
  else if(e.code === 'KeyP' && !e.repeat) toggleMouse();
  else keys[e.code] = 1;
  tryMusic();
}, true);
window.addEventListener('wheel', function(e){
  if(!gameOn || paused || switching) return;
  e.preventDefault();
  if(HOT_DEFS.length) hotSelect((hotSel + (e.deltaY > 0 ? 1 : HOT_DEFS.length - 1)) % HOT_DEFS.length);
}, { passive: false });
window.addEventListener('keyup', function(e){
  if(!gameOn || paused || !KEYSET[e.code]) return;
  e.preventDefault(); e.stopPropagation();
  keys[e.code] = 0;
}, true);
addEventListener('blur', function(){ keys = {}; drag = null; });
window.addEventListener('pointerdown', function(e){
  if(!gameOn || mouseCtl) return;
  var t = e.target;
  if(t && t.closest && t.closest('button,input,select,a,.panel,.lcd,.kbd-wrap,#keys,#keys2')) return;
  drag = { x: e.clientX, y: e.clientY };
  tryMusic();
});
window.addEventListener('pointermove', function(e){
  if(!drag || !gameOn || warp) return;
  var MF = inTransit ? FT : F;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if(dx){
    MF.fwd = norm(rotAxis(MF.fwd, MF.up, -dx*CFG.DRAG_YAW));
    MF.right = norm(rotAxis(MF.right, MF.up, -dx*CFG.DRAG_YAW));
  }
  if(dy){
    MF.fwd = norm(rotAxis(MF.fwd, MF.right, -dy*CFG.DRAG_PITCH));
    MF.up = norm(rotAxis(MF.up, MF.right, -dy*CFG.DRAG_PITCH));
  }
});
window.addEventListener('pointerup', function(){ drag = null; });

/* ---------- МЫШЬ: СКРЫТИЕ КУРСОРА (P) ---------- */
function toggleMouse(){
  if(!gameOn) return;
  if(document.pointerLockElement){ document.exitPointerLock(); }
  else { tryMusic(); document.body.requestPointerLock(); }
}
document.addEventListener('pointerlockchange', function(){
  mouseCtl = !!document.pointerLockElement;
});
document.addEventListener('pointerlockerror', function(){ mouseCtl = false; });
window.addEventListener('mousemove', function(e){
  if(!mouseCtl || !gameOn || paused || warp) return;
  var MF = inTransit ? FT : F;
  var dx = e.movementX || 0, dy = e.movementY || 0;
  if(dx){
    MF.fwd = norm(rotAxis(MF.fwd, MF.up, -dx*CFG.DRAG_YAW));
    MF.right = norm(rotAxis(MF.right, MF.up, -dx*CFG.DRAG_YAW));
  }
  if(dy){
    MF.fwd = norm(rotAxis(MF.fwd, MF.right, -dy*CFG.DRAG_PITCH));
    MF.up = norm(rotAxis(MF.up, MF.right, -dy*CFG.DRAG_PITCH));
  }
});

function applyGameMode(){
  document.body.classList.toggle('dgame', gameOn);
  btnPilot.classList.toggle('on', gameOn);
  if(!btnPilot.disabled) btnPilot.textContent = gameOn ? 'ИГРА: СТОП' : 'ИГРА: СТАРТ';
  layer.style.display = gameOn ? '' : 'none';
  hud.style.display = gameOn ? '' : 'none';
  keys = {}; drag = null; if(!gameOn) cancelWarp();
  if(!gameOn && document.pointerLockElement) document.exitPointerLock();
  if(segPanel){ segPanel.style.display = gameOn ? 'flex' : 'none'; if(gameOn) segUpdate(); }
  if(topPanel) topPanel.style.display = gameOn ? 'block' : 'none';
  if(botPanel) botPanel.style.display = gameOn ? 'flex' : 'none';
  if(lensEl) lensEl.style.display = 'none';
  if(gameOn){ tryMusic(); }
  else if(sfx.music){ sfx.music.pause(); }
}
btnPilot.addEventListener('click', function(){
  if(gameOver){ gameOver = false; resetGame(); gameOn = true; }
  else gameOn = !gameOn;
  if(!gameOn) setPaused(false);
  applyGameMode();
});
btnMusic.addEventListener('click', function(){
  sfx.musicOn = !sfx.musicOn;
  btnMusic.classList.toggle('on', sfx.musicOn);
  btnMusic.textContent = sfx.musicOn ? 'МУЗЫКА' : 'МУЗЫКА (выкл)';
  if(sfx.musicOn){ tryMusic(); if(fsdAudio && warp){ try{ fsdAudio.play().catch(function(){}); }catch(e){} } }
  else if(sfx.music){ sfx.music.pause(); if(fsdAudio){ try{ fsdAudio.pause(); }catch(e){} } }
});

/* ---------- ПРОВЕРКА ОКРУЖЕНИЯ ---------- */
var bgInfo = window.__bgInfo || {};
if(bgInfo.fallback){
  gameOn = false;
  applyGameMode();
  btnPilot.disabled = true;
  btnPilot.textContent = 'ИГРА: БАЗОВЫЙ';
  gameErr('ФОН: игровой шейдер не собрался — включён базовый R46, игра ждёт починки. Ошибка компиляции в консоли (F12).');
}

/* ---------- ГЛАВНЫЙ ЦИКЛ ИГРЫ ---------- */
var simT = 0, lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  try{
    var dt = Math.min((now - lastT)/1000, 0.1);
    lastT = now;
    if(paused) dt = 0;
    if(!paused) simT += dt;
    var bgSim = (typeof window.__bgSim === 'number') ? window.__bgSim : simT*60.0;
    var W = window.innerWidth, H = window.innerHeight;
    var cam;
    if(gameOn){
      if(!paused){
      if(warp) updWarp(dt); else physics(dt);
      if(pepperCd > 0) pepperCd = Math.max(0, pepperCd - dt);
      if(immuneT > 0) immuneT = Math.max(0, immuneT - dt);
      if(boostOn){
        boostLeft -= dt;
        boostFuel = Math.max(0, boostFuel - CFG.BOOST_DRAIN*dt);
        if(boostLeft <= 0 || boostFuel <= 0) boostOn = false;
      } else if(boostFuel < 100){
        boostFuel = Math.min(100, boostFuel + dt/CFG.BOOST_REGEN);
      }
      boostMul += ((boostOn ? CFG.BOOST_MULT : 1) - boostMul)*Math.min(1, dt*1.6);
      if(magnetT > 0) magnetT = Math.max(0, magnetT - dt);
      if(freezeT > 0) freezeT = Math.max(0, freezeT - dt);
      if(hotDenyT > 0) hotDenyT = Math.max(0, hotDenyT - dt);
      if(pepBanT > 0){
        pepBanT -= dt;
        if(pepBanT <= 0){
          pepBanT = 0;
          for(var pi = 0; pi < ITEMS.length; pi++){
            var pit = ITEMS[pi];
            if(pit && pit.kind === 'pepper'){ pit.dead = false; respawn(pit); }
          }
        }
      }
      ensureSnow();
      if(snowEl) snowEl.style.opacity = (freezeT > 0) ? '1' : '0';
      tickShots(dt);
      if(lensEl) lensEl.style.display = (immuneT > 0) ? 'block' : 'none';
      updBottomPanel();
      }
      OCCL_Y = 0;
      var CP = inTransit ? FT : F;
      cam = { pos: CP.pos, fwd: CP.fwd, up: CP.up, right: CP.right };
      window.__gameState = { active: true, planet: planet,
        pos: CP.pos, fwd: CP.fwd, up: CP.up, right: CP.right };
    } else {
      var camA = 2*Math.PI*bgSim/2275.9;
      var cx = Math.cos(camA)*1.034, cy = Math.sin(camA)*1.034 - (pKind(window.__splashPlanet || 0) === 3 ? 0.14 : 0);
      var f0x = -Math.sin(camA), f0y = Math.cos(camA);
      var u0x = Math.cos(camA), u0y = Math.sin(camA);
      var f1x = f0x*0.78 - u0x*0.22, f1y = f0y*0.78 - u0y*0.22;
      var fl = Math.sqrt(f1x*f1x + f1y*f1y) || 1;
      f1x /= fl; f1y /= fl;
      var r1z = f1x*u0y - f1y*u0x;
      OCCL_Y = (window.__splashPlanet === 3) ? 0.14 : 0;
      cam = { pos: [cx, cy, 0], fwd: [f1x, f1y, 0], right: [0, 0, r1z], up: [-r1z*f1y, r1z*f1x, 0] };
      window.__gameState = { active: false };
    }
    drawSprites(cam, W, H, bgSim, dt);
    drawPlanetsSky(cam, W, H, bgSim);
    drawHypSky(dt, cam);
    updHud();
  }catch(e){
    gameErr('ИГРА: ошибка кадра — ' + (e && e.message ? e.message : e));
  }
}
initSegPanel();
initTopPanel();
initBottomPanel();
initGoPanel();
initPausePanel();
applyGameMode();
updHud();
requestAnimationFrame(loop);

}catch(e){
  gameErr('ИГРА: ошибка запуска — ' + (e && e.message ? e.message : e));
}
})();
</script>
