<script>
const VERT = 'attribute vec2 aPos;\nvoid main(){ gl_Position = vec4(aPos, 0.0, 1.0); }';
const FRAG_SRC = "precision highp float;\nuniform vec2  uRes;\nuniform float uTime;\nuniform float uCamA;\nuniform float uSunA;\nuniform vec3  uCamPos;\nuniform vec3  uCamR;\nuniform vec3  uCamU;\nuniform vec3  uCamF;\nuniform float uPlanet;\nuniform float uSplash;\n\n#define R    1.0\n#define CAMR (uPlanet>2.5)?2.55:((uPlanet>0.5&&uPlanet<1.5)?4.20:2.40)\n#define FOT  0.577350\n\n/* --- \u0445\u044d\u0448 \u0438 \u0448\u0443\u043c\u044b (\u0441\u0440\u0435\u0434\u043d\u0438\u0439 \u0441\u043b\u043e\u0439) --- */\nfloat hash13(vec3 p){\n  p = fract(p*0.3183099 + vec3(0.1,0.2,0.3));\n  p *= 17.0;\n  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));\n}\nfloat vnoise(vec3 x){\n  vec3 i = floor(x);\n  vec3 f = fract(x);\n  f = f*f*(3.0-2.0*f);\n  float n0=hash13(i);\n  float n1=hash13(i+vec3(1.0,0.0,0.0));\n  float n2=hash13(i+vec3(0.0,1.0,0.0));\n  float n3=hash13(i+vec3(1.0,1.0,0.0));\n  float n4=hash13(i+vec3(0.0,0.0,1.0));\n  float n5=hash13(i+vec3(1.0,0.0,1.0));\n  float n6=hash13(i+vec3(0.0,1.0,1.0));\n  float n7=hash13(i+vec3(1.0,1.0,1.0));\n  return mix(mix(mix(n0,n1,f.x),mix(n2,n3,f.x),f.y),\n             mix(mix(n4,n5,f.x),mix(n6,n7,f.x),f.y),f.z);\n}\n/* \u0442\u044f\u0436\u0451\u043b\u044b\u0439: 5 \u043e\u043a\u0442\u0430\u0432 */\nfloat fbm5(vec3 p){\n  float v=0.0, a=0.5;\n  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=p*2.07+vec3(1.7); a*=0.5; }\n  return v;\n}\n/* \u0441\u0440\u0435\u0434\u043d\u0438\u0439: 3 \u043e\u043a\u0442\u0430\u0432\u044b */\nfloat fbm3(vec3 p){\n  float v=0.0, a=0.5;\n  for(int i=0;i<3;i++){ v+=a*vnoise(p); p=p*2.13; a*=0.5; }\n  return v;\n}\n\n/* --- \u0437\u0432\u0451\u0437\u0434\u044b: \u0442\u0440\u0438 \u0441\u043b\u043e\u044f \u0433\u0440\u0438\u0434\u043e\u0432 \u0441 \u043c\u0435\u0440\u0446\u0430\u043d\u0438\u0435\u043c --- */\nvec3 stars(vec3 rd){\n  vec3 c = vec3(0.0);\n  for(int L=0; L<3; L++){\n    float sc = 90.0 + float(L)*80.0;\n    vec3 g  = rd*sc;\n    vec3 id = floor(g);\n    vec3 fr = fract(g) - 0.5;\n    float h = hash13(id + float(L)*37.0);\n    if(h > 0.975){\n      vec3 off = (vec3(hash13(id+1.0), hash13(id+2.0), hash13(id+3.0)) - 0.5)*0.6;\n      float d  = length(fr - off);\n      float tw = 0.55 + 0.45*sin(uTime*(1.0+h*4.0) + h*40.0);\n      float s  = (1.0 - smoothstep(0.0, 0.14, d))*tw;\n      vec3 tint = mix(vec3(0.70,0.80,1.0), vec3(1.0,0.85,0.60), hash13(id+4.0));\n      c += s*tint*(0.35 + h*0.8);\n    }\n  }\n  return c;\n}\n\nvoid main(){\n  vec2 uv = (gl_FragCoord.xy*2.0 - uRes)/uRes.y;\n\n  /* --- \u043a\u0430\u043c\u0435\u0440\u0430: \u0441\u0432\u043e\u0431\u043e\u0434\u043d\u044b\u0439 \u043f\u043e\u043b\u0451\u0442 \u2014 \u043f\u043e\u0437\u0438\u0446\u0438\u044f \u0438 \u0431\u0430\u0437\u0438\u0441 \u043f\u0440\u0438\u0445\u043e\u0434\u044f\u0442 \u0438\u0437 JS --- */\n  vec3 camPos = vec3(cos(uCamA)*CAMR, sin(uCamA)*CAMR, 0.0);\n  if(uPlanet > 2.5){ camPos.y -= 0.14*uSplash; }\n  vec3 fwd    = vec3(-sin(uCamA), cos(uCamA), 0.0);\n  vec3 up0b   = normalize(camPos);\n  fwd = normalize(mix(fwd, -up0b, 0.22));\n  vec3 right  = normalize(cross(fwd, up0b));\n  vec3 upv    = cross(right, fwd);\n  vec3 rd     = normalize(fwd + (uv.x*right + uv.y*upv)*FOT);\n  vec3 up0    = normalize(camPos);\n\n  /* \u0441\u043e\u043b\u043d\u0446\u0435 \u2014 \u044d\u043a\u0432\u0430\u0442\u043e\u0440\u0438\u0430\u043b\u044c\u043d\u044b\u0439 \u043a\u0440\u0443\u0433 \u0441 \u043b\u0451\u0433\u043a\u0438\u043c \u043d\u0430\u043a\u043b\u043e\u043d\u043e\u043c; \u043b\u0443\u043d\u0430 \u2014 \u043e\u0442\u0441\u0442\u0430\u0435\u0442 \u043d\u0430 0.9 \u0440\u0430\u0434 */\n  float st = sin(uSunA), ct = cos(uSunA);\n  vec3 sunDir  = normalize(vec3(ct, 0.22*st, st));\n  vec3 moonDir = normalize(vec3(cos(uSunA+0.9), 0.25, sin(uSunA+0.9)));\n\n  /* \u043f\u0435\u0440\u0435\u0441\u0435\u0447\u0435\u043d\u0438\u0435 \u043b\u0443\u0447\u0430 \u0441\u043e \u0441\u0444\u0435\u0440\u043e\u0439 \u043f\u043b\u0430\u043d\u0435\u0442\u044b */\n  vec3 sC = (uPlanet > 2.5) ? vec3(0.0, -0.14*uSplash, 0.0) : vec3(0.0);\n  vec3 wC = camPos - sC;\n  float b    = dot(wC, rd);\n  float cc   = dot(wC, wC) - R*R;\n  float disc = b*b - cc;\n  float tHit = -b - sqrt(max(disc, 0.0));\n  bool hitP  = (disc > 0.0) && (tHit > 0.0);\n\n  float dayLocal = dot(normalize(camPos), sunDir);\n  float dayness  = smoothstep(-0.25, 0.30, dayLocal);\n\n  /* \u041f\u0423\u0417\u042b\u0420\u042c \u0410\u0422\u041c\u041e\u0421\u0424\u0415\u0420\u042b: \u0434\u043d\u0435\u0432\u043d\u043e\u0435 \u043d\u0435\u0431\u043e \u0436\u0438\u0432\u0451\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u0432\u043d\u0443\u0442\u0440\u0438 \u043f\u0443\u0437\u044b\u0440\u044f R=1.90 */\n  float camR  = length(camPos);\n  float atmIn = 1.0 - smoothstep(1.786, 1.90, camR);\n\n  /* \u0446\u0432\u0435\u0442 \u0430\u0442\u043c\u043e\u0441\u0444\u0435\u0440\u044b \u043f\u043e \u043f\u043b\u0430\u043d\u0435\u0442\u0435: \u0425\u0418\u0422\u041e\u041c\u0418 \u0433\u043e\u043b\u0443\u0431\u0430\u044f, \u0427\u0418\u0417\u0418\u042f #905000, \u041d\u0413\u0410\u041b\u0418\u041d #300090 */\n  vec3 atmC = vec3(0.30,0.55,1.0);\n  if(uPlanet > 0.5 && uPlanet < 1.5){ atmC = vec3(0.565,0.314,0.0); }\n  else if(uPlanet > 1.5 && uPlanet < 2.5){ atmC = vec3(0.188,0.0,0.565); }\n  else if(uPlanet > 2.5){ atmC = vec3(0.039,0.118,0.302); }\n\n  vec3 col = vec3(0.0);\n  float outA = 0.0;\n\n  if(hitP){\n    /* ---- \u041f\u041b\u0410\u041d\u0415\u0422\u0410 ---- */\n    vec3 p = camPos + rd*tHit;\n    vec3 n = normalize(p - sC);\n    float nl  = dot(n, sunDir);\n    float lit = smoothstep(-0.06, 0.18, nl);\n\n    if(uPlanet < 0.5){\n    /* \u043a\u043e\u043d\u0442\u0438\u043d\u0435\u043d\u0442\u044b: \u0442\u044f\u0436\u0451\u043b\u044b\u0439 fbm \u043f\u043e \u043d\u043e\u0440\u043c\u0430\u043b\u0438, \u043f\u043b\u0430\u043d\u0435\u0442\u0430 \u043c\u0435\u0434\u043b\u0435\u043d\u043d\u043e \u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044f */\n    vec3  sp   = n*2.6 + vec3(0.0, 0.0, uTime*0.004);\n    float cont = fbm5(sp);\n    float land = smoothstep(0.46, 0.54, cont);\n    /* \u0414\u0415\u0422\u0410\u041b\u042c: \u0432\u043e\u043b\u043d\u0435\u043d\u0438\u0435 \u0431\u0435\u0440\u0435\u0433\u043e\u0432\u043e\u0439 \u043b\u0438\u043d\u0438\u0438 (\u0442\u0443\u0440\u0431\u0443\u043b\u0435\u043d\u0442\u043d\u043e\u0441\u0442\u044c) \u2014 \u043f\u043b\u0430\u0432\u043d\u0435\u0435 \u0433\u0440\u0430\u043d\u0438\u0446\u0430 \u0441\u0443\u0448\u0438/\u043e\u043a\u0435\u0430\u043d\u0430 */\n    float coast = fbm3(n*8.0 + vec3(0.0, uTime*0.006, 0.0));\n    land = mix(land, smoothstep(0.40, 0.60, cont - 0.10*coast), 0.35);\n    vec3 ocean = vec3(0.02,0.10,0.22);\n    vec3 landc = mix(vec3(0.08,0.26,0.10), vec3(0.42,0.36,0.20), smoothstep(0.52,0.78,cont));\n\n    /* \u0414\u0415\u0422\u0410\u041b\u042c: \u043c\u0438\u043a\u0440\u043e-\u0440\u0435\u043b\u044c\u0435\u0444 \u0441\u0443\u0448\u0438 (\u0433\u043e\u0440\u044b/\u0440\u0430\u0432\u043d\u0438\u043d\u044b) \u2014 \u0434\u043e\u043f. fbm, \u043d\u0435 \u043c\u0435\u043d\u044f\u0435\u0442 \u0433\u0440\u0430\u043d\u0438\u0446\u044b \u0441\u0443\u0448\u0438 */\n    float mdet = fbm3(n*12.0 + vec3(uTime*0.003, uTime*0.001, 0.0));\n    landc *= 0.85 + 0.30*mdet;\n\n    float ice  = smoothstep(0.80, 0.94, abs(n.y));\n    vec3 surf  = mix(ocean, landc, land);\n    surf = mix(surf, vec3(0.85,0.90,0.95), ice);\n\n    /* \u043e\u0431\u043b\u0430\u043a\u0430: \u0432\u0442\u043e\u0440\u043e\u0439 \u0442\u044f\u0436\u0451\u043b\u044b\u0439 \u0441\u043b\u043e\u0439, \u0441\u0432\u043e\u0439 \u0434\u0440\u0435\u0439\u0444 */\n    float cl = fbm5(n*4.2 + vec3(uTime*0.010, 0.0, -uTime*0.006));\n    cl = smoothstep(0.50, 0.74, cl);\n    surf = mix(surf, vec3(0.95,0.97,1.0), cl*0.9);\n\n    vec3 colDay = surf*(0.15 + 1.05*lit);\n    /* \u0431\u043b\u0438\u043a \u043e\u043a\u0435\u0430\u043d\u0430 */\n    vec3 hv = normalize(sunDir - rd);\n    float spec = pow(max(dot(n,hv),0.0), 60.0)*(1.0-land)*(1.0-ice)*(1.0-cl)*lit;\n    colDay += vec3(0.9,0.95,1.0)*spec*0.6;\n\n    /* \u043d\u043e\u0447\u044c: \u043e\u0433\u043d\u0438 \u0433\u043e\u0440\u043e\u0434\u043e\u0432 \u043d\u0430 \u0441\u0443\u0448\u0435, \u043c\u0435\u0440\u0446\u0430\u043d\u0438\u0435 */\n    float cellH = hash13(floor(n*90.0));\n    float city  = step(0.80, cellH)*land*(1.0-cl)*(1.0-ice);\n    vec3 colNight = surf*0.03 + vec3(1.0,0.75,0.35)*city*0.9*(0.6+0.4*sin(uTime*2.0+cellH*50.0));\n\n    col = mix(colNight, colDay, lit);\n\n    /* \u0430\u0442\u043c\u043e\u0441\u0444\u0435\u0440\u043d\u044b\u0439 \u043e\u0431\u043e\u0434\u043e\u043a \u043d\u0430 \u043b\u0438\u043c\u0431\u0435 */\n    float fres = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);\n    col += vec3(0.25,0.5,1.0)*fres*(0.2 + 0.8*lit)*1.1;\n\n    /* \u043f\u043e\u043b\u044f\u0440\u043d\u044b\u0435 \u0441\u0438\u044f\u043d\u0438\u044f \u043d\u0430 \u043d\u043e\u0447\u043d\u043e\u043c \u043f\u043e\u043b\u044e\u0441\u0435 */\n    float aurZ = smoothstep(0.72, 0.92, abs(n.y))*(1.0-lit);\n    float aur  = fbm3(n*5.0 + vec3(0.0, uTime*0.2, 0.0));\n    col += vec3(0.10,0.90,0.45)*aurZ*smoothstep(0.45,0.75,aur)*0.55;\n    outA = smoothstep(0.0, 0.02, sqrt(max(disc, 0.0)));\n    }\n    else if(uPlanet < 1.5){\n      /* ---- \u0427\u0418\u0417\u0418\u042f: \u0433\u0430\u0437\u043e\u0432\u044b\u0439 \u0433\u0438\u0433\u0430\u043d\u0442 \u0441 \u043f\u043e\u043b\u043e\u0441\u0430\u043c\u0438 \u0438 \u0448\u0442\u043e\u0440\u043c\u043e\u043c ---- */\n      float lat = n.y;\n      float warp = fbm3(n*2.6 + vec3(uTime*0.008, 0.0, 0.0));\n      float bands = sin(lat*16.0 + warp*3.2);\n      float bands2 = sin(lat*34.0 + 1.7);\n      vec3 band1 = vec3(0.87, 0.80, 0.62);\n      vec3 band2 = vec3(0.72, 0.55, 0.34);\n      vec3 band3 = vec3(0.93, 0.88, 0.74);\n      vec3 surf = mix(band1, band2, smoothstep(-0.6, 0.6, bands));\n      surf = mix(surf, band3, 0.5 + 0.5*sin(lat*7.0 + 1.0));\n      surf = mix(surf, band2*0.92, 0.25*smoothstep(0.3, 0.9, bands2));\n      vec3 sdir = normalize(vec3(cos(uTime*0.02 + 2.0), -0.30, sin(uTime*0.02 + 2.0)));\n      float angS = acos(clamp(dot(n, sdir), -1.0, 1.0));\n      float storm = 1.0 - smoothstep(0.05, 0.16, angS);\n      surf = mix(surf, vec3(0.80, 0.42, 0.22), storm*0.85);\n      surf *= 0.92 + 0.16*fbm3(n*9.0 + vec3(uTime*0.05, 0.0, 0.0));\n      col = surf*(0.06 + 1.05*lit);\n      float fresA = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);\n      col += vec3(0.90, 0.75, 0.50)*fresA*(0.2 + 0.8*lit)*0.8;\n    }\n    else if(uPlanet < 2.5) {\n      /* ---- \u041d\u0413\u0410\u041b\u0418\u041d: \u043c\u0430\u0433\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438\u0439 \u043c\u0438\u0440 \u0441 \u0440\u0435\u043a\u0430\u043c\u0438 \u043b\u0430\u0432\u044b ---- */\n      float rock = fbm5(n*3.2);\n      vec3 surf = mix(vec3(0.05, 0.045, 0.05), vec3(0.16, 0.13, 0.12), rock);\n      float riv1 = fbm3(n*3.5 + vec3(0.0, uTime*0.02, uTime*0.013));\n      float riv2 = fbm3(n*7.0 - vec3(uTime*0.015, 0.0, 0.0));\n      float lava = (1.0 - smoothstep(0.0, 0.02, abs(riv1 - 0.5)))\n                 + 0.7*(1.0 - smoothstep(0.0, 0.015, abs(riv2 - 0.5)));\n      lava = min(lava, 1.0);\n      float pulse = 0.75 + 0.25*sin(uTime*1.5 + riv1*40.0);\n      col = surf*(0.05 + 0.9*lit) + vec3(1.0, 0.38, 0.06)*lava*pulse*(1.4 + (1.0 - lit)*2.2);\n      float fresP = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);\n      col += vec3(1.0, 0.45, 0.10)*fresP*0.25;\n    } else {\n      /* ---- \u0428\u0418\u041d\u0420\u0410\u0420\u0422\u0410-B: \u043d\u0435\u0439\u0442\u0440\u043e\u043d\u043d\u0430\u044f \u0437\u0432\u0435\u0437\u0434\u0430 \u2014 \u043f\u043e\u0432\u0435\u0440\u0445\u043d\u043e\u0441\u0442\u044c \u043a\u0430\u043a \u0443 \u041d\u0413\u0410\u041b\u0418\u041d, \u044d\u0444\u0444\u0435\u043a\u0442 \u0433\u043e\u043b\u0443\u0431\u043e\u0439 #eff5f9 ---- */\n      float rock = fbm5(n*3.2);\n      vec3 surf = mix(vec3(0.05,0.045,0.05), vec3(0.16,0.13,0.12), rock);\n      float riv1 = fbm3(n*3.5 + vec3(0.0, uTime*0.02, uTime*0.013)) 40\u0431\u0443\u043b\u0435\u043d\u0442\u043d\u043e\u0441\u0442\u044c: \u0437\u0430\u043a\u0440\u0443\u0447\u0435\u043d\u043d\u044b\u0435 \u0441\u0442\u0440\u0443\u0438 \u2014 \u0441\u043c\u0435\u0449\u0435\u043d\u0438\u0435 \u044f\u0434\u0440\u0430 \u043f\u043e aJ */\n        float turb = 0.55 + 0.45*sin(aJ*7.0 - uTime*0.0833);\n        float off = 0.30*(1.0 - exp(-aJ*1.4));\n        float prof = exp(-(rJ*rJ)/(wJ*wJ)*0.5);\n        /* \u0442\u0451\u043f\u043b\u043e\u0435 \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u0435 / \u0445\u043e\u043b\u043e\u0434\u043d\u0430\u044f \u043f\u043b\u0430\u0437\u043c\u0430 \u0441\u0432\u0435\u0440\u0445\u0443 + \u043d\u0435\u043e\u043d\u043e\u0432\u044b\u0439 \u043e\u0431\u043e\u0434 */\n        float cool = smoothstep(0.8, 4.2, aJ);\n        vec3 jetCol = mix(vec3(1.0,0.55,0.20), vec3(0.45,0.75,1.0), cool);\n        float twinkle = 0.75 + 0.25*sin(uTime*0.0833 + aJ*5.0);\n        /* \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0439 \u0441\u0432\u0435\u0442\u044f\u0449\u0438\u0439\u0441\u044f \u0448\u043b\u0435\u0439\u0444 */\n        col += jetCol*along*prof*twinkle*1.6;\n        /* \u044f\u0440\u043a\u043e\u0435 \u044f\u0434\u0440\u043e */\n        float core = exp(-(rJ*rJ)/(wJ*wJ*0.10)*0.5);\n        col += vec3(0.95,0.97,1.0)*along*core*twinkle*1.1;\n        /* \u0437\u0430\u043a\u0440\u0443\u0442\u043a\u0430: \u043b\u0451\u0433\u043a\u043e\u0435 \u0441\u043c\u0435\u0449\u0435\u043d\u0438\u0435 \u043f\u043e\u0442\u043e\u043a\u0430 \u043e\u0442 \u043e\u0441\u0438 \u0441\u043e\u0437\u0434\u0430\u0451\u0442 \u0436\u0438\u0432\u043e\u0439 \u0432\u0438\u0445\u0440\u044c */\n        float swirl = exp(-( (rJ - off*turb)*(rJ - off*turb) )/(wJ*wJ*0.6)*0.5);\n        col += jetCol*along*swirl*turb*0.6;\n        outA = max(outA, clamp(along*(prof*1.6 + core*1.1 + swirl*0.6), 0.0, 1.0));\n      }\n    }\n  }\n  /* \u0434\u0438\u0437\u0435\u0440\u0438\u043d\u0433 \u043f\u0440\u043e\u0442\u0438\u0432 \u0431\u0430\u043d\u0434\u0438\u043d\u0433\u0430 + \u0442\u043e\u043d\u043c\u0430\u043f\u043f\u0438\u043d\u0433 + \u043b\u0451\u0433\u043a\u0430\u044f \u0433\u0430\u043c\u043c\u0430 + \u0432\u0438\u043d\u044c\u0435\u0442\u043a\u0430 */\n  col += (hash13(vec3(gl_FragCoord.xy*1.0, fract(uTime)*100.0)) - 0.5)/255.0;\n  col = col/(1.0 + col*0.30);\n  col = pow(col, vec3(0.92));\n  float vig = 1.0 - 0.22*dot(uv*0.55, uv*0.55);\n  col *= max(vig, 0.0);\n  gl_FragColor = vec4(col, clamp(outA, 0.0, 1.0));\n}";
const ORBIT_PERIOD = 2275.193;
const DAY_CYCLE = 3600.000;
const CAM_R = 1.034047;
const SIM_SCALE = 60;

function buildShader(gl, type, src, cv){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const err = gl.getShaderInfoLog(s) || 'unknown';
    console.error('shader err:', err);
    try{
      const c2 = document.createElement('canvas');
      c2.width = cv.width; c2.height = cv.height;
      const x = c2.getContext('2d');
      x.fillStyle = '#500'; x.fillRect(0,0,c2.width,c2.height);
      x.fillStyle = '#fcc'; x.font = '10px monospace';
      x.fillText('ERR', 4, 12);
    }catch(e){}
    return null;
  }
  return s;
}
function initCanvas(cv, size){
  const dpr = Math.min(window.devicePixelRatio||1, 1.5);
  cv.width = cv.height = Math.floor(size*dpr);
  const gl = cv.getContext('webgl', {antialias:true, depth:false, alpha:true, premultipliedAlpha:false});
  if(!gl) return null;
  const prog = gl.createProgram();
  const vs = buildShader(gl, gl.VERTEX_SHADER, VERT, cv);
  const fs = buildShader(gl, gl.FRAGMENT_SHADER, FRAG_SRC, cv);
  if(!vs || !fs) return null;
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){ console.error(gl.getProgramInfoLog(prog)); return null; }
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const locA = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(locA); gl.vertexAttribPointer(locA, 2, gl.FLOAT, false, 0, 0);
  return { gl, prog,
    uRes: gl.getUniformLocation(prog,'uRes'), uT: gl.getUniformLocation(prog,'uTime'),
    uCamA: gl.getUniformLocation(prog,'uCamA'), uSunA: gl.getUniformLocation(prog,'uSunA'),
    uPL: gl.getUniformLocation(prog,'uPlanet'), uSP: gl.getUniformLocation(prog,'uSplash') };
}
function makeOrbit(planetIdx){
  // стартовая фаза разная у тел — чтобы они смотрели по-разному, как в игре
  return 0.6 + planetIdx*0.9;
}
const canvases = document.querySelectorAll('canvas.orb');
const bodies = [];
canvases.forEach(function(cv, idx){
  const planet = parseInt(cv.dataset.planet, 10);
  const size = 140;
  const h = initCanvas(cv, size);
  if(!h){ cv.style.background = '#0b0f16'; return; }
  bodies.push({ h: h, planet: planet, phase: makeOrbit(planet), t: 0,
    spl: 0 });
});
// пустой цикл при отсутствии WebGL
if(bodies.length === 0) return;
let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, 0.1); last = now;
  for(let i=0;i<bodies.length;i++){
    const B = bodies[i], g = B.h;
    B.t += dt*SIM_SCALE;
    const sunA = 2*Math.PI*B.t / DAY_CYCLE;
    const camA = B.phase + 2*Math.PI*B.t / ORBIT_PERIOD;
    const w = g.gl.drawingBufferWidth, hh = g.gl.drawingBufferHeight;
    g.gl.viewport(0,0,w,hh);
    if(g.uCamA) g.gl.uniform1f(g.uCamA, camA);
    g.gl.uniform1f(g.uSunA, sunA);
    g.gl.uniform1f(g.uPL, B.planet);
    g.gl.uniform1f(g.uSP, B.spl);
    if(g.uRes) g.gl.uniform2f(g.uRes, w, hh);
    if(g.uT)   g.gl.uniform1f(g.uT, B.t);
    g.gl.drawArrays(g.gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
