  }
  if(!retDrawn) skyRet.style.display = 'none';
  /* канвы-призраки: всё, что не попало в кадр, прячем */
  for(var k3 = 0; k3 < skyWrapEls.length; k3++) if(!drawn[k3]) skyWrapEls[k3].style.display = 'none';
}
function fsdInitSound(){
  if(fsdAudio) return fsdAudio;
  var a = new Audio(relURL(WARP_SND));
  a.addEventListener('error', function(){
    console.warn('[ИГРА] ' + WARP_SND + ' не найден рядом с HTML — прыжок пройдёт без звука');
  });
  fsdAudio = a;
  return a;
}
function initWarpCv(){
  if(warpCv) return;
  warpCv = document.createElement('canvas');
  warpCv.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;z-index:47;pointer-events:none;display:none;';
  document.body.appendChild(warpCv);
  warpCv.setAttribute('data-keep','1');
  warpCtx = warpCv.getContext('2d');
}
function commitJump(target){
  planet = target;
  inTransit = false;
  var dir = sub(FT.pos, PW[target]);
  var dl2 = len(dir);
  dir = (dl2 > 0.001) ? mul(dir, 1/dl2) : [0, 0.2, 1];
  F.pos = mul(dir, FSD_DOCK);  /* выход из варпа: близко к планете — стыковочная дистанция */
  F.fwd = FT.fwd; F.right = FT.right; F.up = FT.up;
  speed = Math.min(speed, CFG.SPD_MAX*boostMul);
  magnetT = 0; freezeT = 0;
  for(var si = shots.length - 1; si >= 0; si--){ if(shots[si].el && shots[si].el.parentNode) shots[si].el.parentNode.removeChild(shots[si].el); }
  shots.length = 0;
  if(sfx.music && sfx.started){ try{ sfx.music.pause(); sfx.music.src = trackFor(planet); }catch(e){} }
  if(sfx.musicOn) tryMusic();
  targetIdx = -1;
  updHud();
  toastFx('ВЫХОД ИЗ ВАРПА: ' + PLANET_NAMES[target]);
}
function finishWarp(){
  warp = null;
  if(warpCv) warpCv.style.display = 'none';
  switching = false;
  keys = {};
  if(fsdAudio){ try{ fsdAudio.pause(); }catch(e){} }
  setSpaceMode();
}
function cancelWarp(){
  if(!warp) return;
  warp = null;
  if(warpCv) warpCv.style.display = 'none';
  switching = false;
  if(fsdAudio){ try{ fsdAudio.pause(); }catch(e){} }
  setSpaceMode();
}
function updWarp(dt){
  initWarpCv();
  var W = window.innerWidth, H = window.innerHeight;
  if(warpCv.width !== W || warpCv.height !== H){ warpCv.width = W; warpCv.height = H; }
  var ctx = warpCtx;
  warp.t += dt;
  var t1 = FSD_CHARGE, t2 = t1 + FSD_TUNNEL, t3 = t2 + FSD_EXIT;
  var inten = 0, streakSpd = 0;
  if(warp.t < t1){ var p = warp.t/t1; inten = 0.25 + 0.65*p; streakSpd = 0.15 + 0.85*p; }
  else if(warp.t < t2){
    inten = 1; streakSpd = 1.6;
    if(!warp.committed && warp.t >= t1 + FSD_TUNNEL*0.5){ commitJump(warp.target); warp.committed = true; }
  } else {
    var pe = (warp.t - t2)/FSD_EXIT;
    inten = Math.max(0, 1 - pe);
    streakSpd = Math.max(0.2, 1.6*(1 - pe));
  }
  warpCv.style.display = 'block';
  ctx.clearRect(0, 0, W, H);
  var cx = W/2, cy = H/2, R = Math.sqrt(cx*cx + cy*cy);
  ctx.globalCompositeOperation = 'lighter';
  if(warpStreaks === null){
    warpStreaks = [];
    for(var i = 0; i < 150; i++) warpStreaks.push({ a: Math.random()*Math.PI*2, r: Math.random()*1.2, s: 0.5 + Math.random()*1.2, w: 0.5 + Math.random()*1.6 });
  }
  for(var j = 0; j < warpStreaks.length; j++){
    var st = warpStreaks[j];
    st.r += st.s*streakSpd*dt*1.6;
    if(st.r > 1.35){ st.r = Math.random()*0.25; st.a = Math.random()*Math.PI*2; }
    var rr = st.r*R;
    var tail = Math.max(2, rr*0.55*streakSpd);
    ctx.strokeStyle = 'rgba(190,225,255,' + (0.75*inten).toFixed(3) + ')';
    ctx.lineWidth = st.w;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(st.a)*rr, cy + Math.sin(st.a)*rr);
    ctx.lineTo(cx + Math.cos(st.a)*(rr - tail), cy + Math.sin(st.a)*(rr - tail));
    ctx.stroke();
  }
  var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*0.5);
  g.addColorStop(0, 'rgba(140,190,255,' + (0.28*inten).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(140,190,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if(warp.t >= t2){
    var pf = (warp.t - t2)/FSD_EXIT;
    if(pf > 0.65){
      ctx.fillStyle = 'rgba(255,255,255,' + (0.9*Math.min(1, (pf - 0.65)/0.35)).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if(fsdAudio){ try{ fsdAudio.volume = Math.max(0, 0.55*(1 - pf)); }catch(e){} }
  }
  if(warp.t >= t3) finishWarp();
}
function startFSD(target){
  switching = true;
  keys = {};
  if(!inTransit){
    FT = { pos: add(PW[planet], F.pos), fwd: F.fwd, up: F.up, right: F.right };
    inTransit = true;
  }
  warp = { t: 0, target: target, committed: false };
  setSpaceMode();
  var a = fsdInitSound();
  if(a && sfx.musicOn){
    try{
      a.currentTime = 0; a.volume = 0.55;
      var pr = a.play();
      if(pr && pr.catch) pr.catch(function(){});
    }catch(e){}
  }
  toastFx('FSD: ЗАРЯДКА \u2192 ЦЕЛЬ: ' + PLANET_NAMES[target]);
}
function fsdJump(dir){
  if(!gameOn || paused || switching || warp) return;
  var target = -1;
  if(dir > 0){
    if(targetIdx >= 0){ target = targetIdx; }
    else {
      if(planet >= FIN){ toastFx('ФИНАЛ ДОСТИГНУТ — ПРЫЖОК НЕВОЗМОЖЕН', '#ff5a4a'); return; }
      target = planet + 1;
    }
  } else {
    target = (planet === 0) ? FIN : planet - 1;
  }
  if(target === planet) return;
  if(expTotal < expNeed(target)){ denyExp(expNeed(target)); return; }
  startFSD(target);
}
function cycleTarget(){
  if(!gameOn || paused || warp) return;
  var k = (targetIdx >= 0) ? targetIdx : -1;
  for(var n = 0; n < PLANET_NAMES.length; n++){
    k = (k + 1) % PLANET_NAMES.length;
    if(k !== planet) break;
  }
  targetIdx = k;
}

/* ---------- ВВОД ---------- */
var KEYSET = { KeyW:1, KeyS:1, KeyA:1, KeyD:1, KeyQ:1, KeyE:1, KeyG:1, KeyJ:1, KeyP:1, KeyY:1, ArrowUp:1, ArrowDown:1 };
window.__splashPlanet = 0;
var SPLASH_TOAST = null;
function cycleSplash(){
  window.__splashPlanet = ((window.__splashPlanet || 0) + 1) % 4;
  var nm = ['ХИТОМИ', 'ЧИЗИЯ', 'НГАЛИН', 'ШИНРАРТА-B'][window.__splashPlanet];
  try{
    if(sfx.music && sfx.musicOn){
      sfx.music.pause();
      sfx.music.src = trackFor(window.__splashPlanet);
      sfx.music.play().catch(function(){});
    }
  }catch(e){}
  if(SPLASH_TOAST && SPLASH_TOAST.parentNode) SPLASH_TOAST.remove();
  SPLASH_TOAST = document.createElement('div');
  SPLASH_TOAST.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;font:700 12px/1 monospace;letter-spacing:2px;color:#7dff8a;background:#0c150cdd;border:3px outset #950;border-radius:8px;padding:9px 16px;pointer-events:none;';
  SPLASH_TOAST.textContent = 'ЗАСТАВКА: ' + nm;
  document.body.appendChild(SPLASH_TOAST);
  setTimeout(function(){ if(SPLASH_TOAST && SPLASH_TOAST.parentNode) SPLASH_TOAST.remove(); }, 1800);
}
window.addEventListener('keydown', function(e){
  if(e.code === 'KeyZ' && !e.repeat && !gameOn){
    e.preventDefault(); e.stopPropagation();
    cycleSplash();
    return;
  }
  if(gameOn && e.code === 'Escape' && !e.repeat){
    e.preventDefault(); e.stopPropagation();
    cancelWarp();
    document.body.classList.toggle('dgame');
    return;
  }
  if(gameOn && e.code === 'KeyO' && !e.repeat){
    e.preventDefault(); e.stopPropagation();
    setPaused(!paused);
    return;
  }
  if(gameOn && !paused && !warp && e.code === 'KeyR' && !e.repeat){
    e.preventDefault(); e.stopPropagation();
    tryBoost();
    return;
  }
  if(gameOn && !paused && !warp && e.code === 'KeyT' && !e.repeat){
    e.preventDefault(); e.stopPropagation();
    useHot(hotSel);
    return;
  }
  if(gameOn && !paused && !warp && /^Digit[1-7]$/.test(e.code) && !e.repeat){
    e.preventDefault(); e.stopPropagation();
    hotSelect(parseInt(e.code.slice(5), 10) - 1);
    return;
  }
  if(!gameOn || paused || warp || !KEYSET[e.code]) return;
  e.preventDefault(); e.stopPropagation();
  if(e.code === 'KeyY' && !e.repeat) cycleTarget();
  else if(e.code === 'KeyG' && !e.repeat) fsdJump(1);
  else if(e.code === 'KeyJ' && !e.repeat) fsdJump(-1);
  else if(e.code === 'KeyP' && !e.repeat) toggleMouse();
  else keys[e.code] = 1;
  tryMusic();
}, true);
window.addEventListener('wheel', function(e){
  if(!gameOn || paused || switching) return;
  e.preventDefault();
  hotSelect((hotSel + (e.deltaY > 0 ? 1 : HOT_DEFS.length - 1)) % HOT_DEFS.length);
}, { passive: false });
window.addEventListener('keyup', function(e){
  if(!gameOn || paused || !KEYSET[e.code]) return;
  e.preventDefault(); e.stopPropagation();
  keys[e.code] = 0;
}, true);
addEventListener('blur', function(){ keys = {}; drag = null; });
window.addEventListener('pointerdown', function(e){
  if(!gameOn || mouseCtl) return;
  var t = e.target;
  if(t && t.closest && t.closest('button,input,select,a,.panel,.lcd,.kbd-wrap,#keys,#keys2')) return;
  drag = { x: e.clientX, y: e.clientY };
  tryMusic();
});
window.addEventListener('pointermove', function(e){
  if(!drag || !gameOn || warp) return;
  var MF = inTransit ? FT : F;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if(dx){
    MF.fwd = norm(rotAxis(MF.fwd, MF.up, -dx*CFG.DRAG_YAW));
    MF.right = norm(rotAxis(MF.right, MF.up, -dx*CFG.DRAG_YAW));
  }
  if(dy){
    MF.fwd = norm(rotAxis(MF.fwd, MF.right, dy*CFG.DRAG_PITCH));
    MF.up = norm(rotAxis(MF.up, MF.right, dy*CFG.DRAG_PITCH));
  }
});
window.addEventListener('pointerup', function(){ drag = null; });

/* ---------- МЫШЬ: СКРЫТИЕ КУРСОРА (P) ---------- */
function toggleMouse(){
  if(!gameOn) return;
  if(document.pointerLockElement){ document.exitPointerLock(); }
  else { tryMusic(); document.body.requestPointerLock(); }
}
document.addEventListener('pointerlockchange', function(){
  mouseCtl = !!document.pointerLockElement;
});
document.addEventListener('pointerlockerror', function(){ mouseCtl = false; });
window.addEventListener('mousemove', function(e){
  if(!mouseCtl || !gameOn || paused || warp) return;
  var MF = inTransit ? FT : F;
  var dx = e.movementX || 0, dy = e.movementY || 0;
  if(dx){
    MF.fwd = norm(rotAxis(MF.fwd, MF.up, -dx*CFG.DRAG_YAW));
    MF.right = norm(rotAxis(MF.right, MF.up, -dx*CFG.DRAG_YAW));
  }
  if(dy){
    MF.fwd = norm(rotAxis(MF.fwd, MF.right, dy*CFG.DRAG_PITCH));
    MF.up = norm(rotAxis(MF.up, MF.right, dy*CFG.DRAG_PITCH));
  }
});

function applyGameMode(){
  document.body.classList.toggle('dgame', gameOn);
  btnPilot.classList.toggle('on', gameOn);
  if(!btnPilot.disabled) btnPilot.textContent = gameOn ? 'ИГРА: СТОП' : 'ИГРА: СТАРТ';
  layer.style.display = gameOn ? '' : 'none';
  hud.style.display = gameOn ? '' : 'none';
  keys = {}; drag = null; if(!gameOn) cancelWarp();
  if(!gameOn && document.pointerLockElement) document.exitPointerLock();
  if(segPanel){ segPanel.style.display = gameOn ? 'flex' : 'none'; if(gameOn) segUpdate(); }
  if(topPanel) topPanel.style.display = gameOn ? 'block' : 'none';
  if(botPanel) botPanel.style.display = gameOn ? 'flex' : 'none';
  if(lensEl) lensEl.style.display = 'none';
  if(gameOn){ tryMusic(); }
  else if(sfx.music){ sfx.music.pause(); }
}
btnPilot.addEventListener('click', function(){
  if(gameOver){ gameOver = false; resetGame(); gameOn = true; }
  else gameOn = !gameOn;
  if(!gameOn) setPaused(false);
  applyGameMode();
});
btnMusic.addEventListener('click', function(){
  sfx.musicOn = !sfx.musicOn;
  btnMusic.classList.toggle('on', sfx.musicOn);
  btnMusic.textContent = sfx.musicOn ? 'МУЗЫКА' : 'МУЗЫКА (выкл)';
  if(sfx.musicOn){ tryMusic(); if(fsdAudio && warp){ try{ fsdAudio.play().catch(function(){}); }catch(e){} } }
  else if(sfx.music){ sfx.music.pause(); if(fsdAudio){ try{ fsdAudio.pause(); }catch(e){} } }
});

/* ---------- ПРОВЕРКА ОКРУЖЕНИЯ ---------- */
var bgInfo = window.__bgInfo || {};
if(bgInfo.fallback){
  gameOn = false;
  applyGameMode();
  btnPilot.disabled = true;
  btnPilot.textContent = 'ИГРА: БАЗОВЫЙ';
  gameErr('ФОН: игровой шейдер не собрался — включён базовый R46, игра ждёт починки. Ошибка компиляции в консоли (F12).');
}

/* ---------- ГЛАВНЫЙ ЦИКЛ ИГРЫ ---------- */
var simT = 0, lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  try{
    var dt = Math.min((now - lastT)/1000, 0.1);
    lastT = now;
    if(paused) dt = 0;
    if(!paused) simT += dt;
    var bgSim = (typeof window.__bgSim === 'number') ? window.__bgSim : simT*60.0;
    var W = window.innerWidth, H = window.innerHeight;
    var cam;
    if(gameOn){
      if(!paused){
      if(warp) updWarp(dt); else physics(dt);
      if(pepperCd > 0) pepperCd = Math.max(0, pepperCd - dt);
      if(immuneT > 0) immuneT = Math.max(0, immuneT - dt);
      if(boostOn){
        boostLeft -= dt;
        boostFuel = Math.max(0, boostFuel - CFG.BOOST_DRAIN*dt);
        if(boostLeft <= 0 || boostFuel <= 0) boostOn = false;
      } else if(boostFuel < 100){
        boostFuel = Math.min(100, boostFuel + dt/CFG.BOOST_REGEN);
      }
      boostMul += ((boostOn ? CFG.BOOST_MULT : 1) - boostMul)*Math.min(1, dt*1.6);
      if(magnetT > 0) magnetT = Math.max(0, magnetT - dt);
      if(freezeT > 0) freezeT = Math.max(0, freezeT - dt);
      if(hotDenyT > 0) hotDenyT = Math.max(0, hotDenyT - dt);
      if(pepBanT > 0){
        pepBanT -= dt;
        if(pepBanT <= 0){
          pepBanT = 0;
          for(var pi = 0; pi < ITEMS.length; pi++){
            var pit = ITEMS[pi];
            if(pit && pit.kind === 'pepper'){ pit.dead = false; respawn(pit); }
          }
        }
      }
      ensureSnow();
      if(snowEl) snowEl.style.opacity = (freezeT > 0) ? '1' : '0';
      tickShots(dt);
      if(lensEl) lensEl.style.display = (immuneT > 0) ? 'block' : 'none';
      updBottomPanel();
      }
      OCCL_Y = 0;
      var CP = inTransit ? FT : F;
      cam = { pos: CP.pos, fwd: CP.fwd, up: CP.up, right: CP.right };
      window.__gameState = { active: true, planet: planet,
        pos: CP.pos, fwd: CP.fwd, up: CP.up, right: CP.right };
    } else {
      var camA = 2*Math.PI*bgSim/2275.9;
      var _bcamR = 1.0 + CAMERA_ALT_KM / bodyRadiusKm(window.__splashPlanet || 0);
      var cx = Math.cos(camA)*_bcamR, cy = Math.sin(camA)*_bcamR - (pKind(window.__splashPlanet || 0) === 3 ? 0.14 : 0);
      var f0x = -Math.sin(camA), f0y = Math.cos(camA);
      var u0x = Math.cos(camA), u0y = Math.sin(camA);
      var f1x = f0x*0.78 - u0x*0.22, f1y = f0y*0.78 - u0y*0.22;
      var fl = Math.sqrt(f1x*f1x + f1y*f1y) || 1;
      f1x /= fl; f1y /= fl;
      var r1z = f1x*u0y - f1y*u0x;
      OCCL_Y = (window.__splashPlanet === 3) ? 0.14 : 0;
      cam = { pos: [cx, cy, 0], fwd: [f1x, f1y, 0], right: [0, 0, r1z], up: [-r1z*f1y, r1z*f1x, 0] };
      window.__gameState = { active: false };
    }
    drawSprites(cam, W, H, bgSim, dt);
    drawPlanetsSky(cam, W, H, bgSim);
    drawHypSky(dt, cam);
    updHud();
  }catch(e){
    gameErr('ИГРА: ошибка кадра — ' + (e && e.message ? e.message : e));
  }
}
initSegPanel();
initTopPanel();
initBottomPanel();
initGoPanel();
initPausePanel();
applyGameMode();
updHud();
requestAnimationFrame(loop);

}catch(e){
  gameErr('ИГРА: ошибка запуска — ' + (e && e.message ? e.message : e));
}
})();
</script>
<script>
/* ═══ РЕДАКТОР ВСЕЛЕННОЙ HITOMI — слой редактора ═══
   Правит живой реестр PLANETS_DB и CFG (открыт как window.CFG).
   Фоновый модуль сам пересобирает палитру (PAL_SIG) и читает fx
   каждый кадр — редактору достаточно писать в таблицу.
   Все панели несут data-keep и переживают старт игры (body.dgame). */
(function(){
'use strict';
var ORIG = JSON.parse(JSON.stringify(PLANETS_DB));
var CFG_ORIG = window.CFG ? JSON.parse(JSON.stringify(window.CFG)) : null;

function el(tag, attrs, html){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (html != null) e.innerHTML = html;
  return e;
}
function gid(id){ return document.getElementById(id); }
function num(v){ v = +v; if (!isFinite(v)) v = 0; var r = Math.round(v * 1e4) / 1e4; return Object.is(r, -0) ? 0 : r; }
function q(s){ return "'" + String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'"; }
function rebuildPW(){ try { window.PW = PLANETS_DB.planets.map(function(p){ return p.pos.slice(); }); if(typeof orbitalInit==='function'){ orbitalInit(); orbitalApply(); } } catch(e){} }
function syncFlags(p){ if (p.fx.ring) p.rings = !!p.fx.ring.on; if (p.fx.jets) p.jets = !!p.fx.jets.on; }
function gameOn(){ return !!(window.__gameState && window.__gameState.active); }

/* ---------- Тост ---------- */
var toastEl = null, toastT = 0;
function toast(msg){
  if (!toastEl){ toastEl = el('div', {id:'edToast', 'data-keep':'1'}); document.body.appendChild(toastEl); }
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 2800);
}

/* ---------- Каркас: бар вкладок + две панели ---------- */
var bar = el('div', {id:'edBar', 'data-keep':'1'});
bar.innerHTML =
  '<button id="edTabPlanet" class="edbtn on" type="button">ПЛАНЕТА</button>' +
  '<button id="edTabFlight" class="edbtn" type="button">ПОЛЁТ</button>' +
  '<button id="edHide" class="edbtn" type="button" title="Скрыть (Tab)">✕</button>';
document.body.appendChild(bar);

var panP = el('div', {id:'edPlanet', 'class':'edp show', 'data-keep':'1'});
var panF = el('div', {id:'edFlight', 'class':'edp', 'data-keep':'1'});
document.body.appendChild(panP);
document.body.appendChild(panF);

var mode = 'planet', hidden = false;
function setHidden(v){
  hidden = v;
  if (v){ bar.style.display = 'none'; panP.style.display = 'none'; panF.style.display = 'none'; }
  else { bar.style.display = ''; panP.style.display = ''; panF.style.display = ''; setMode(mode); }
}
function setMode(m){
  mode = m;
  panP.classList.toggle('show', m === 'planet');
  panF.classList.toggle('show', m === 'flight');
  gid('edTabPlanet').classList.toggle('on', m === 'planet');
  gid('edTabFlight').classList.toggle('on', m === 'flight');
  if (m === 'flight') buildFlight();
}
gid('edTabPlanet').addEventListener('click', function(){ setMode('planet'); });
gid('edTabFlight').addEventListener('click', function(){ setMode('flight'); });
gid('edHide').addEventListener('click', function(){ setHidden(true); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Tab'){ e.preventDefault(); setHidden(!hidden); }
});

/* ---------- Фабрики полей ---------- */
function frow(label, node, valNode){
  var f = el('div', {'class':'frow'});
  f.appendChild(el('label', null, label));
  f.appendChild(node);
  if (valNode) f.appendChild(valNode);
  return f;
}
function mkRange(obj, key, label, mn, mx, st, after, fmt){
  var rg = el('input', {type:'range', min:mn, max:mx, step:st});
  rg.value = obj[key];
  var sp = el('span', {'class':'fval'}, fmt ? fmt(obj[key]) : String(num(obj[key])));
  rg.addEventListener('input', function(){ obj[key] = +rg.value; sp.textContent = fmt ? fmt(obj[key]) : String(num(obj[key])); if (after) after(); });
  return frow(label, rg, sp);
}
function mkColor(obj, key, label, after){
  var c = el('input', {type:'color'});
  c.value = /^#[0-9a-fA-F]{6}$/.test(obj[key]) ? obj[key] : '#000000';
  c.addEventListener('input', function(){ obj[key] = c.value; if (after) after(); });
  return frow(label, c);
}
function mkCheck(obj, key, label, after){
  var c = el('input', {type:'checkbox'});
  c.checked = !!obj[key];
  c.addEventListener('change', function(){ obj[key] = c.checked; if (after) after(); });
  return frow(label, c);
}
function mkText(obj, key, label, after, numeric){
  var t = el('input', {type: numeric ? 'number' : 'text', step:'any'});
  t.value = obj[key];
  t.addEventListener('change', function(){
    obj[key] = numeric ? +t.value || 0 : t.value;
    if (numeric && /pos|unlock|soi/i.test(key)) rebuildPW();
    if (after) after();
  });
  return frow(label, t);
}
function sec(title){ return el('div', {'class':'fsec'}, title); }

/* ---------- ЭКСПОРТ-блок (общий) ---------- */
function addExport(container, getText, fname){
  var ta = el('textarea', {'class':'edTa', id:'edTa_' + fname});
  container.appendChild(ta);
  var btns = el('div', {'class':'frow'});
  function refresh(){ ta.value = getText(); }
  var bShow = el('button', {'class':'edbtn2', type:'button'}, 'ЭКСПОРТ');
  bShow.addEventListener('click', function(){ refresh(); ta.focus(); ta.select(); });
  var bCopy = el('button', {'class':'edbtn2', type:'button'}, 'КОПИРОВАТЬ');
  bCopy.addEventListener('click', function(){
    ta.value = getText(); ta.select();
    try { document.execCommand('copy'); toast('Скопировано в буфер'); }
    catch(e){ toast('Не удалось скопировать — Ctrl+C'); }
  });
  var bDl = el('button', {'class':'edbtn2', type:'button'}, 'СКАЧАТЬ');
  bDl.addEventListener('click', function(){
    var blob = new Blob([getText()], {type:'text/plain'});
    var a = el('a', {href: URL.createObjectURL(blob), download: fname + '.js'});
    document.body.appendChild(a); a.click(); a.remove();
    toast('Файл ' + fname + '.js скачан');
  });
  btns.appendChild(bShow); btns.appendChild(bCopy); btns.appendChild(bDl);
  container.appendChild(btns);
}

/* ═══ ВКЛАДКА «ПЛАНЕТА» ═══ */
var cur = 0;
function pickPlanet(i, silent){
  cur = i;
  if (!silent && gameOn()) toast('Полёт активен — превью-камера берётся из игры (планета сменится после СТОП)');
  window.__splashPlanet = i;
  buildPlanet();
}
function rebuildAll(){ buildPlanet(); if (mode === 'flight') buildFlight(); }

function exportDB(){
  var out = 'var PLANETS_DB = {\n  soi: ' + num(PLANETS_DB.soi) + ',\n  planets: [\n';
  PLANETS_DB.planets.forEach(function(p, i){
    var ms = (p.moons || []).map(function(m){
      return '{ d:' + num(m.d) + ', s:' + num(m.s) + ', c:' + q(m.c) + ' }';
    }).join(', ');
    out += '    { name:' + q(p.name) + ', pos:[' + p.pos.map(num).join(',') + '], rkm:' + num((p.rkm != null) ? p.rkm : 29371) +
           ', rot:' + num(p.rot || 0) + ', rspd:' + num((p.rspd != null) ? p.rspd : 0.1) +
           ', axx:' + num(p.axx || 0) + ', axy:' + num(p.axy || 0) + ', axz:' + num(p.axz || 0) +
           ', kind:' + q(p.kind) + (p.type ? ', type:' + q(p.type) : '') + ', palette:' + q(p.palette) + ', rings:' + !!p.rings + ', moons:[' + ms + '], jets:' + !!p.jets +
           ', unlock:' + num(p.unlock) + ', track:' + q(p.track || '') + ', fx:' + JSON.stringify(p.fx) + ' }';
    out += (i < PLANETS_DB.planets.length - 1) ? ',\n' : '\n';
  });
  out += '  ]\n};';
  return out;
}
function importDB(){
  var t = gid('edTa_PLANETS_DB').value.trim();
  t = t.replace(/^\s*(?:var|let|const)?\s*PLANETS_DB\s*=\s*/, '').replace(/;\s*$/, '');
  try {
    var db = (new Function('return (' + t + ')'))();
    if (!db || !db.planets || !db.planets.length) throw new Error('в блоке нет планет');
    var KINDS = ['terrestrial','ocean','stone','energy','cheese','gas','pulsar','neutron','star_g','star_a','star_m'];
    db.planets.forEach(function(p, i){
      var w = 'планета #' + i;
      if (!p || typeof p.name !== 'string' || !p.name.trim()) throw new Error(w + ': пустое имя');
      if (!Array.isArray(p.pos) || p.pos.length !== 3 || p.pos.some(function(v){ return !isFinite(+v); })) throw new Error(w + ' (' + p.name + '): pos — ровно 3 конечных числа');
      if (KINDS.indexOf(p.kind) < 0) throw new Error(w + ' (' + p.name + '): неизвестный kind "' + p.kind + '"');
      if (p.rkm != null && !(+p.rkm > 0)) throw new Error(w + ' (' + p.name + '): rkm должен быть > 0');
      if (p.unlock != null && !(+p.unlock >= 0)) throw new Error(w + ' (' + p.name + '): unlock не может быть отрицательным');
    });
    htPush(htSnap()); /* шаг истории ДО импорта */
    PLANETS_DB.soi = (db.soi != null) ? db.soi : PLANETS_DB.soi;
    PLANETS_DB.planets = JSON.parse(JSON.stringify(db.planets));
    rebuildPW();
    cur = 0; window.__splashPlanet = 0;
    buildPlanet();
    toast('Реестр импортирован: планет — ' + db.planets.length + ' (откат: Alt+Z)');
  } catch(e){ toast('Импорт не удался: ' + e.message); }
}

function buildPlanet(){
  var p = PLANETS_DB.planets[cur];
  panP.innerHTML = '';
  panP.appendChild(el('h3', null, 'ПЛАНЕТА: ' + p.name));

  /* селектор планет */
  var sel = el('div', {'class':'frow planets'});
  PLANETS_DB.planets.forEach(function(pp, i){
    var b = el('button', {'class':'edbtn plbtn' + (i === cur ? ' on' : ''), type:'button'}, (i + 1) + '·' + pp.name);
    b.addEventListener('click', function(){ pickPlanet(i); });
    sel.appendChild(b);
  });
  panP.appendChild(sel);

  /* общее */
  panP.appendChild(sec('ОБЩЕЕ'));
  panP.appendChild(mkText(p, 'name', 'ИМЯ'));
  var kindSel = el('select');
  ['terrestrial','ocean','stone','energy','cheese','gas','pulsar','neutron','star','star-gl'].forEach(function(k){
    var o = el('option', {value:k}, k);
    if (k === p.kind) o.selected = true;
    kindSel.appendChild(o);
  });
  kindSel.addEventListener('change', function(){
    var old = p.fx.surf || {};
    p.kind = kindSel.value;
    /* пересобрать surf под новый тип, сохранив общие коэффициенты */
    var ns = {};
    SURF_R.forEach(function(r){ ns[r[0]] = (old[r[0]] != null) ? old[r[0]] : (p.fx.surf ? p.fx.surf[r[0]] : 0.5); });
    ns.scale = ns.scale || 1;
    SURF_C[p.kind].forEach(function(cc){ if (old[cc[0]] != null) ns[cc[0]] = old[cc[0]]; else { var dd = FXDEF[PKIND[p.kind]]; if (dd && dd.surf && dd.surf[cc[0]] != null) ns[cc[0]] = dd.surf[cc[0]]; } });
    p.fx.surf = ns;
    buildPlanet();
    toast('Тип: ' + p.kind + ' — поверхность пересобрана');
  });
  panP.appendChild(frow('ТИП', kindSel));
  panP.appendChild(mkColor(p, 'palette', 'БАЗОВЫЙ ЦВЕТ'));
  var posWrap = el('div', {'class':'frow'});
  posWrap.appendChild(el('label', null, 'POS x y z'));
  ['0','1','2'].forEach(function(ix){
    var t = el('input', {type:'number', step:'any'});
    t.value = p.pos[ix];
    t.style.width = '58px';
    t.addEventListener('change', function(){ p.pos[ix] = +t.value || 0; rebuildPW(); });
    posWrap.appendChild(t);
  });
  panP.appendChild(posWrap);
  var rkmWrap = el('div', {'class':'frow'});
  rkmWrap.appendChild(el('label', null, 'РАДИУС, км'));
  var rkmIn = el('input', {type:'number', step:'any'});
  rkmIn.value = (p.rkm != null) ? p.rkm : ((typeof PLANET_RADIUS_KM !== 'undefined') ? PLANET_RADIUS_KM : 29371);
  rkmIn.addEventListener('change', function(){ p.rkm = +rkmIn.value || 29371; });
  rkmWrap.appendChild(rkmIn);
  panP.appendChild(rkmWrap);
  var rotWrap = el('div', {'class':'frow'});
  rotWrap.appendChild(el('label', null, 'УГОЛ ВРАЩ.'));
  var rotIn = el('input', {type:'number', step:'any'});
  rotIn.value = (p.rot != null) ? p.rot : 0;
  rotIn.addEventListener('change', function(){ p.rot = +rotIn.value || 0; if(window.__palRebuild) window.__palRebuild(); });
  rotWrap.appendChild(rotIn);
  panP.appendChild(rotWrap);
  var rspdWrap = el('div', {'class':'frow'});
  rspdWrap.appendChild(el('label', null, 'СКОР. ВРАЩ.'));
  var rspdIn = el('input', {type:'number', step:'any'});
  rspdIn.value = (p.rspd != null) ? p.rspd : 0.1;
  rspdIn.addEventListener('change', function(){ p.rspd = +rspdIn.value || 0.1; if(window.__palRebuild) window.__palRebuild(); });
  rspdWrap.appendChild(rspdIn);
  panP.appendChild(rspdWrap);
  var axsWrap = el('div', {'class':'frow'});
  axsWrap.appendChild(el('label', null, 'ОСЬ X/Y/Z °'));
  var axsIn = el('input', {type:'text'});
  axsIn.value = ((p.axx != null) ? p.axx : 0) + ', ' + ((p.axy != null) ? p.axy : 0) + ', ' + ((p.axz != null) ? p.axz : 0);
  axsIn.addEventListener('change', function(){
    var v = (axsIn.value || '').split(',').map(function(t){ return parseFloat(t) || 0; });
    p.axx = v[0] || 0; p.axy = v[1] || 0; p.axz = v[2] || 0;
    if(window.__palRebuild) window.__palRebuild();
  });
  axsWrap.appendChild(axsIn);
  panP.appendChild(axsWrap);
  panP.appendChild(mkText(p, 'unlock', 'UNLOCK (EXP)', null, true));
  panP.appendChild(mkText(p, 'track', 'ТРЕК (.ogg)'));
  panP.appendChild(mkCheck(p.fx, 'ring', 'КОЛЬЦО (общ.)', function(){ syncFlags(p); }));
  panP.appendChild(mkCheck(p.fx, 'jets', 'ДЖЕТЫ (общ.)', function(){ syncFlags(p); }));


  /* пресеты */
  panP.appendChild(sec('ПРЕСЕТ'));
  var prSel = el('select');
  prSel.appendChild(el('option', {value:''}, '— выбери пресет —'));
  (function(){
    var keys = Object.keys(PLANET_PRESETS);
    for (var i = 0; i < keys.length; i++){
      var pk = keys[i], P = PLANET_PRESETS[pk];
      var t = P.label + (P.kind && P.kind !== p.kind ? ' [' + P.kind + ']' : '');
      prSel.appendChild(el('option', {value:pk}, t));
    }
  })();
  if (p.type && PLANET_PRESETS[p.type]) prSel.value = p.type;
  var bApply = el('button', {'class':'edbtn2', type:'button'}, 'ПРИМЕНИТЬ');
  bApply.addEventListener('click', function(){
    var pk = prSel.value;
    if(!pk){ toast('Сначала выбери пресет в списке'); return; }
    var P = PLANET_PRESETS[pk];
    p.type = pk;
    if (P.kind) p.kind = P.kind;
    p.fx = JSON.parse(JSON.stringify(P.fx));
    syncFlags(p);
    buildPlanet();
    toast('Пресет применён: ' + P.label);
  });
  var prRow = el('div', {'class':'frow'});
  prRow.appendChild(prSel);
  prRow.appendChild(bApply);
  panP.appendChild(prRow);
  panP.appendChild(el('div', {'class':'fnote'}, 'Пресет перезаписывает облик: атмосферу, поверхность, солнце, джеты и кольцо. После применения всё можно докрутить — правки станут явными и сильнее пресета. Тип тела меняется на канонический для пресета.'));
  /* атмосфера */
  panP.appendChild(sec('АТМОСФЕРА И ЯДРО'));
  panP.appendChild(mkColor(p.fx, 'atm', 'ЦВЕТ АТМ'));
  panP.appendChild(mkRange(p.fx, 'glow', 'СВЕЧЕНИЕ', 0, 4, 0.01));
  panP.appendChild(mkRange(p.fx, 'size', 'РАДИУС', 0.3, 3, 0.005));
  panP.appendChild(mkRange(p.fx, 'spin', 'ДРЕЙФ ТЕКСТ (SPIN)', 0, 8, 0.05));
  panP.appendChild(mkRange(p.fx, 'pulse', 'ПУЛЬС', 0, 8, 0.05));
  if (p.fx.sun == null) p.fx.sun = '#fff4c0';
  panP.appendChild(mkColor(p.fx, 'sun', 'ЦВЕТ СОЛНЦА'));
  if(p.fx.sunB==null)p.fx.sunB=1; panP.appendChild(mkRange(p.fx,'sunB','ЯРК. СОЛНЦА',0.2,5,0.05,null,function(v){return (v*100).toFixed(0)+'%';}));
  if(p.fx.sunR==null)p.fx.sunR=0.0008; panP.appendChild(mkRange(p.fx,'sunR','РАЗМЕР СОЛНЦА',0.0002,0.0032,0.0001,null,function(v){return (v*1250).toFixed(0)+'%';}));

  /* джеты */
  panP.appendChild(sec('ДЖЕТЫ'));
  panP.appendChild(mkCheck(p.fx.jets, 'on', 'ВКЛ', function(){ syncFlags(p); }));
  panP.appendChild(mkColor(p.fx.jets, 'c1', 'ЦВЕТ 1'));
  panP.appendChild(mkColor(p.fx.jets, 'c2', 'ЦВЕТ 2'));
  panP.appendChild(mkRange(p.fx.jets, 'sp', 'СКОРОСТЬ', 0, 1, 0.001));
  panP.appendChild(mkRange(p.fx.jets, 'len', 'ДЛИНА', 0, 20, 0.1));

  /* кольцо */
  panP.appendChild(sec('КОЛЬЦО'));
  panP.appendChild(mkCheck(p.fx.ring, 'on', 'ВКЛ', function(){ syncFlags(p); }));
  panP.appendChild(mkColor(p.fx.ring, 'c', 'ЦВЕТ'));
  panP.appendChild(mkRange(p.fx.ring, 'sp', 'СКОРОСТЬ', 0, 0.3, 0.005));
  panP.appendChild(mkRange(p.fx.ring, 'in', 'ВНУТР. РАД', 0.5, 3, 0.01));
  panP.appendChild(mkRange(p.fx.ring, 'out', 'ВНЕШН. РАД', 0.5, 6, 0.01));

  /* поверхность */
  panP.appendChild(sec('ПОВЕРХНОСТЬ (' + p.kind + ')'));
  var sf = p.fx.surf = p.fx.surf || {};
  SURF_R.forEach(function(r){
    if (sf[r[0]] == null) sf[r[0]] = 0.5;
    panP.appendChild(mkRange(sf, r[0], r[1], r[2], r[3], r[4]));
  });
  (SURF_C[p.kind] || []).forEach(function(cc){
    if (sf[cc[0]] == null) { var dd2 = FXDEF[PKIND[p.kind]]; sf[cc[0]] = (dd2 && dd2.surf && dd2.surf[cc[0]] != null) ? dd2.surf[cc[0]] : '#888888'; }
    panP.appendChild(mkColor(sf, cc[0], cc[1]));
  });

  /* луны */
  panP.appendChild(sec('ЛУНЫ (' + (p.moons || []).length + ')'));
  var moonBox = el('div');
  panP.appendChild(moonBox);
  function drawMoons(){
    moonBox.innerHTML = '';
    (p.moons || []).forEach(function(m, mi){
      var rw = el('div', {'class':'frow'});
      rw.appendChild(el('label', null, 'ЛУНА ' + (mi + 1)));
      var d = el('input', {type:'number', step:'0.1', value:m.d, title:'дистанция'});
      var s = el('input', {type:'number', step:'0.05', value:m.s, title:'скорость'});
      var c = el('input', {type:'color', value:m.c});
      d.style.width = '44px'; s.style.width = '44px'; c.style.width = '30px';
      d.addEventListener('change', function(){ m.d = +d.value || 0; });
      s.addEventListener('change', function(){ m.s = +s.value || 0; });
      c.addEventListener('input', function(){ m.c = c.value; });
      var x = el('button', {'class':'edbtn2 del', type:'button'}, '✕');
      x.addEventListener('click', function(){ p.moons.splice(mi, 1); drawMoons(); });
      rw.appendChild(d); rw.appendChild(s); rw.appendChild(c); rw.appendChild(x);
      moonBox.appendChild(rw);
    });
  }
  drawMoons();
  var addM = el('button', {'class':'edbtn2', type:'button'}, '+ ЛУНА');
  addM.addEventListener('click', function(){
    p.moons = p.moons || [];
    p.moons.push({d:2.7, s:0.35, c:'#d8d2c4'});
    drawMoons();
  });
  panP.appendChild(addM);
  var mnote = el('div', {'class':'fnote'}, 'Луны — данные игрового мира: фон-движок их не рисует, их видит полёт (спрайты).');
  panP.appendChild(mnote);

  /* экспорт / импорт / сброс */
  panP.appendChild(sec('ЭКСПОРТ РЕЕСТРА'));
  addExport(panP, exportDB, 'PLANETS_DB');
  var ioRow = el('div', {'class':'frow'});
  var bImp = el('button', {'class':'edbtn2', type:'button'}, 'ИМПОРТ');
  bImp.addEventListener('click', importDB);
  var bRst = el('button', {'class':'edbtn2 del', type:'button'}, 'СБРОС ПЛАНЕТЫ');
  bRst.addEventListener('click', function(){
    PLANETS_DB.planets[cur] = JSON.parse(JSON.stringify(ORIG.planets[cur]));
    rebuildPW();
    buildPlanet();
    toast('Планета восстановлена из оригинала');
  });
  ioRow.appendChild(bImp); ioRow.appendChild(bRst);
  panP.appendChild(ioRow);
  var inote = el('div', {'class':'fnote'}, 'Импорт: вставь в поле экспорта блок var PLANETS_DB = {...} и нажми ИМПОРТ.');
  panP.appendChild(inote);
}

/* ═══ ВКЛАДКА «ПОЛЁТ» (CFG) ═══ */
var flightBuilt = false;
function buildFlight(){
  if (flightBuilt) return;
  var C = window.CFG;
  if (!C){ panF.innerHTML = '<h3>ПОЛЁТ</h3><div class="fnote">CFG недоступен — модуль игры не загрузился</div>'; flightBuilt = false; return; }
  flightBuilt = true;
  panF.innerHTML = '';
  panF.appendChild(el('h3', null, 'CFG — РЕГУЛЯТОРЫ ПОЛЁТА'));
  panF.appendChild(el('div', {'class':'fnote'}, 'Меняется на лету. Спавн предметов (кейки/сыры/перцы) и HP-ступени пересчитываются при следующем старте игры.'));

  Object.keys(C).forEach(function(k){
    var v = C[k];
    if (typeof v === 'number' && isFinite(v)){
      var a = Math.abs(v);
      var mx = a === 0 ? 1 : a * 4;
      var mn = v < 0 ? -mx : 0;
      var st = a === 0 ? 0.01 : a >= 100 ? 1 : a >= 10 ? 0.5 : a >= 1 ? 0.05 : a >= 0.1 ? 0.005 : 0.0005;
      panF.appendChild(mkRange(C, k, k, mn, mx, st));
    } else if (Array.isArray(v)){
      var ta = el('textarea', {'class':'edTa small'});
      ta.value = JSON.stringify(v);
      ta.rows = 2;
      ta.addEventListener('change', function(){
        try {
          var arr = JSON.parse(ta.value);
          if (!Array.isArray(arr)) throw new Error('нужен массив');
          C[k] = arr;
          toast(k + ' обновлён');
        } catch(e){ toast(k + ': ' + e.message + ' — reverted'); ta.value = JSON.stringify(C[k]); }
      });
      panF.appendChild(frow(k, ta));
    }
    /* вычисляемые поля (FOV_TAN — не число/массив) пропускаются */
  });

  panF.appendChild(sec('ЭКСПОРТ CFG'));
  function exportCFG(){
    if (!window.CFG) return '';
    return 'var CFG = ' + JSON.stringify(window.CFG, function(k, v){ return typeof v === 'function' ? undefined : v; }, 2).replace(/"([A-Za-z_$][\w$]*)":\s/g, '$1: ') + ';';
  }
  addExport(panF, exportCFG, 'CFG');
  var bRst = el('button', {'class':'edbtn2 del', type:'button'}, 'СБРОС CFG');
  bRst.addEventListener('click', function(){
    if (!CFG_ORIG) return;
    Object.keys(CFG_ORIG).forEach(function(k){ window.CFG[k] = JSON.parse(JSON.stringify(CFG_ORIG[k])); });
    panF.innerHTML = '';
    flightBuilt = false;
    buildFlight();
    toast('CFG восстановлен из оригинала');
  });
  panF.appendChild(bRst);
}

/* Старт: панель планеты сразу */
buildPlanet();
setMode('planet');
toast('Редактор вселенной готов. Tab — скрыть/показать панели');

/* ═════════ TOOLS v2: ИСТОРИЯ ШАГОВ · СЕССИЯ · ДИФФ (паттерн RASTER) ═════════
   Реестр шагов: каждое устойчивое изменение реестра/CFG — шаг в стеке (глубина 40).
   Сессия: правки автосохраняются и переживают перезагрузку страницы.
   ДИФФ: экспорт только изменённого против оригинала + патч CFG. */
var SKEY_ED = 'hitomi_tools_session_v2';
function htStrip(o){ return JSON.parse(JSON.stringify(o, function(k, v){ return typeof v === 'function' ? undefined : v; })); }
function htClone(o){ return JSON.parse(JSON.stringify(o)); }
function htSnap(){ return JSON.stringify({ db: { soi: PLANETS_DB.soi, planets: PLANETS_DB.planets }, cfg: htStrip(window.CFG || {}) }); }
var htPristine = htSnap(); /* оригинал для диффа — ДО восстановления сессии */
var htHist = [htPristine], htIdx = 0, htPend = null, htPendT = 0, htLock = 0;

function htApply(json){
  try {
    htLock = 1;
    var s = JSON.parse(json);
    PLANETS_DB.soi = s.db.soi;
    PLANETS_DB.planets = htClone(s.db.planets);
    var C = window.CFG || {};
    Object.keys(s.cfg).forEach(function(k){ try { C[k] = htClone(s.cfg[k]); } catch(e){} });
    window.CFG = C;
    rebuildPW();
    try { cur = 0; buildPlanet(); } catch(e){}
    if (mode === 'flight'){ try { panF.innerHTML = ''; flightBuilt = false; buildFlight(); } catch(e){} }
  } catch(e) { toast('Откат не удался: ' + e.message); }
  setTimeout(function(){ htLock = 0; }, 500);
}
function htSaveSess(){
  try { localStorage.setItem(SKEY_ED, JSON.stringify({ t: Date.now(), db: { soi: PLANETS_DB.soi, planets: htClone(PLANETS_DB.planets) }, cfg: htStrip(window.CFG || {}) })); } catch(e){}
}
function htPush(json){
  htHist = htHist.slice(0, htIdx + 1);
  htHist.push(json);
  if (htHist.length > 41) htHist.shift();
  htIdx = htHist.length - 1;
  htSaveSess();
  htUndoBtns();
}
/* опрос состояния: толкаем шаг только когда значение устоялось (ползунки не заливают историю) */
setInterval(function(){
  if (htLock) return;
  var s = htSnap();
  if (s === htHist[htIdx]) { htPend = null; return; }
  if (s === htPend) { if (Date.now() - htPendT > 350) { htPush(s); htPend = null; } }
  else { htPend = s; htPendT = Date.now(); }
}, 250);
function htUndo(){
  if (htIdx <= 0) { toast('Откатывать нечего — это оригинал'); return; }
  htIdx--; htApply(htHist[htIdx]); htSaveSess(); htUndoBtns();
  toast('⟲ Откат: шаг ' + htIdx + ' из ' + (htHist.length - 1));
}
function htRedo(){
  if (htIdx >= htHist.length - 1) { toast('Повторять нечего'); return; }
  htIdx++; htApply(htHist[htIdx]); htSaveSess(); htUndoBtns();
  toast('⟳ Повтор: шаг ' + htIdx + ' из ' + (htHist.length - 1));
}
function htUndoBtns(){
  var u = gid('edUndo'), r = gid('edRedo');
  if (u) u.style.opacity = htIdx > 0 ? '1' : '.35';
  if (r) r.style.opacity = htIdx < htHist.length - 1 ? '1' : '.35';
}
document.addEventListener('keydown', function(e){
  if (e.altKey && !e.ctrlKey && e.code === 'KeyZ'){ e.preventDefault(); e.shiftKey ? htRedo() : htUndo(); }
  if (e.altKey && !e.ctrlKey && e.code === 'KeyY'){ e.preventDefault(); htRedo(); }
});
var htBUndo = el('button', { id: 'edUndo', 'class': 'edbtn', type: 'button', title: 'Отменить (Alt+Z)' }, '⟲');
var htBRedo = el('button', { id: 'edRedo', 'class': 'edbtn', type: 'button', title: 'Вернуть (Alt+Y)' }, '⟳');
htBUndo.addEventListener('click', htUndo);
htBRedo.addEventListener('click', htRedo);
bar.insertBefore(htBRedo, gid('edHide'));
bar.insertBefore(htBUndo, htBRedo);

/* --- панель диффа --- */
var htPanD = el('div', { 'class': 'edp', 'data-keep': '1' });
htPanD.style.cssText = 'left:auto;right:10px;top:52px;width:520px;max-height:calc(100vh - 80px);';
htPanD.innerHTML = '<h3>ДИФФ — только изменения против оригинала</h3>';
var htTaD = el('textarea', { 'class': 'edTa' });
htTaD.style.height = '46vh';
htPanD.appendChild(htTaD);
var htRowD = el('div', { 'class': 'frow' });
var htBCopyD = el('button', { 'class': 'edbtn2', type: 'button' }, 'КОПИРОВАТЬ');
htBCopyD.addEventListener('click', function(){ htTaD.select(); try { document.execCommand('copy'); toast('Скопировано в буфер'); } catch(e){ toast('Не удалось скопировать — Ctrl+C'); } });
var htBDlD = el('button', { 'class': 'edbtn2', type: 'button' }, 'СКАЧАТЬ');
htBDlD.addEventListener('click', function(){
  var a = el('a', { href: URL.createObjectURL(new Blob([htTaD.value], { type: 'text/plain' })), download: 'PLANETS_DB_diff.js' });
  document.body.appendChild(a); a.click(); a.remove();
  toast('Файл PLANETS_DB_diff.js скачан');
});
var htBCloseD = el('button', { 'class': 'edbtn2 del', type: 'button' }, '✕');
htBCloseD.addEventListener('click', function(){ htPanD.classList.remove('show'); });
htRowD.appendChild(htBCopyD); htRowD.appendChild(htBDlD); htRowD.appendChild(htBCloseD);
htPanD.appendChild(htRowD);
document.body.appendChild(htPanD);

function htDiff(){
  var p0 = JSON.parse(htPristine);
  var pmap = {};
  p0.db.planets.forEach(function(p){ pmap[p.name] = p; });
  var changed = PLANETS_DB.planets.filter(function(p){ var o = pmap[p.name]; return !o || JSON.stringify(o) !== JSON.stringify(p); });
  var gone = p0.db.planets.filter(function(p){ return !PLANETS_DB.planets.some(function(c){ return c.name === p.name; }); });
  var soiDiff = +p0.db.soi !== +PLANETS_DB.soi;
  if (!changed.length && !gone.length && !soiDiff) { toast('Изменений нет — дифф пуст'); return; }
  var labels = changed.map(function(p){ return (pmap[p.name] ? 'ПРАВКА: ' : 'НОВАЯ: ') + p.name; })
    .concat(gone.map(function(p){ return 'УДАЛЕНА: ' + p.name; })).join('; ');
  var saved = PLANETS_DB.planets, savedSoi = PLANETS_DB.soi;
  PLANETS_DB.planets = changed; /* форматируем только изменённые — тем же exportDB */
  var txt = '/* ДИФФ ' + new Date().toLocaleString() + ' — применить ИМПОРТОМ поверх оригинала */\n';
  txt += '/* ' + labels + (soiDiff ? ' ; soi: ' + savedSoi : '') + ' */\n' + exportDB();
  PLANETS_DB.planets = saved;
  var c0 = p0.cfg || {}, c1 = htStrip(window.CFG || {}), cd = {};
  Object.keys(c1).forEach(function(k){ if (JSON.stringify(c0[k]) !== JSON.stringify(c1[k])) cd[k] = c1[k]; });
  if (Object.keys(cd).length) txt += '\n\n/* ИЗМЕНЁННЫЕ КЛЮЧИ CFG — перенести в CFG игры */\nvar CFG_PATCH = ' + JSON.stringify(cd).replace(/"([A-Za-z_$][\w$]*)":\s/g, '$1: ') + ';';
  htTaD.value = txt;
  htPanD.classList.add('show');
}
var htBDiff = el('button', { id: 'edDiff', 'class': 'edbtn', type: 'button', title: 'Дифф против оригинала' }, 'ДИФФ');
htBDiff.addEventListener('click', htDiff);
bar.insertBefore(htBDiff, gid('edHide'));

/* --- сброс сессии: стереть и вернуть оригинал --- */
var htBSess = el('button', { id: 'edSess', 'class': 'edbtn', type: 'button', title: 'Стереть сессию и вернуть оригинал' }, 'СЕСС ✕');
htBSess.addEventListener('click', function(){
  try { localStorage.removeItem(SKEY_ED); } catch(e){}
  htApply(htPristine);
  htHist = [htPristine]; htIdx = 0; htUndoBtns();
  toast('Сессия стёрта — реестр возвращён к оригиналу');
});
bar.insertBefore(htBSess, gid('edHide'));

/* --- восстановление сессии при старте --- */
(function htRestore(){
  try {
    var raw = localStorage.getItem(SKEY_ED);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (!s || !s.db || !s.db.planets || !s.db.planets.length) return;
    htApply(JSON.stringify(s));
    htPush(htSnap());
    toast('Сессия восстановлена: ' + new Date(s.t).toLocaleTimeString());
  } catch(e){}
})();
htUndoBtns();
})();

</script>
</body>
</html>
