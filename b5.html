<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRC-BackUp-GL · Мишка (SVG + анимация)</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#0a0e16; color:#dfe7f0; font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; }
  header{ padding:16px 20px; border-bottom:1px solid #1c2838; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1{ font-size:15px; letter-spacing:1px; text-transform:uppercase; color:#4fd8ff; }
  header button{ background:#16202e; color:#9fd8ff; border:1px solid #2c3a52; border-radius:6px; padding:6px 12px; cursor:pointer; font:12px/1 monospace; }
  header button:hover{ background:#1e2c3e; }
  .stage{ display:flex; flex-direction:column; align-items:center; padding:20px; gap:16px; }
  .bearbox{ position:relative; }
  .bearbox.jump .bear{ animation:mg-jump .55s cubic-bezier(.3,0,.4,1); }
  .bearbox.jump .shadow{ animation:mg-shadow .55s cubic-bezier(.3,0,.4,1); }
  /* ── анимации мишки (перенос из WORK GL) ── */
  .gbear .bear{ animation:zg-bob 3.2s ease-in-out infinite; }
  .gbear .ear-left{ transform-box:view-box; transform-origin:150px 90px; animation:mg-earL 3.4s ease-in-out infinite; }
  .gbear .ear-right{ transform-box:view-box; transform-origin:362px 90px; animation:mg-earR 3.4s ease-in-out -1.2s infinite; }
  .gbear .head{ transform-box:view-box; transform-origin:256px 250px; animation:mg-nod 5.2s ease-in-out infinite; }
  .gbear .eye{ transform-box:fill-box; transform-origin:center; animation:mg-blink 4.6s infinite; }
  .gbear .eye.right{ animation-delay:4.4s; }
  .gbear .star{ transform-box:fill-box; transform-origin:center; opacity:1; animation:mg-twinkle 1.4s ease-in-out infinite; }
  .gbear .star:nth-of-type(2){ animation-delay:.25s; }
  .gbear .star:nth-of-type(3){ animation-delay:.5s; }
  .gbear .star:nth-of-type(4){ animation-delay:.75s; }
  .gbear .body-group{ transform-box:view-box; transform-origin:256px 400px; animation:mg-breathe 4s ease-in-out infinite; }
  .gbear .paw-right{ transform-box:view-box; transform-origin:402px 300px; transition:transform .4s cubic-bezier(.34,1.6,.64,1); }
  .bearbox:hover .paw-right{ transform:rotate(-38deg) translateY(-10px); }
  @keyframes zg-bob{ 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-7px) rotate(2.5deg)} }
  @keyframes mg-earL{ 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-6deg)} }
  @keyframes mg-earR{ 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(6deg)} }
  @keyframes mg-nod{ 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(3deg) translateY(3px)} }
  @keyframes mg-blink{ 0%,4%,100%{transform:scaleY(1)} 6%{transform:scaleY(.08)} 8%,10%{transform:scaleY(1)} }
  @keyframes mg-twinkle{ 0%{opacity:.2; transform:scale(.4) rotate(0deg)} 50%{opacity:1; transform:scale(1.15) rotate(35deg)} 100%{opacity:.2; transform:scale(.4) rotate(70deg)} }
  @keyframes mg-breathe{ 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.012,.992)} }
  @keyframes mg-jump{
    0%{transform:translateY(0) scale(1,1)}
    15%{transform:translateY(4px) scale(1.04,.96)}
    40%{transform:translateY(-30px) scale(1.03,.97)}
    65%{transform:translateY(0) scale(.95,1.06)}
    80%{transform:translateY(-10px) scale(1,1)}
    100%{transform:translateY(0) scale(1,1)}
  }
  @keyframes mg-shadow{
    0%{transform:scale(1); opacity:.9}
    40%{transform:scale(.6,.5); opacity:.4}
    65%{transform:scale(1.08,.9); opacity:1}
    80%{transform:scale(.95); opacity:.85}
    100%{transform:scale(1); opacity:.9}
  }
  .hint{ font:11px/1.6 monospace; color:#7c8aa0; max-width:560px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Мишка · SVG + анимация</h1>
  <button id="jump">Прыжок</button>
  <button id="toggleBob">Пауза покачивания</button>
  <button id="toggleNod">Пауза наклона</button>
</header>

<div class="stage">
  <div class="bearbox" id="bearbox"></div>
  <div class="hint">
    Наведи курсор — мишка машет лапкой, кивает, моргает и светится звёздами (hover-эффекты из игры).
    «Прыжок» — анимация mg-jump с тенью. Источник: SVG и анимации из WORK GL.html (.gbear).
  </div>
</div>

  const box = document.getElementById('bearbox');
  box.classList.add('gbear');
  box.innerHTML = svg;
  const bear = box.querySelector('.bear');

  /* кнопка прыжка */
  document.getElementById('jump').addEventListener('click', function(){
    box.classList.add('jump');
    bear.addEventListener('animationend', function h(e){ if(e.animationName==='mg-jump'){ box.classList.remove('jump'); bear.removeEventListener('animationend', h); } });
  });
  /* пауза покачивания (zg-bob на .bear) */
  document.getElementById('toggleBob').addEventListener('click', function(){
    const on = bear.style.animationName !== 'none';
    bear.style.animation = on ? 'none' : '';
    this.textContent = on ? 'Вкл. покачивание' : 'Пауза покачивания';
  });
  /* пауза наклона головы */
  document.getElementById('toggleNod').addEventListener('click', function(){
    const hd = box.querySelector('.head');
    const on = hd.style.animationName !== 'none';
    hd.style.animation = on ? 'none' : '';
    this.textContent = on ? 'Вкл. наклон' : 'Пауза наклона';
  });
})();
</script>
</body>
</html>
