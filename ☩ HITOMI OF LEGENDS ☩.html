<script>
/* ═══════════════════════════════════════════════════════════════
   ☩ P32 CORE-SYNC: ЗАГРУЗЧИК (паттерн ARK) + seeded-RNG ☩
   Паттерн RASTER: загрузка со стадиями и прогрессом; при падении
   этапа — сообщение на экране, а не тихая смерть страницы.
   ═══════════════════════════════════════════════════════════════ */
(function(){'use strict';
  var STAGES = ['РЕЕСТРЫ','ШЕЙДЕРЫ','ИГРА','ГОТОВО'];
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:radial-gradient(circle at 50% 40%,#1a1030,#0a0a14);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;color:#ffd;transition:opacity .45s;';
  ov.innerHTML = '<div style="font-size:20px;letter-spacing:3px;color:#f7cc1d;">☩ HITOMI OF LEGENDS ☩</div>'
    + '<div id="loadStage" style="font-size:12px;color:#9fd8ff;margin:8px 0 20px;">Инициализация…</div>'
    + '<div style="width:280px;height:13px;border:2px inset #663;background:#000;border-radius:7px;overflow:hidden;">'
    + '<div id="loadBar" style="height:100%;width:3%;background:linear-gradient(90deg,#f7cc1d,#fa0);transition:width .3s;"></div></div>';
  document.body.appendChild(ov);
  var done = false, stage = -1;
  function mark(name){
    var i = STAGES.indexOf(name);
    if(i < 0 || i <= stage) return;
    stage = i;
    var bar = document.getElementById('loadBar'), txt = document.getElementById('loadStage');
    if(txt) txt.textContent = name;
    if(bar) bar.style.width = ((i+1)/STAGES.length*100).toFixed(0)+'%';
    if(name === 'ГОТОВО'){ done = true; setTimeout(function(){ ov.style.opacity='0'; setTimeout(function(){ if(ov.parentNode) ov.remove(); }, 450); }, 250); }
  }

    mark: mark,
    fail: function(why){

  var NOTE_KEYS={};
  ('ZSXDCVGBHNM,.;/\"Q2W3ER5T6Y7UI9O0P[]\'AWSEDFTGYHUJKOLP').split('').forEach(function(k){ NOTE_KEYS[k.toLowerCase()]=1; });

    if(e.repeat) return;
    var t=e.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;

<script>
/* ═══════════════ КОНСТАНТЫ СИМУЛЯЦИИ ФОНА (править здесь) ═══════════════ */
/* Графика перенесена из GLSL-стенда R46 «ГРАНЬ» без изменений шейдера.      */
/* ☩ ИНВАРИАНТ МАСШТАБА: 1 мировой юнит = радиус Хитоми (29371 км).
   Радиусы тел — только через PLANETS_DB.rkm (bodyRadiusKm); локальных
   пересчётов км↔юниты вне этой точки не заводить. */
const PLANET_RADIUS_KM  = 29371.0;   /* радиус планеты, км — база инварианта  */
const FLIGHT_SPEED_KMH  = 292000.0;   /* скорость полёта, км/ч                 */
const SIM_TIME_SCALE    = 60.0;      /* 1 реальная секунда = N секунд симуляции */
const DAY_CYCLE_HOURS   = 1.0;       /* длительность суток, сим-часов         */
const CAMERA_ALT_KM     = 1000.0;     /* высота орбиты камеры                  */
const FOV_DEG           = 60.0;      /* вертикальный угол обзора              */
const RENDER_SCALE      = 1.0;       /* в стенде было 2.3 — для фона тяжело; 1.0 честнее */
const START_PHASE_RAD   = 0.0;       /* стартовое положение камеры на орбите  */

const CAM_R = 1.0 + CAMERA_ALT_KM / PLANET_RADIUS_KM;
const ORBIT_PERIOD_SIM_SEC = (2*Math.PI*PLANET_RADIUS_KM/FLIGHT_SPEED_KMH)*3600.0;
const DAY_CYCLE_SIM_SEC = DAY_CYCLE_HOURS*3600.0;
const FOV_TAN = Math.tan(FOV_DEG*0.5*Math.PI/180.0);
/* --- ПЕР-ТЕЛОВЫЕ РАЗМЕРЫ: радиус каждого тела задаётся в реестре (поле rkm, км) --- */
/* Источник — PLANETS_DB.planets[pi].rkm (правится в редакторе, поле «РАДИУС, км»).   */
/* Нет записи — работает дефолт PLANET_RADIUS_KM. CAMR шейдера теперь юниформа uBodyR. */
function bodyRotDeg(pi){ try{ var e = PLANETS_DB.planets[pi]; return (e && e.rot != null) ? +e.rot : 0; }catch(_){ return 0; } }
function bodyRspdDeg(pi){ try{ var e = PLANETS_DB.planets[pi]; return (e && e.rspd != null) ? +e.rspd : 0.1; }catch(_){ return 0.1; } }
function bodyAxe(pi){ try{ var e = PLANETS_DB.planets[pi]; return [(+e.axx || 0), (+e.axy || 0), (+e.axz || 0)]; }catch(_){ return [0,0,0]; } }
function eulMat(x, y, z){ /* матрица Rz*Ry*Rx (колонки), градусы */
  var d = Math.PI/180.0, cx = Math.cos(x*d), sx = Math.sin(x*d), cy = Math.cos(y*d), sy = Math.sin(y*d), cz = Math.cos(z*d), sz = Math.sin(z*d);
  return [ cz*cy, sz*cy, -sy,
           cz*sy*sx - sz*cx, sz*sy*sx + cz*cx, cy*sx,
           cz*sy*cx + sz*sx, sz*sy*cx - cz*sx, cy*cx ];
}
function bodyRadiusKm(pi){
  try{
    var e = (typeof PLANETS_DB !== 'undefined' && PLANETS_DB.planets) ? PLANETS_DB.planets[pi] : null;
    if(e && e.rkm) return e.rkm;
  }catch(err){}
  return PLANET_RADIUS_KM;
}

/* ════════════════════════════════════════════════════ */

/* шейдеры — дословно из стенда R46, без изменений */
const VERT = 'attribute vec2 aPos;\nvoid main(){ gl_Position = vec4(aPos, 0.0, 1.0); }';



const FRAG_BASE = `precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform float uCamA;
uniform float uSunA;
uniform float uPlanet;
uniform float uSplash;
uniform float uJetsOn; /* EDIT: синхронно с FRAG */
uniform vec3  uSunC;
uniform float uSunB;
uniform float uSunR;
uniform float uFovCin; /* КИНО-FOV: масштаб FOT во время прыжка, 1.0 = норма */

uniform float uBodyR; /* пер-теловые размеры: радиус текущего тела, км */
 uniform float uRotC;  /* ВРАЩЕНИЕ СФЕРЫ: текущая фаза, рад */
#define R    1.0
#define CAMR uBodyR
#define FOT  (__FOT__ * uFovCin)

/* --- хэш и шумы (средний слой) --- */
float hash13(vec3 p){
  p = fract(p*0.3183099 + vec3(0.1,0.2,0.3));
  p *= 17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}
float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f*f*(3.0-2.0*f);
  float n0=hash13(i);
  float n1=hash13(i+vec3(1.0,0.0,0.0));
  float n2=hash13(i+vec3(0.0,1.0,0.0));
  float n3=hash13(i+vec3(1.0,1.0,0.0));
  float n4=hash13(i+vec3(0.0,0.0,1.0));
  float n5=hash13(i+vec3(1.0,0.0,1.0));
  float n6=hash13(i+vec3(0.0,1.0,1.0));
  float n7=hash13(i+vec3(1.0,1.0,1.0));
  return mix(mix(mix(n0,n1,f.x),mix(n2,n3,f.x),f.y),
             mix(mix(n4,n5,f.x),mix(n6,n7,f.x),f.y),f.z);
}
/* тяжёлый: 5 октав */
float fbm5(vec3 p){
  float v=0.0, a=0.5;
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=p*2.07+vec3(1.7); a*=0.5; }
  return v;
}
/* средний: 3 октавы */
float fbm3(vec3 p){
  float v=0.0, a=0.5;
  for(int i=0;i<3;i++){ v+=a*vnoise(p); p=p*2.13; a*=0.5; }
  return v;
}

/* --- звёзды: три слоя гридов с мерцанием --- */
vec3 stars(vec3 rd){
  vec3 c = vec3(0.0);
  for(int L=0; L<3; L++){
    float sc = 90.0 + float(L)*80.0;
    vec3 g  = rd*sc;
    vec3 id = floor(g);
    vec3 fr = fract(g) - 0.5;
    float h = hash13(id + float(L)*37.0);
    if(h > 0.975){
      vec3 off = (vec3(hash13(id+1.0), hash13(id+2.0), hash13(id+3.0)) - 0.5)*0.6;
      float d  = length(fr - off);
      float tw = 0.55 + 0.45*sin(uTime*(1.0+h*4.0) + h*40.0);
      float s  = (1.0 - smoothstep(0.0, 0.14, d))*tw;
      vec3 tint = mix(vec3(0.70,0.80,1.0), vec3(1.0,0.85,0.60), hash13(id+4.0));
      c += s*tint*(0.35 + h*0.8);
    }
  }
  return c;
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes)/uRes.y;

  /* --- камера: орбита через полюса, ось планеты = Y --- */
  vec3 camPos = vec3(cos(uCamA)*CAMR, sin(uCamA)*CAMR, 0.0);
if(uPlanet > 2.5){ camPos.y -= 0.14*uSplash; }
  vec3 fwd = vec3(-sin(uCamA), cos(uCamA), 0.0);
  vec3 up0 = normalize(camPos);
  fwd = normalize(mix(fwd, -up0, 0.22));
  vec3 right = normalize(cross(fwd, up0));
  vec3 upv   = cross(right, fwd);
  vec3 rd    = normalize(fwd + (uv.x*right + uv.y*upv)*FOT);

  /* солнце — экваториальный круг с лёгким наклоном; луна — отстает на 0.9 рад */
  float st = sin(uSunA), ct = cos(uSunA);
  vec3 sunDir  = normalize(vec3(ct, 0.22*st, st));
  vec3 moonDir = normalize(vec3(cos(uSunA+0.9), 0.25, sin(uSunA+0.9)));

  /* пересечение луча со сферой планеты */
  vec3 sC = (uPlanet > 2.5) ? vec3(0.0, -0.14*uSplash, 0.0) : vec3(0.0);
  vec3 wC = camPos - sC;
  float b    = dot(wC, rd);
  float cc   = dot(wC, wC) - R*R;
  float disc = b*b - cc;
  float tHit = -b - sqrt(max(disc, 0.0));
  bool hitP  = (disc > 0.0) && (tHit > 0.0);

  float dayLocal = dot(normalize(camPos), sunDir);
  float dayness  = smoothstep(-0.25, 0.30, dayLocal);

  vec3 col = vec3(0.0);

  if(hitP){
    /* ---- ПЛАНЕТА ---- */
    vec3 p = camPos + rd*tHit;
    vec3 n = normalize(p);
    float nl  = dot(n, sunDir);
    float lit = smoothstep(-0.06, 0.18, nl);

    /* континенты: тяжёлый fbm по нормали, планета медленно вращается */
    vec3  sp   = n*2.6 + vec3(0.0, 0.0, uTime*0.004);
    float cont = fbm5(sp);
    float land = smoothstep(0.46, 0.54, cont);
    /* ДЕТАЛЬ: волнение береговой линии (турбулентность) — плавнее граница суши/океана */
    float coast = fbm3(n*8.0 + vec3(0.0, uTime*0.006, 0.0));
    land = mix(land, smoothstep(0.40, 0.60, cont - 0.10*coast), 0.35);
    vec3 ocean = vec3(0.02,0.10,0.22);
    vec3 landc = mix(vec3(0.08,0.26,0.10), vec3(0.42,0.36,0.20), smoothstep(0.52,0.78,cont));

    /* ДЕТАЛЬ: микро-рельеф суши (горы/равнины) — доп. fbm, не меняет границы суши */
    float mdet = fbm3(n*12.0 + vec3(uTime*0.003, uTime*0.001, 0.0));
    landc *= 0.85 + 0.30*mdet;

    float ice  = smoothstep(0.80, 0.94, abs(n.y));
    vec3 surf  = mix(ocean, landc, land);
    surf = mix(surf, vec3(0.85,0.90,0.95), ice);

    /* облака: второй тяжёлый слой, свой дрейф */
    float cl = fbm5(n*4.2 + vec3(uTime*0.010, 0.0, -uTime*0.006));
    cl = smoothstep(0.50, 0.74, cl);
    surf = mix(surf, vec3(0.95,0.97,1.0), cl*0.9);

    vec3 colDay = surf*(0.15 + 1.05*lit);
    /* блик океана */
    vec3 hv = normalize(sunDir - rd);
    float spec = pow(max(dot(n,hv),0.0), 60.0)*(1.0-land)*(1.0-ice)*(1.0-cl)*lit;
    colDay += vec3(0.9,0.95,1.0)*spec*0.6;

    /* ночь: огни городов на суше, мерцание */
    float cellH = hash13(floor(n*90.0));
    float city  = step(0.80, cellH)*land*(1.0-cl)*(1.0-ice);
    vec3 colNight = surf*0.03 + vec3(1.0,0.75,0.35)*city*0.9*(0.6+0.4*sin(uTime*2.0+cellH*50.0));

    col = mix(colNight, colDay, lit);

    /* ШИНРАРТА-B: поверхность как у НГАЛИН, эффект голубой #eff5f9 */
    if(uPlanet > 2.5){
      vec3 nS = normalize(p - sC);
      float rock = fbm5(nS*3.2);
      vec3 surfS = mix(palc(0.0), palc(1.0), rock); /* КЛАСС O/G/M: база = палитра r1/r2 */
      float riv1 = fbm3(nS*3.5 + vec3(0.0, uTime*0.02, uTime*0.013));
      float riv2 = fbm3(nS*7.0 - vec3(uTime*0.015, 0.0, 0.0));
      float lavS = (1.0 - smoothstep(0.0, 0.02, abs(riv1 - 0.5))) + 0.7*(1.0 - smoothstep(0.0, 0.015, abs(riv2 - 0.5)));
      lavS = min(lavS, 1.0);
      float pulS = 0.75 + 0.25*sin(uTime*1.5 + riv1*40.0);
      col = surfS*(0.45 + 0.55*lit) + palc(2.0)*lavS*pulS*(1.6 + (1.0 - lit)*2.6); /* КЛАСС: прожилки = палитра river; звезда самосветится */
      float fresS = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);
      col += palc(3.0)*fresS*0.45; /* КЛАСС: лимб = палитра fres */
    }

    /* атмосферный ободок на лимбе */
    float fres = pow(1.0 - clamp(dot(-rd, n), 0.0, 1.0), 3.0);
    col += vec3(0.25,0.5,1.0)*fres*(0.2 + 0.8*lit)*1.1;

    /* полярные сияния на ночном полюсе */
    float aurZ = smoothstep(0.72, 0.92, abs(n.y))*(1.0-lit);
    float aur  = fbm3(n*5.0 + vec3(0.0, uTime*0.2, 0.0));
    col += vec3(0.10,0.90,0.45)*aurZ*smoothstep(0.45,0.75,aur)*0.55;
  } else {
    /* ---- НЕБО ---- */
    float daySky = smoothstep(-0.15, 0.35, dayLocal);

    /* ночь: база + звёзды + млечный путь */
    vec3 night = vec3(0.003,0.005,0.011);
    night += stars(rd)*1.3;
    float bandW = pow(max(1.0 - abs(dot(rd, normalize(vec3(0.35,0.85,0.40)))), 0.0), 5.0);
    night += vec3(0.45,0.5,0.7)*bandW*fbm3(rd*4.0)*0.42;
    night += vec3(0.8,0.75,0.6)*bandW*bandW*0.12; /* тёплая центральная полоса млечного пути */

    /* день: градиент к горизонту, зарево у солнца, облака на куполе */
    float horiz = 1.0 - abs(dot(rd, up0));
    vec3 day = mix(vec3(0.22,0.42,0.82), vec3(0.60,0.80,1.0), horiz*0.85);
    float sunAmt = max(dot(rd, sunDir), 0.0);
    day += uSunC*pow(sunAmt, 8.0)*0.50*uSunB;
    day += uSunC*pow(sunAmt, 3.0)*0.18*uSunB; /* тёплый aëreол к горизонту */
    float skycl = fbm5(rd*3.0 + vec3(uTime*0.020, 0.0, uTime*0.013));
    skycl = smoothstep(0.52, 0.78, skycl)*(0.30 + 0.70*horiz);
    day = mix(day, vec3(1.0), skycl*0.75);
    float dSun = dot(rd, sunDir);
    day += uSunC*smoothstep(1.0-uSunR, 1.0-uSunR*0.4375, dSun)*3.0*uSunB;
    day += uSunC*pow(sunAmt, 350.0)*0.9*uSunB;

    col = mix(night, day, daySky);

    if(uPlanet > 2.5){ col = night; }

    /* голубой ореол атмосферы у лимба (лучи мимо планеты) */
    float closest = length(camPos - rd*b);
    /* Гасим ореол, когда луч уходит ОТ планеты (b>0 — ближайшая к центру точка
       луча позади камеры): при развороте камеры на 180° не должно быть засветки.
       Атмосфера планеты остаётся при взгляде на неё (b<0). */
    float atmFwd = 1.0 - smoothstep(-0.2, 0.4, b);
    float atmo = (1.0 - smoothstep(1.0, 1.22, closest))*atmFwd;
    if(uPlanet < 2.5){ col += vec3(0.30,0.55,1.0)*atmo*dayness*0.85; } else { col += vec3(0.05,0.10,0.24)*atmo; }

    /* луна: диск с кратерами, свечение */
    float dM = dot(rd, moonDir);
    float mdisc = smoothstep(0.99950, 0.99980, dM);
    if(mdisc > 0.0){
      vec3 lp = rd - moonDir*dM;
      float cr = fbm3(lp*260.0);
      vec3 mc = vec3(0.78,0.78,0.74)*(0.55 + 0.45*cr);
      float mlit = smoothstep(-0.15, 0.15, dot(moonDir, sunDir));
      vec3 mc2 = mc*mix(0.10, 1.0, mlit);
      col = mix(col, mc2, mdisc);
      col += vec3(0.60,0.65,0.85)*pow(max(dM,0.0), 900.0)*0.30;
    }
  }


  /* ДЖЕТТЫ ШИНРАРТА-B: струи в стиле Elite Dangerous — длинная светящаяся плазма,
     тёплое ядро у полюса, холодное свечение на конце, турбулентные завихрения */
  if(uPlanet > 2.5 && uJetsOn > 0.5){ /* EDIT: джеты пульсаров теперь подчиняются fx.jets.on */
    vec3 jC = sC;
    vec3 jW = camPos - jC;
    float bJ = rd.y;
    float dJd = dot(rd, jW);
    float eJ = jW.y;
    float denJ = 1.0 - bJ*bJ;
    if(abs(denJ) > 0.0001){
      float sJ = (eJ - dJd*bJ)/denJ;
      float tJ = sJ*bJ - dJd;
      if(tJ > 0.0){
        float aJ = abs(sJ);
        /* длинные струи: вдоль оси до 6.5, колокол у полюса */
        float along = smoothstep(0.86, 1.02, aJ)*(1.0 - smoothstep(1.15, 6.5, aJ));
        /* расширение струи с высотой — конус плазмы */
        float wJ = 0.04;   /* постоянная ширина струи (не расширяется при отлёте) */
        vec3 cpt = camPos + tJ*rd - jC - vec3(0.0, sJ, 0.0);
        float rJ = length(cpt);
        /* турбулентность: закрученные струи — смещение ядра по aJ+second cooperative */
        float turb = 0.55 + 0.45*sin(aJ*7.0 - uTime*0.0833);
        float off = 0.30*(1.0 - exp(-aJ*1.4));
        float prof = exp(-(rJ*rJ)/(wJ*wJ)*0.5);
        /* тёплое основание / холодная плазма сверху + неоновый обод */
        float cool = smoothstep(0.8, 4.2, aJ);
        vec3 jetCol = mix(vec3(1.0,0.55,0.20), vec3(0.45,0.75,1.0), cool);
        float twinkle = 0.75 + 0.25*sin(uTime*0.0833 + aJ*5.0);
        /* основной светящийся шлейф */
        col += jetCol*along*prof*twinkle*1.6;
        /* яркое ядро */
        float core = exp(-(rJ*rJ)/(wJ*wJ*0.10)*0.5);

/* --- хэш и шумы (средний слой) --- */
float hash13(vec3 p){
  p = fract(p*0.3183099 + vec3(0.1,0.2,0.3));
  p *= 17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));

float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f*f*(3.0-2.0*f);
  float n0=hash13(i);
  float n1=hash13(i+vec3(1.0,0.0,0.0));
  float n2=hash13(i+vec3(0.0,1.0,0.0));
  float n3=hash13(i+vec3(1.0,1.0,0.0));
  float n4=hash13(i+vec3(0.0,0.0,1.0));
  float n5=hash13(i+vec3(1.0,0.0,1.0));
  float n6=hash13(i+vec3(0.0,1.0,1.0));
  float n7=hash13(i+vec3(1.0,1.0,1.0));
  return mix(mix(mix(n0,n1,f.x),mix(n2,n3,f.x),f.y),
             mix(mix(n4,n5,f.x),mix(n6,n7,f.x),f.y),f.z);
}

float cloudForm(vec3 q){ q.x+=sin(q.y*2.0); q.z+=cos(q.x*2.0)*0.3; float f=-0.15+vnoise(q)+vnoise(q*2.0)*0.5+vnoise(q*4.0)*0.25+vnoise(q*8.0)*0.125+vnoise(q*16.0)*0.05+vnoise(q*32.0)*0.025+vnoise(q*64.0)*0.0125; f=min(pow(abs(f),10.0)*0.5,0.5); return f; }

/* ГРАВИТАЦИОННАЯ ЛИНЗА ПУЛЬСАРОВ B/C: изгибает лучи вокруг массивного тела */
vec3 lensBend(vec3 ro, vec3 rd){
  vec3 center = uLensPos;
  vec3 oc = ro - center;
  float bL = dot(oc, rd);
  vec3 closest = ro - rd*bL;
  float impact = length(closest - center);
  /* Внутренний радиус линзы всегда = радиусу пульсара; внешний = uLensRad.
     Изгиб максимален сразу у края пульсара и спадает к внешнему радиусу. */
  float rIn = R;
  float rOut = max(uLensRad, rIn*1.05);
  float band = clamp((rOut - impact) / (rOut - rIn), 0.0, 1.0);
  float bend = uLensStr * band*band * 2.5;
  bend = clamp(bend, 0.0, 2.5);
  vec3 toC = normalize(center - closest + 1e-4);
  return normalize(rd + toC*bend);
}
/* Доплеровское смещение фонового неба у пульсаров */
vec3 dopplerShift(vec3 c, float impact){
  float zone = uLensRad;
  float tD = clamp(1.0 - impact/zone, 0.0, 1.0);
  float d = mix(0.1, uLensDopp, tD);
  vec3 shift = vec3(0.7, 0.85, 1.2) + d*vec3(0.0, 0.0, 0.25);

/* ==== ЗВЁЗДНЫЙ ШЕЙДЕР (STAR-GL): симплекс-шум + fbm + домен-варп (ST-суффикс).
   Порт из SH-Gl.txt (Nikita Miropolskiy / Inigo Quilez). Рисует маску поверхности
   звёзд Шинрарта-A / SOL / Sirius — кипящая плазма с активными областями. ==== */
vec3 STrandom3(vec3 c){
  float j = 4096.0*sin(dot(c, vec3(17.0, 59.4, 15.0)));
  vec3 rr;
  rr.z = fract(512.0*j); j *= 0.125;
  rr.x = fract(512.0*j); j *= 0.125;
  rr.y = fract(512.0*j);
  return rr - 0.5;
}
const float STF3 = 0.3333333;
const float STG3 = 0.1666667;
float STnoise(vec3 p){
  vec3 s = floor(p + dot(p, vec3(STF3)));
  vec3 x = p - s + dot(s, vec3(STG3));
  vec3 e = step(vec3(0.0), x - x.yzx);
  vec3 i1 = e*(1.0 - e.zxy);
  vec3 i2 = 1.0 - e.zxy*(1.0 - e);
  vec3 x1 = x - i1 + STG3;
  vec3 x2 = x - i2 + 2.0*STG3;
  vec3 x3 = x - 1.0 + 3.0*STG3;
  vec4 w, d;
  w.x = dot(x, x); w.y = dot(x1, x1); w.z = dot(x2, x2); w.w = dot(x3, x3);
  w = max(0.6 - w, 0.0);
  d.x = dot(STrandom3(s), x);
  d.y = dot(STrandom3(s + i1), x1);
  d.z = dot(STrandom3(s + i2), x2);
  d.w = dot(STrandom3(s + 1.0), x3);
  w *= w; w *= w; d *= w;
  return 0.5 + dot(d, vec4(43.0));
}
float STfbm(vec3 x){
  float v = 0.0;
  float a = 0.5;
  vec3 shift = vec3(100.0);
  for(int i = 0; i < 4; ++i){
    if(float(i) >= uSTOct) break;
    v += a*STnoise(x);
    x = x*2.0 + shift;
    a *= 0.5;
  }
  return v;
}
/* домен-варп: q и r — векторы вариаций, используемые ниже в троичном mix цветов */
void STpattern(in vec3 p, out vec3 q, out vec3 r){
  q = vec3(STfbm(p + vec3(1.3, 5.2, 0.0)), STfbm(p + vec3(5.2, 1.3, 0.0)), STfbm(p + vec3(0.0, 0.0, 1.0)));
  r = vec3(STfbm(p + uSTWarp*q + vec3(1.3, 5.2, 0.0)), STfbm(p + uSTWarp*q + vec3(5.2, 1.3, 0.0)), STfbm(p + uSTWarp*q + vec3(0.0, 0.0, 1.0)));

/* ОСВЕЩЁННАЯ ПОВЕРХНОСТЬ ПЛАНЕТЫ: единый источник истины — близкая и дальние

vec3 shadeSurface(int k, vec3 n0, float lit, vec3 rd, vec3 sunDir){
  /* ВРАЩЕНИЕ СФЕРЫ: текущее тело — живая фаза uRotC, лоды — статичная фаза из слота 10 палитры */
  float lodRspd = paln(11.0, 0.0)*32.0; /* град/сим-сек (кодировка /32) */

       Океан + суша (трава/песок/снег) + облака + усиленный диффуз 4.0 + спекуляр. */

    float f = 0.0;
    vec3 q = pos;
    /* океан */
    vec3 col = vec3(0.02,0.10,0.22) * (0.5 + 0.5*vnoise(q*4.0));
    col = col * (0.9 + 0.2*vnoise(q*8.0));
    col = col * (0.9 + 0.2*vnoise(q*16.0));
    col = col * (0.9 + 0.1*vnoise(q*32.0));
    col = col * (0.9 + 0.1*vnoise(q*64.0));
    /* суша: трава/песок/снег через octaves6 */
    q = vec3(0.00,0.80,0.60)*q*2.01; /* орто-вариант матрицы m (упрощённо) */
    float hm = octaves6(q + vec3(137.0)) / 1.5;
    hm *= hm;
    f = hm;
    float landBlend = min(4.0*max(f - 0.3, 0.0), 1.0);
    float nG = exp(-abs(f - 0.4)*20.0);
    float nD = exp(-abs(f - 0.6)*20.0);
    float snowLevel = 0.8 + vnoise(q*64.0)*0.1;
    float nS = exp(-abs(f - snowLevel)*20.0);
    vec3 snow   = vec3(0.85,0.85,0.85)/1.85;
    vec3 desert = vec3(1.5,1.3,1.0)/13.0;
    vec3 grass  = vec3(1.0,1.3,0.5)/12.0;
    float normn = max(nG + nD + nS, 0.0001);
    float grassD  = 1.0 + (vnoise(q*128.0) + vnoise(q*64.0) + vnoise(q*32.0))*0.5;
    float snowD   = 1.0 + (vnoise(q*vec3(5.0,1.0,1.0)*3.0) + vnoise(q*16.0)*0.5 + vnoise(q*64.0)*0.5)*0.25;
    float desertD = 1.0 + vnoise(q*vec3(1.0,7.0,1.0)*3.0) + vnoise(q*32.0)*0.5 + vnoise(q*64.0)*0.5;
    vec3 land = (desertD*desert*nD + grassD*grass*nG + snowD*snow*nS) / normn;
    col = mix(col, land, landBlend);
    float shore = clamp(1.42*pow(1.0 - abs(landBlend - 0.4), 1.0) - 1.2, 0.0, 1.0);
    col = mix(col, col + vec3(0.0,0.1,0.05), shore);

    vec3 q2 = vec3(0.00,0.80,0.60)*q*2.01 + uTime*0.03;

    col *= (0.02 + sunNDL*lightIntensity);

      float tR0 = -dot(p0, rnPl)/dnR;

    }
    col *= mix(0.067, 1.0, rs); /* тень кольца: пол не гаснет до #000, а до ~#111 (17/255) */
    r = col;
    /* сохраняем ночные города/аврору поверх (color-nite от старого рецепта) */
    float cellH = hash13(floor(n*90.0));
    float city  = step(0.80, cellH)*landBlend*(1.0-f);
    vec3 colNight = col*0.03 + vec3(1.0,0.75,0.35)*city*0.9*(0.6+0.4*sin(uTime*2.0+cellH*50.0));
    r = mix(colNight, r, sunNDL);
    float fres = pow(1.0 - clamp(dot(-rd, n0), 0.0, 1.0), 3.0);
    r += vec3(0.25,0.5,1.0)*fres*(0.2 + 0.8*lit)*1.1;
    float aurZ = smoothstep(0.72, 0.92, abs(latAx))*(1.0-lit);
    float aur  = fbm3(n*5.0 + vec3(0.0, uTime*0.2, 0.0));
    r += vec3(0.10,0.90,0.45)*aurZ*smoothstep(0.45,0.75,aur)*0.55;
  } else if(k == 1){
    float lat = latAx;
    float warp = fbm3(n*(2.6*SCL) + vec3(uTime*0.008*SPIN, 0.0, 0.0));
    float bands = sin(lat*16.0 + warp*3.2);
    float bands2 = sin(lat*34.0 + 1.7);
    vec3 band1 = palc(0.0);
    vec3 band2 = palc(1.0);
    vec3 band3 = palc(2.0);
    vec3 surf = mix(band1, band2, smoothstep(-0.6, 0.6, bands));
    surf = mix(surf, band3, 0.5 + 0.5*sin(lat*7.0 + 1.0));
    surf = mix(surf, band2*0.92, 0.25*smoothstep(0.3, 0.9, bands2));
    vec3 sdir = normalize(vec3(cos(uTime*0.02*SPIN + 2.0), -0.30, sin(uTime*0.02*SPIN + 2.0)));
    float angS = acos(clamp(dot(n, sdir), -1.0, 1.0));
    float storm = 1.0 - smoothstep(0.05, 0.16, angS);
    surf = mix(surf, palc(3.0), storm*paln(7.0, 3.0));
    surf *= 0.92 + 0.16*fbm3(n*(9.0*SCL) + vec3(uTime*0.05*SPIN, 0.0, 0.0));
    r = surf*(0.06 + 1.05*lit);
    float fresA = pow(1.0 - clamp(dot(-rd, nG), 0.0, 1.0), 3.0);
    r += palc(4.0)*fresA*(0.2 + 0.8*lit)*0.8;
    float azi = dot(nG, rd);
    float entry = smoothstep(-0.20, 0.05, azi);
    float blurAtm = entry*0.50;
    r = mix(r, palc(5.0)*(0.5 + 0.6*lit), blurAtm);
    float fogT = fbm3(n*6.0 + vec3(uTime*0.02, 0.0, uTime*0.011))-0.5;
    float fogB = smoothstep(-0.10, 0.30, fogT);
    float fogWide = 0.5 + 0.5*sin(lat*20.0 + fogT*7.0 + uTime*0.03);
    float fogAmt = fogB*(0.30 + 0.70*fogWide)*(0.55 + 0.45*entry)*(0.75 + 0.25*lit);
    r = mix(r, palc(6.0), clamp(fogAmt, 0.0, 1.0)*0.55);
  } else if(k == 2){
    float rock = fbm5(n*3.2);
    vec3 surf = mix(palc(0.0), palc(1.0), rock);
    float riv1 = fbm3(n*(3.5*SCL) + vec3(0.0, uTime*0.02*SPIN, uTime*0.013*SPIN));
    float riv2 = fbm3(n*(7.0*SCL) - vec3(uTime*0.015*SPIN, 0.0, 0.0));
    float lava = (1.0 - smoothstep(0.0, 0.02, abs(riv1 - 0.5)))
               + 0.7*(1.0 - smoothstep(0.0, 0.015, abs(riv2 - 0.5)));
    lava = min(lava, 1.0);
    float pulse = 0.75 + 0.25*sin(uTime*1.5*(paln(8.0, 2.0)*8.0) + riv1*40.0);
    r = surf*(0.05 + 0.9*lit) + palc(2.0)*lava*pulse*(1.4 + (1.0 - lit)*2.2);
    float fresP = pow(1.0 - clamp(dot(-rd, nG), 0.0, 1.0), 3.0);
    r += palc(3.0)*fresP*0.25;
  } else if(k == 3) {
    float rock = fbm5(n*3.2);
    vec3 surf = mix(palc(0.0), palc(1.0), rock);
    float riv1 = fbm3(n*(3.5*SCL) + vec3(0.0, uTime*0.02*SPIN, uTime*0.013*SPIN));
    float riv2 = fbm3(n*(7.0*SCL) - vec3(uTime*0.015*SPIN, 0.0, 0.0));
    float lava = (1.0 - smoothstep(0.0, 0.02, abs(riv1 - 0.5)))
               + 0.7*(1.0 - smoothstep(0.0, 0.015, abs(riv2 - 0.5)));
    lava = min(lava, 1.0);
    float pulse = 0.75 + 0.25*sin(uTime*1.5*(paln(8.0, 2.0)*8.0) + riv1*40.0);
    r = surf*(0.05 + 0.9*lit) + palc(2.0)*lava*pulse*(1.6 + (1.0 - lit)*2.6);
    float fresP = pow(1.0 - clamp(dot(-rd, nG), 0.0, 1.0), 3.0);
    r += palc(3.0)*fresP*0.45;
  } else {
    /* ---- STAR-GL: независимая звёздная ветка (kind 4) ----
       Поверхность — домен-варп паттерн (SH-gl): симплекс-шум + fbm + STpattern.
       Координаты: нормаль сферы n (уже вращена) × uSTScale + время (uSTTSpeed).
       Палитра uSTC1..uSTC4 отвечает за базовый цвет/активные области. */
    vec3 STq, STr;
    vec3 STp = n*uSTScale + vec3(0.0, uTime*uSTTSpeed*0.6, uTime*uSTTSpeed);
    STpattern(STp, STq, STr);
    float STn = STfbm(STp + uSTWarp*STr);
    vec3 sgl = mix(mix(mix(palc(0.0), palc(1.0), STr.z), palc(2.0), STq.x), palc(3.0), STn);
    r = sgl*(0.4 + 0.6*lit); /* самосветящаяся: ночная сторона почти не гаснет */
    /* лимб-затемнение по френелю: край диска мягко темнеет (как край настоящей звезды) */
    float fresP = pow(1.0 - clamp(dot(-rd, nG), 0.0, 1.0), 3.0);
    r *= 0.65 + 0.35*smoothstep(0.0, 0.5, 1.0 - fresP);
    r += palc(0.0)*fresP*0.3;
    r += palc(1.0)*fresP*0.5; /* свечение кромки у лимба */
  }
  return r;
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes)/uRes.y;

  /* --- камера: свободный полёт — позиция и базис приходят из JS --- */
  vec3 camPos = uCamPos;
  vec3 fwd    = normalize(uCamF);
  vec3 right  = normalize(uCamR);
  vec3 upv    = normalize(uCamU);
  vec3 rd0    = normalize(fwd + (uv.x*right + uv.y*upv)*FOT);
  vec3 rd     = rd0;
  vec3 up0    = normalize(camPos);
  /* ЛОД-СИНХРОН ШИНРАРТА-A: угловой радиус диска света = угловой радиус сферы;
     издали диск не меньше сферы (не «пропадает»), при подлёте диск дорастает до сферы */
  float dStarSync = max(length(uStarPos - camPos), R*1.05);
  float sunR_eff = max(uSunR, 0.5*R*R/(dStarSync*dStarSync));

  /* ГРАВИТАЦИОННАЯ ЛИНЗА ПУЛЬСАРОВ B/C: сначала проверяем попадание в пульсар
     ПО ИСХОДНОМУ лучу rd0 (неискривлённому), чтобы лучи, идущие прямо в пульсар,
     НЕ изгибались и не выдалбливали дыру (фикс дырки в планете). */
  vec3 sC = (uPlanet > 2.5) ? vec3(0.0, -0.14*uSplash, 0.0) : vec3(0.0);
  vec3 wC0 = camPos - sC;
  float b0 = dot(wC0, rd0);
  float cc0 = dot(wC0, wC0) - R*R;
  float disc0 = b0*b0 - cc0;
  float tHit0 = -b0 - sqrt(max(disc0, 0.0));
  bool hitP  = (uHyper < 0.5) && (disc0 > 0.0) && (tHit0 > 0.0); /* PHANTOM-GATE: в гипере/суперкруизе сфера текущей планеты не существует — её место занимает дальний цикл реестра */

  /* свет — направление от Шинрарта-A (0,0,0) к текущей планете (точка света) */
  vec3 sunDir  = normalize(uStarPos - sC);
  vec3 moonDir = normalize(vec3(cos(uSunA+0.9), 0.25, sin(uSunA+0.9)));

  /* ГРАВИТАЦИОННАЯ ЛИНЗА применяется ТОЛЬКО к лучам, промахнувшимся мимо пульсара:
     искривляем rd (фон искажается кольцом Эйнштейна), пульсар остаётся цельным. */
  float tHit = tHit0;
  if(hitP){
    rd = rd0;
  } else if(uLensActive > 0.5){
    rd = lensBend(camPos, rd0);
  } else {
    rd = rd0;
  }
  /* проекция на выбранный луч — для ореола атмосферы/колец */
  vec3 wC = camPos - sC;
  float b = dot(wC, rd);
  float disc = b*b - dot(wC, wC) + R*R;

  float dayLocal = dot(normalize(camPos), sunDir);
  float dayness  = smoothstep(-0.25, 0.30, dayLocal);

  /* ПУЗЫРЬ АТМОСФЕРЫ: дневное небо живёт только внутри пузыря R=1.90 */
  float camR  = length(camPos);
  float atmIn = 1.0 - smoothstep(1.786, 1.90, camR);

  /* цвет атмосферы по планете: ХИТОМИ голубая, ЧИЗИЯ #905000, НГАЛИН #300090 */
  vec3 atmC = uAtmC;

  vec3 col = vec3(0.0);

  if(hitP){
    /* ---- ПЛАНЕТА (ЛОД 1-в-1: единая функция поверхности) ----
       СФЕРА-ЗАГЛУШКА: под всеми слоями планеты кладём непроницаемый тёмный
       диск (альфа-заглушка), чтобы фон/небо/дальние планеты НЕ просвечивали
       сквозь планету. Поверх него рисуем shadeSurface (текстуру). */
    vec3 p = camPos + rd*tHit;
    vec3 n = normalize(p - sC);
    vec3 Lp = normalize(uStarPos - p);
    float nl  = dot(n, Lp);
    float lit = smoothstep(-0.06, 0.18, nl);
    /* старая SDF-тень удалена: свет от звезды единственный источник, теней планет нет */
    int ki = (uPlanet < 0.5) ? 0 : ((uPlanet < 1.5) ? 1 : ((uPlanet < 2.5) ? 2 : ((uPlanet < 3.5) ? 3 : 4)));
    gRow = uPIcur;
    gCur = 1.0;
    /* заглушка: сфера под слоями планеты — тёмная, но не прозрачная для фона.
       Поверх неё рисуем текстуру; в самых тёмных/лимбовых пикселях планета
       опирается на эту заглушку (max), а не проваливается к фону. */
    vec3 surfR = shadeSurface(ki, n, lit, rd, sunDir);
    float limbf = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 2.5);
    vec3 stub = vec3(0.08, 0.09, 0.14) * (0.35 + 0.65*limbf);
    col = max(surfR, stub);
  } else {
    /* ---- НЕБО ---- */
    /* ГИПЕРПРОСТРАНСТВО = готовое небо планеты ХИТОМИ (без магмы/градиентов),
       солнце заморожено в одной точке (см. uSunA при hypOn), луны выкинуты. */
    float daySky = smoothstep(-0.15, 0.35, dayLocal);

    /* ночь: база + звёзды + млечный путь */
    vec3 night = vec3(0.003,0.005,0.011);
    night += stars(rd)*1.3;
    float bandW = pow(max(1.0 - abs(dot(rd, normalize(vec3(0.35,0.85,0.40)))), 0.0), 5.0);
    night += vec3(0.45,0.5,0.7)*bandW*fbm3(rd*4.0)*0.42;
    night += vec3(0.8,0.75,0.6)*bandW*bandW*0.12; /* тёплая центральная полоса млечного пути */

    /* день: градиент к горизонту, зарево у Шинрарта-A, облака на куполе */
    float horiz = 1.0 - abs(dot(rd, up0));
    vec3 day = mix(atmC*0.83, mix(atmC, vec3(1.0), 0.42), horiz*0.85);
    vec3 starDirN = normalize(uStarPos - camPos);
    float sunAmt = max(dot(rd, starDirN), 0.0);
    day += uSunC*pow(sunAmt, 8.0)*0.50*uSunB;
    day += uSunC*pow(sunAmt, 3.0)*0.18*uSunB; /* тёплый aëreол к горизонту */
    float skycl = fbm5(rd*3.0 + vec3(uTime*0.020, 0.0, uTime*0.013));
    skycl = smoothstep(0.52, 0.78, skycl)*(0.30 + 0.70*horiz);
    day = mix(day, vec3(1.0), skycl*0.75);
    float dSun = dot(rd, starDirN);

    col = mix(night, day, daySky*atmIn);
    if(uPlanet > 2.5){ col = night; } else {
    /* СОЛНЦЕ ВНЕ ПУЗЫРЯ: диск и ореол светят всегда — и внутри пузыря, и в ночи */
    col += uSunC*smoothstep(1.0-sunR_eff, 1.0-sunR_eff*0.4375, dSun)*3.0*uSunB;
    col += uSunC*pow(sunAmt, 350.0)*0.9*uSunB;
    }

    /* СОЛНЦЕ ШИНРАРТА-A: физическое светило-шар (SUN-BODY v3.3).
       Диск raytrace-сферы направлен по uSunDir, грануляция поверхности,
       лимб-затемнение, гало. Направление starDir для освещения остаётся. */
    vec3 starDir = normalize(uStarPos - camPos);
    float dSt = dot(rd, starDir);
    /* диск светила: угловой радиус = uSunR_eff (LOD-синхрон с реальной сферой) */
    float sunDiscA = smoothstep(1.0-sunR_eff, 1.0-sunR_eff*0.5, dSt);
    /* грануляция поверхности (по направлению, скаляр отражённого базиса) */
    vec3 sunDirU = (length(uSunDir) > 0.01) ? normalize(uSunDir) : starDir;
    float gran = vnoise(-starDir*36.0 + vec3(0.0, uTime*0.05, 0.0));
    vec3 sunSurf = uSunC*(1.6 + gran*0.7);
    col += sunSurf*sunDiscA*uSunB;
    /* лимб-затемнение: край диска темнее */
    col += uSunC*pow(sunDiscA, 1.0)*uSunB*0.15*sunR_eff*8.0;
    /* гало вокруг светила */
    float haloA = exp(-pow(max(1.0 - dSt, 0.0), 0.75)/pow(max(2.5*sunR_eff, 0.004), 2.0));
    col += uSunC*uSunB*0.5*haloA;
    /* точечное ядро (прежний ореол сохранён для совместимости) */
    col += uSunC*pow(max(dSt,0.0), 120.0)*0.8*uSunB;

    /* ореол атмосферы у лимба (лучи мимо планеты) */
    float closest = length(camPos - rd*b);
    /* Гасим ореол, когда луч уходит ОТ планеты (b>0 — ближайшая к центру точка
       луча позади камеры): при развороте камеры на 180° не должно быть засветки.
       Атмосфера планеты остаётся при взгляде на неё (b<0). */
    float atmFwd = 1.0 - smoothstep(-0.2, 0.4, b);
    float atmo = (1.0 - smoothstep(1.0, uAtmSize, closest))*atmFwd;
    /* SUN-BODY v3.3: ХОРДОВАЯ атмосфера (camera-independent) — считаем длину
       хорды луча внутри внешней оболочки (радиус uAtmSize) и используем её
       для лимб-свечения. Внутренний ореол не зависит от камеры, не даёт
       «синий шар» (фикс v3.2). */
    float shellR = uAtmSize > 1.01 ? uAtmSize : 1.1;
    float bA = dot(rd, camPos - sC);
    float cA = dot(camPos - sC, camPos - sC) - shellR*shellR;
    float hA = bA*bA - cA;
    float tEnter = 0.0, chordShell = 0.0;
    if(hA > 0.0){
      float e = -bA - sqrt(hA);
      float x2 = -bA + sqrt(hA);
      if(e < 0.0) e = 0.0;
      if(x2 > e){ chordShell = x2 - e; tEnter = e; }
    }
    /* лimb-glow: семплируем вдоль хорды оболочки у поверхности планеты */
    float glowSun = 0.0;
    float diSun = chordShell/8.0;
    if(diSun > 0.0){
      for(int si2 = 0; si2 < 8; si2++){
        vec3 pxSun = camPos + rd*(tEnter + float(si2)*diSun);
        float dSun2 = length(pxSun - sC);
        glowSun += exp(-abs(dSun2 - 1.0)*16.0)*diSun;
      }
    }
    col += atmC*glowSun*uAtmGlow*2.0*0.35*dayness;
    if(uPlanet < 2.5){
      col += atmC*atmo*dayness*atmIn*uAtmGlow;
      /* ЧИЗИЯ: анизотропное размытие входа в атмосферу — внешний ореол шире и мягче,
         по мере входа в толщу атмосферы (atmo 0→1) добавляется туманное свечение до 50% */
      if(uPlanet > 0.5 && uPlanet < 1.5){
        float atmoIn = smoothstep(0.15, 1.0, atmo);
        col = mix(col, vec3(0.88, 0.70, 0.42)*(0.5 + 0.5*dayness), atmoIn*0.5);
      }
    } else { col += CURE(uAtmC, vec3(0.05,0.10,0.24))*atmo; }

    /* луна: диск с кратерами, свечение (в ГИПЕРПРОСТРАНСТВЕ луны выброшены) */
    float dM = dot(rd, moonDir);
    float mdisc = smoothstep(0.99950, 0.99980, dM);
    if(uHyper <= 0.5 && uPlanet < 0.5 && mdisc > 0.0){
      vec3 lp = rd - moonDir*dM;
      float cr = fbm3(lp*260.0);
      vec3 mc = vec3(0.78,0.78,0.74)*(0.55 + 0.45*cr);
      float mlit = smoothstep(-0.15, 0.15, dot(moonDir, sunDir));
      vec3 mc2 = mc*mix(0.10, 1.0, mlit);
      col = mix(col, mc2, mdisc);
      col += vec3(0.60,0.65,0.85)*pow(max(dM,0.0), 900.0)*0.30;
    }
    


  }
  
  /* Доплеровское смещение фонового неба у пульсаров B/C (ветка неба) */
  if(!hitP && uLensActive > 0.5){
    vec3 ocL = camPos - uLensPos;
    float bDL = dot(ocL, rd);
    vec3 cDL   = camPos - rd*bDL;
    float imp = length(cDL - uLensPos);
    col = dopplerShift(col, imp);
  }


  /* ДЖЕТТЫ ШИНРАРТА: струи в стиле Elite Dangerous — длинная светящаяся плазма.
     Для Шинрарта-A (текущая планета) — три пары джетов по осям X, Y, Z; для остальных пульсаров — вдоль Y. */
  if(uHyper <= 0.5 && !hitP && uJetsOn > 0.5){ /* EDIT: джеты пульсаров теперь подчиняются fx.jets.on */
    vec3 jC = (uPlanet > 2.5) ? vec3(0.0, -0.14*uSplash, 0.0) : vec3(0.0);
    /* три оси джетов: для Шинрарта-A (gRow==9) X/Y/Z, иначе только Y */
    vec3 jetAxes[3];
    int nAxes = 1;
    jetAxes[0] = vec3(0.0, 1.0, 0.0);         /* Y — всегда */
    if(gRow > 8.5){ nAxes = 3; jetAxes[1] = vec3(1.0,0.0,0.0); jetAxes[2] = vec3(0.0,0.0,1.0); }
    /* per-планета: наклон оси джетов из fx.jets.tilt (uJetsTilt, рад) */
    mat3 jtM = eulM(uJetsTilt);
    jetAxes[0] = normalize(jtM*jetAxes[0]);
    jetAxes[1] = normalize(jtM*jetAxes[1]);
    jetAxes[2] = normalize(jtM*jetAxes[2]);
    for(int ai = 0; ai < 3; ai++){
      if(ai >= nAxes) break;
      vec3 axis = uAxM*jetAxes[ai]; /* джеты вдоль наклонённой полярной оси */
      vec3 jW = camPos - jC;
      float bJ = dot(rd, axis);
      float dJd = dot(rd, jW);
      float eJ = dot(jW, axis);
      float denJ = 1.0 - bJ*bJ;
      if(abs(denJ) > 0.0001){
        float sJ = (eJ - dJd*bJ)/denJ;
        float tJ = sJ*bJ - dJd;
        if(tJ > 0.0){
          float aJ = abs(sJ);
          /* длинные струи: вдоль оси, колокол у полюса */
          float along = smoothstep(0.86, 1.02, aJ)*(1.0 - smoothstep(1.15, uJetsLen, aJ));
          /* расширение струи с высотой — конус плазмы */
          float wJ = 0.04;
          vec3 cpt = camPos + tJ*rd - jC - axis*sJ;
          float rJ = length(cpt);
          /* турбулентность: закрученные струи */
          float turb = 0.55 + 0.45*sin(aJ*7.0 - uTime*uJetsSp);
          float off = 0.30*(1.0 - exp(-aJ*1.4));
          float prof = exp(-(rJ*rJ)/(wJ*wJ)*0.5);

function resize(){

/* OPT: ПАРАЛЛАКС фона — координата курсора (-1..1) с плавным сглаживанием.
   Используется только для фоновой камеры (стартовая сцена), механики игры не трогает. */
let _parX = 0, _parY = 0;          /* текущая сглаженная позиция */
let _parTX = 0, _parTY = 0;        /* целевая (raw) позиция курсора */
addEventListener('mousemove', function(ev){
  _parTX = (ev.clientX / Math.max(1, innerWidth)) * 2 - 1;
  _parTY = (ev.clientY / Math.max(1, innerHeight)) * 2 - 1;

const PARALLAX_AMOUNT = 0.001;     /* малый сдвиг, чтобы не ломать картинку */

/* главный цикл: RAF сам замирает в фоновой вкладке, dt зажат сверху.

   орбитальное зеркало R46 (пилот выключен / игровой шейдер не собрался). */

  _parY += (_parTY - _parY) * Math.min(1, dt*6);

  if(g && g.active){

    gl.uniform3f(uCP, g.pos[0], g.pos[1], g.pos[2]);
    gl.uniform3f(uCR, g.right[0], g.right[1], g.right[2]);

    let f0x = -Math.sin(camA), f0y = Math.cos(camA);

      }

      for(var f2 = 0; f2 < list.length && f2 < 10; f2++){
        flat[f2*3] = list[f2][0]; flat[f2*3+1] = list[f2][1]; flat[f2*3+2] = list[f2][2];

        pf[f2] = pilist[f2];
      }
      gl.uniform3fv(uP, flat);
      gl.uniform1fv(uPKa, kf);

    if(uP4 && window.PW && window.PW[cur]) gl.uniform3f(uP4, window.PW[cur][0], window.PW[cur][1], window.PW[cur][2]);

  if(uLensPos && uLensStr && uLensRad && uLensDopp && uLensActive && window.PW && !hypOn){

    gl.uniform3f(uLensPos, bestPos[0], bestPos[1], bestPos[2]);
    gl.uniform1f(uLensStr, 1.2);
    gl.uniform1f(uLensRad, 3.0);
    gl.uniform1f(uLensDopp, bestDopp);
    gl.uniform1f(uLensActive, lensOn);

function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }

function relURL(p){
  if(p && typeof p === 'string'){
    if(/^(https?:|file:|data:)/.test(p)) return p;
    try{
      if(window.location && window.location.protocol === 'file:'){
        var base = window.location.pathname.slice(0, window.location.pathname.lastIndexOf('/') + 1);
        return 'file:///' + base.replace(/^\//, '') + p;
      }
    }catch(e){}
  }
  return p;
}

function costTxt(c){
  var parts = [];
  if(c.ck) parts.push(c.ck + '\u{1F9C1}');
  if(c.ch) parts.push(c.ch + '\u{1F9C0}');
  if(c.mn) parts.push(c.mn + '\u{1F31D}');
  return parts.join(' ') || '\u2014';
}
function canPay(c){
  return (c.ck || 0) <= provCk && (c.ch || 0) <= provCh && (c.mn || 0) <= moonStock;
}
function payCost(c){
  if(!canPay(c)) return false;
  provCk -= (c.ck || 0); provCh -= (c.ch || 0); moonStock -= (c.mn || 0);
  segUpdate(); saveScore();
  return true;
}
function hotDeny(i){
  hotDenyT = 0.6;
  if(hotCells[i]) hotCells[i].style.borderColor = '#ff5a4a';
}
function updHotbar(){
  for(var i = 0; i < hotCells.length; i++){
    var cell = hotCells[i], d = HOT_DEFS[i];
    if(!cell || !d) continue;
    var st = cell.querySelector('.hotSt');
    var sel = (i === hotSel);
    cell.style.borderColor = sel ? ((hotDenyT > 0) ? '#ff5a4a' : '#f79e1d') : '#333';
    cell.style.boxShadow = sel ? '0 0 8px rgba(247,158,29,.7),2px 2px 0 #000' : '2px 2px 0 #000';
    if(st){
      if(d.id === 'shield') st.textContent = (immuneT > 0) ? (Math.ceil(immuneT) + 'с') : ('\u00D7' + moonStock);
      else if(d.id === 'magnet') st.textContent = (magnetT > 0) ? (Math.ceil(magnetT) + 'с') : costTxt(d.cost);
      else if(d.id === 'freeze') st.textContent = (freezeT > 0) ? (Math.ceil(freezeT) + 'с') : costTxt(d.cost);
      else if(d.id === 'flash') st.textContent = (pepBanT > 0) ? (Math.ceil(pepBanT) + 'с') : costTxt(d.cost);
      else st.textContent = costTxt(d.cost);
    }
    var busy = (d.id === 'magnet' && magnetT > 0) || (d.id === 'freeze' && freezeT > 0) || (d.id === 'flash' && pepBanT > 0);
    var can = d.id === 'exch' || busy || (d.id === 'shield' ? moonStock > 0 : canPay(d.cost));
    cell.style.opacity = (sel || can) ? '1' : '0.55';
  }
}
function useHot(i){
  if(!gameOn || gameOver) return;
  var d = HOT_DEFS[i];
  if(!d) return;
  if(inTransit && (d.id === 'volley' || d.id === 'homing' || d.id === 'flash')){
    hotDeny(i); return; /* фантом-фикс: выстрелы не летают в гиперпространстве */
  }
  if(d.id === 'shield'){
    if(immuneT > 0) return;
    if(moonStock < 1){ hotDeny(i); return; }
    useImmunity();
    return;
  }
  if(d.id === 'magnet'){
    if(magnetT > 0) return;
    if(!payCost(d.cost)){ hotDeny(i); return; }
    magnetT = MAG_T;
    playMagnet();
    return;
  }
  if(d.id === 'volley'){
    if(!payCost(d.cost)){ hotDeny(i); return; }
    fireVolley();
    return;
  }
  if(d.id === 'homing'){
    if(!payCost(d.cost)){ hotDeny(i); return; }
    fireHoming();
    return;
  }
  if(d.id === 'flash'){
    if(pepBanT > 0) return;
    if(!payCost(d.cost)){ hotDeny(i); return; }
    doFlash();
    return;
  }
  if(d.id === 'freeze'){
    if(freezeT > 0) return;
    if(!payCost(d.cost)){ hotDeny(i); return; }
    freezeT = CFG.FREEZE_T;
    playMagnet();
    return;
  }
  if(d.id === 'exch') doExchange();
}

function doExchange(){

function fireVolley(){
  var base = Math.atan2(shotAimY - shotY, shotAimX - shotX) || 0;
  for(var i = 0; i < 10; i++) spawnShot('ch', base + (-0.55 + 1.1*i/9), 980, 1.4);

function fireHoming(){
  for(var i = 0; i < 5; i++) spawnShot('ck', -Math.PI/2 + (srand()-0.5)*0.8, 820, 3.0);
  playPickup('cake');
}
function tickShots(dt){
  if(inTransit){
    for(var si = shots.length - 1; si >= 0; si--){
      var sh0 = shots[si];
      if(sh0.el && sh0.el.parentNode) sh0.el.parentNode.removeChild(sh0.el);
    }
    shots.length = 0;
    return;
  }
  for(var i = shots.length - 1; i >= 0; i--){
    var sh = shots[i];
    if(sh.type === 'ck'){
      var best = null, bd = 1e18;
      for(var k = 0; k < ITEMS.length; k++){
        var it = ITEMS[k];
        if(!it || it.kind !== 'pepper' || it.dead || it.planet !== planet || it._sx == null) continue;
        var dx = it._sx - sh.x, dy = it._sy - sh.y, dd = dx*dx + dy*dy;
        if(dd < bd){ bd = dd; best = Math.atan2(dy, dx); }
      }
      if(best != null){
        var diff = best - sh.a;
        while(diff > Math.PI) diff -= 2*Math.PI;
        while(diff < -Math.PI) diff += 2*Math.PI;
        sh.a += Math.max(-6*dt, Math.min(6*dt, diff));
      }
    }
    sh.x += Math.cos(sh.a)*sh.v*dt;
    sh.y += Math.sin(sh.a)*sh.v*dt;
    sh.life -= dt;
    var dead = sh.life <= 0 || sh.x < -60 || sh.x > innerWidth + 60 || sh.y < -60 || sh.y > innerHeight + 60;
    if(!dead){
      for(var k2 = 0; k2 < ITEMS.length && sh.hits > 0; k2++){
        var it2 = ITEMS[k2];
        if(!it2 || it2.kind !== 'pepper' || it2.dead || it2.planet !== planet || it2._sx == null) continue;
        var dx2 = it2._sx - sh.x, dy2 = it2._sy - sh.y;
        if(dx2*dx2 + dy2*dy2 < 48*48){
          sh.hits--;
          killPepper(it2);
          if(sh.type === 'ck') dead = true;
        }
      }
    }
    if(dead){
      if(sh.el && sh.el.parentNode) sh.el.parentNode.removeChild(sh.el);
      shots.splice(i, 1);
    } else {
      sh.el.style.transform = 'translate(' + sh.x.toFixed(1) + 'px,' + sh.y.toFixed(1) + 'px)';
    }
  }
}

var ITEMS = [];
function rndDir(){
  var a = srand()*Math.PI*2, z = srand()*1.6 - 0.8;
  var r = Math.sqrt(Math.max(0, 1 - z*z));
  return [r*Math.cos(a), z, r*Math.sin(a)];
}
function spawnOrbit(kind, glyph, rmin, rmax, sz, wbase, pi){
  var dir = rndDir();
  var r = rmin + srand()*(rmax - rmin);
  var ax = cross(dir, rndDir());
  if(len(ax) < 0.05) ax = [0,1,0];
  ITEMS.push({ el: makeSprite(glyph), kind: kind, p0: mul(dir, r),
    axis: norm(ax), w: wbase + srand()*0.10, planet: pi, angle: 0, sz: sz });
}

/* ---------- ПРОЕКЦИЯ И ПЕРЕКРЫТИЯ ---------- */
var RING_N = norm([0.22, 1.0, 0.18]);
var RING_IN = 1.45, RING_OUT = 2.35, GAP_IN = 1.76, GAP_OUT = 1.86;
function ringOccl(camPos, dir, dist){
  var denom = dot(dir, RING_N);
  if(Math.abs(denom) < 1e-4) return false;
  var t = -dot(camPos, RING_N)/denom;
  if(t <= 0 || t >= dist) return false;
  var q = add(camPos, mul(dir, t));
  var r = len(q);
  return (r > RING_IN && r < RING_OUT && !(r > GAP_IN && r < GAP_OUT));
}
function project(p, cam, W, H){
  var v = sub(p, cam.pos);
  var dist = len(v);
  var z = dot(v, cam.fwd);
  /* OPT: плавнее порог — меньше «прилипания»/рывков спрайтов у камеры */
  if(z < 0.01) return null;
  var dir = mul(v, 1/(dist||1));
  var tC = -dot(cam.pos, dir) - OCCL_Y*dir[1];
  if(tC > 0 && tC < dist){
    var q = add(cam.pos, mul(dir, tC));
    if(dot(q,q) + OCCL_Y*(2.0*q[1] + OCCL_Y) < 1.0){
      var ox = dot(v, cam.right)/(z*CFG.FOV_TAN);
      var oy = dot(v, cam.up)/(z*CFG.FOV_TAN);
      var osx = (ox*H + W)/2;
      var osy = (H - oy*H)/2;
      return { occl: true, x: osx, y: osy, z: z };
    }
  }
  var ux = dot(v, cam.right)/(z*CFG.FOV_TAN);
  var uy = dot(v, cam.up)/(z*CFG.FOV_TAN);
  var sx = (ux*H + W)/2;
  var sy = (H - uy*H)/2;
  if(sx < -90 || sx > W + 90 || sy < -90 || sy > H + 90) return null;
  return { x: sx, y: sy, z: z };
}
function sunDirNow(simT){
  /* СВЕТ ОТ МОДЕЛИ ЗВЕЗДЫ, а не от орбитальной псевдо-формулы.
     Направление: от позиции звезды (последнее тело в PW) к текущей планете.
     Если хелперы/PW недоступны — старый орбитальный фолбэк. */
  try{
    if(window.PW && PW && PW.length > 0){
      var star = PW[PW.length-1];
      var cur = (typeof planet !== 'undefined') ? planet : 0;
      var ref = (PW[cur]) ? PW[cur] : [0,0,0];
      var d = sub(star, ref);
      return norm(d);
    }
  }catch(e){}
  var sa = 2*Math.PI*simT/3600.0;
  return norm([Math.cos(sa), 0.22*Math.sin(sa), Math.sin(sa)]);
}

  f.style.cssText = 'position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;'
    + 'border:3px solid ' + col + ';border-radius:50%;pointer-events:none;z-index:6000;'
    + 'transform:translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(0.3);'
    + 'transition:transform .5s ease-out, opacity .5s ease-out;';
  layer.appendChild(f);
  requestAnimationFrame(function(){
    f.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(2.6)';
    f.style.opacity = '0';
  });
  setTimeout(function(){ if(f.parentNode) f.remove(); }, 550);
}
function respawn(it){
  if(it.kind === 'moon'){
    it.p0 = mul(rndDir(), (it.mi < 4 ? CFG.MOON_R[it.mi] : (1.85 + 1.12*it.mi/7)));
    it.angle = 0;
    return;
  }
  var zone = (it.kind === 'pepper' || (it.sz || 0) > 0.09);
  var rmin = zone ? CFG.OUT_RMIN : CFG.PICK_RMIN;
  var rmax = zone ? CFG.OUT_RMAX : CFG.PICK_RMAX;
  var d, guard = 0;
  do{ d = rndDir(); guard++; } while(dot(d, F.fwd) > -0.25 && guard < 40);
  var r = rmin + srand()*(rmax - rmin);
  it.p0 = mul(d, r);
  var ax = cross(d, rndDir());
  it.axis = len(ax) < 0.05 ? [0,1,0] : norm(ax);
  it.w = (it.kind === 'pepper' ? 0.45 : 0.05) + srand()*0.10;
  it.angle = 0;
}
function collect(it, pr){
  var big = (it.sz || 0.052) > 0.09;
  var mult = big ? 2 : 1;
  if(it.kind === 'pepper'){
    if(pepperCd > 0) return;
    if(freezeT > 0 || pepBanT > 0) return;
    pepperCd = CFG.PEPPER_CD;
    provCk = Math.max(0, provCk - CFG.PEPPER_CK);
    provCh = Math.max(0, provCh - CFG.PEPPER_CH);
    boostFuel = Math.max(0, boostFuel - CFG.BOOST_PEPPER);
    pepperInv++;
    hurt(1, pr);
    playPepper();
    if(addPickToast) addPickToast('pepper');
    segUpdate();
    saveScore();
    invUpdateCounts();
    if(hpCur <= 0) doGameOver();
    respawn(it);
    return;
  }
  if(it.kind === 'heart'){
    hpCur = Math.min(hpMax, hpCur + 1);
    playHeart();
    flash(pr.x, pr.y, 'heart');
    if(addPickToast) addPickToast('heart');
    updBottomPanel();
    saveScore();
    respawn(it);
    return;
  }
  if(it.kind === 'disk1' || it.kind === 'disk2'){
    var _dis = diskById(it.kind);
    if(_dis){ if(_dis.have >= 1) return; _dis.have = 1; }
    it._dead = true;
    if(it.el && it.el.parentNode) it.el.parentNode.removeChild(it.el);
    playPickup('moon');
    if(addPickToast) addPickToast(_dis ? _dis.id : 'disk');
    invUpdateCounts();
    saveScore();
    return;
  }
  score[it.kind]++;
  totalCollected++;
  maybeSpawnDisk();
  if(it.kind === 'cake'){
    provCk += mult;
    pts += mult*CFG.PTS_CAKE;
    boostFuel = Math.min(100, boostFuel + CFG.BOOST_CK*mult);
    if(!expMax) expTotal += CFG.EXP_CAKE*mult;
  } else if(it.kind === 'cheese'){
    provCh += mult;
    pts += mult*CFG.PTS_CHEESE;
    boostFuel = Math.min(100, boostFuel + CFG.BOOST_CH*mult);
    if(!expMax) expTotal += CFG.EXP_CHEESE*mult;
  } else {
    pts += CFG.PTS_MOON;
    moonTot++;
    if(moonStock < moonCap) moonStock++;
    boostFuel = Math.min(100, boostFuel + CFG.BOOST_MOON);
    if(!expMax) expTotal += CFG.EXP_MOON;
  }
  applyMilestones();
  saveScore();
  if(!expMax && !winShown && expTotal >= CFG.EXP_WIN) doWin();
  playPickup(it.kind);
  flash(pr.x, pr.y, it.kind);
  if(addPickToast) addPickToast(it.kind);
  segBump(it.kind);
  if(bearWrap){
    var jb = bearWrap.querySelector('.bear');
    if(jb){
      jb.classList.remove('jumping');
      void jb.offsetWidth;
      jb.classList.add('jumping');
      clearTimeout(collect._jt);
      collect._jt = setTimeout(function(){ jb.classList.remove('jumping'); }, 700);
    }
  }
  respawn(it);
}

/* ---------- ФИЗИКА ПОЛЁТА ---------- */
function physics(dt){
  var P = inTransit ? FT : F;
  var ty = 0, tp = 0, tr = 0;
  if(keys.KeyD) ty += 1;
  if(keys.KeyA) ty -= 1;
  if(keys.ArrowUp) tp += 1;
  if(keys.ArrowDown) tp -= 1;
  if(keys.KeyE) tr += 1;
  if(keys.KeyQ) tr -= 1;
  var k = Math.min(1, dt*CFG.RESP);
  yawV   += (ty*CFG.YAW_MAX   - yawV)*k;
  if(!drag) pitchV += (tp*CFG.PITCH_MAX - pitchV)*k;
  rollV  += (tr*CFG.ROLL_MAX  - rollV)*k;
  if(keys.KeyW) speed += CFG.SPD_RATE*boostMul*dt;
  if(keys.KeyS) speed -= CFG.SPD_RATE*dt;
  var dn = -1, dd = 1e9;
  if(inTransit){
    for(var ki = 0; ki < PW.length; ki++){
      var dk = len(sub(FT.pos, PW[ki]));
      if(dk < dd){ dd = dk; dn = ki; }
    }
    var ceil = CFG.SPD_MAX*(1 + Math.max(0, dd - 2)*FSD_SC_GAIN);
    ceil = Math.min(ceil, CFG.SPD_MAX*FSD_SC_CAP)*boostMul;
    speed = Math.max(CFG.SPD_MIN, Math.min(ceil, speed));
    /* ГИПЕРПРОСТРАНСТВО = свободный 3D-полёт во все стороны, как вокруг планеты,
       только в мировых координатах: без принудительного коридора/перегона.
       FT.pos двигается по направлению взгляда (ниже: P.pos += P.fwd*speed*dt). */
  } else {
    speed = Math.max(CFG.SPD_MIN, Math.min(CFG.SPD_MAX*boostMul, speed));
  }
  if(Math.abs(rollV) > 1e-6){
    P.right = rotAxis(P.right, P.fwd, rollV*dt);
    P.up    = rotAxis(P.up,    P.fwd, rollV*dt);
  }
  if(Math.abs(pitchV) > 1e-6){
    P.fwd = rotAxis(P.fwd, P.right, pitchV*dt);
    P.up  = rotAxis(P.up,  P.right, pitchV*dt);
  }
  if(Math.abs(yawV) > 1e-6){
    P.fwd   = rotAxis(P.fwd,   P.up, yawV*dt);
    P.right = rotAxis(P.right, P.up, yawV*dt);
  }
  P.fwd = norm(P.fwd);
  P.right = norm(sub(P.right, mul(P.fwd, dot(P.right, P.fwd))));
  P.up = cross(P.right, P.fwd);
  var finChk = P.fwd[0]+P.fwd[1]+P.fwd[2]+P.right[0]+P.right[1]+P.right[2]+P.up[0]+P.up[1]+P.up[2]+P.pos[0]+P.pos[1]+P.pos[2];
  if(!isFinite(finChk)){
    if(inTransit){ FT.pos = PW[planet].slice(); FT.fwd = [0,0,1]; FT.up = [0,1,0]; FT.right = [1,0,0]; }
    else resetBasis();
  }
  P.pos = add(P.pos, mul(P.fwd, speed*dt));
  if(inTransit){
    /* ТВЁРДЫЕ ШАРЫ ВЕЗДЕ: в гиперпространстве нельзя пролететь сквозь планеты/звезду.
       Для каждого тела — сфера столкновения радиуса HYP_R (рендер R=1 + запас корабля).
       Корабль выталкивается на границу сферы, нормальная скорость гасится (скольжение). */
    for(var hy = 0; hy < PW.length; hy++){
      var hvv = sub(FT.pos, PW[hy]);
      var hd = len(hvv);
      if(hd < HYP_R){
        var hn = (hd > 1e-6) ? mul(hvv, 1/hd) : [1,0,0];
        FT.pos = add(PW[hy], mul(hn, HYP_R));
        var hdot = dot(P.fwd, hn);
        if(hdot < 0){ /* разворачиваем взгляд по касательной, не отталкиваем назад */
          P.fwd = norm(sub(P.fwd, mul(hn, hdot)));
          P.right = norm(sub(P.right, mul(P.fwd, dot(P.right, P.fwd))));
          P.up = cross(P.right, P.fwd);
        }
      }
    }
  }
  if(inTransit){
    /* стыковка с любой планетой: дальняя граница гиперпространства */
    /* стыковка на достаточном зазоре от тела: зона входа = 10 (была 10 — возвращаем), с заметным зазором между телом и зоной вхождения */
    if(dn >= 0 && dd < 10.0){
      planet = dn;
      inTransit = false;
      F.pos = sub(FT.pos, PW[dn]);
      var rr0 = len(F.pos);
      if(rr0 < CFG.MINR) F.pos = mul(F.pos, CFG.MINR/(rr0||1));
      F.fwd = P.fwd; F.right = P.right; F.up = P.up;
      speed = Math.min(speed, CFG.SPD_MAX*boostMul);
      targetIdx = -1;
      toastFx('СТЫКОВКА: ' + PLANET_NAMES[dn]);
      setSpaceMode();
    }
  } else {
    var r = len(F.pos);
    if(r < CFG.MINR){
      var nrm = mul(F.pos, 1/(r||1));
      F.pos = mul(nrm, CFG.MINR);
      var inw = dot(F.fwd, nrm);
      if(inw < 0) F.fwd = norm(sub(F.fwd, mul(nrm, inw)));
    }
    /* выход из зоны планеты — суперкруиз */
    if(r > FSD_SOI){
      FT = { pos: add(PW[planet], F.pos), fwd: F.fwd, up: F.up, right: F.right };
      inTransit = true;
      setSpaceMode();
      toastFx('ГИПЕРПРОСТРАНСТВО: ПЛАНЕТЫ ВИДНЫ НА НЕБЕ', '#7dff8a');
    }
  }
}

/* ---------- ОТРИСОВКА СПРАЙТОВ ---------- */
function drawSprites(cam, W, H, bgSim, dt){
  var sun = sunDirNow(bgSim), i, it, pr, p;
  var bearWp = add(cam.pos, mul(cam.fwd, BEAR_D));
  for(i = 0; i < ITEMS.length; i++){
    it = ITEMS[i];
    if(it.planet !== planet || inTransit){ it.el.style.display = 'none'; continue; }
    if(it.dead){ it.el.style.display = 'none'; continue; }
    if(freezeT <= 0) it.angle += it.w*dt;
    p = rotAxis(it.p0, it.axis, it.angle);
    if(magnetT > 0 && gameOn && (it.kind === 'cake' || it.kind === 'cheese')){
      var mr = MAG_R * (((it.sz || 0.052) > 0.09) ? 1.6 : 1);
      var dv = sub(p, bearWp), dl3 = len(dv);
      if(dl3 < mr && dl3 > 0.001){
        var kp = Math.min(1, (1 - dl3/mr) * 3.0 + 0.4);
        var np2 = sub(p, mul(dv, kp*dt*4));
        it.p0 = rotAxis(np2, it.axis, -it.angle);
        p = np2;
      }
    }
    
    pr = project(p, cam, W, H);
    if(!pr || pr.occl){ it.el.style.display = 'none'; continue; }
    if(PLANETS_DB.planets[planet].rings){
      var v2 = sub(p, cam.pos), d2 = len(v2);
      if(ringOccl(cam.pos, mul(v2, 1/(d2||1)), d2)){ it.el.style.display = 'none'; continue; }
    }
    var size = Math.max(14, Math.min(H*1.2, ((it.sz || 0.052)/pr.z)*H));
    /* OPT: плавный фейд по дальности — убирает рывки «прилипания» спрайта к камере */
    var op = Math.min(1, Math.max(0.0, (Math.min(pr.z, 3.0) - 0.03)/0.10));
    var dl = dot(norm(p), sun);
    it.el.style.display = 'block';
    it.el.style.transform = 'translate(' + pr.x.toFixed(1) + 'px,' + pr.y.toFixed(1) + 'px) translate(-50%,-50%)';
    it.el.style.fontSize = size.toFixed(1) + 'px';
    it.el.style.opacity = op.toFixed(2);
    it.el.style.filter = 'brightness(' + (0.45 + 0.55*Math.max(0, dl)).toFixed(2) + ')';
    it.el.style.zIndex = String(5000 - Math.round(pr.z*100));
    if(it.kind === 'pepper'){ it._sx = pr.x; it._sy = pr.y; }
    if(gameOn && !(it.kind === 'pepper' && (immuneT > 0 || freezeT > 0 || pepBanT > 0)) && len(sub(p, bearWp)) < CFG.PICK_RAD*(it.kind === 'moon' ? 1.5 : ((it.sz || 0.052) > 0.09 ? 2 : 1))) collect(it, pr);
  }
  if(bearWrap && gameOn && !paused){
    var bpr = project(bearWp, cam, W, H);
    if(bpr && !bpr.occl){
      var bv = sub(bearWp, cam.pos), bd = len(bv);
      var bo = (PLANETS_DB.planets[planet].rings) ? ringOccl(cam.pos, mul(bv, 1/(bd||1)), bd) : false;
      if(!bo){
        var bdl = dot(norm(bearWp), sun);
        var bsize = Math.max(28, Math.min(H*0.9, (BEAR_SZ/bpr.z)*H));
        var bank = Math.max(-28, Math.min(28, rollV/(CFG.ROLL_MAX||1)*28));
        bearWrap.style.display = 'block';
        bearWrap.style.transform = 'translate(' + bpr.x.toFixed(1) + 'px,' + bpr.y.toFixed(1) + 'px) translate(-50%,-50%) rotate(' + bank.toFixed(1) + 'deg)';
        bearWrap.style.width = bsize.toFixed(1) + 'px';
        bearWrap.style.height = bsize.toFixed(1) + 'px';
        bearWrap.style.opacity = Math.min(1, Math.max(0.15, (Math.min(bpr.z, 3.0) - 0.10)/0.10)).toFixed(2);
        bearWrap.style.filter = 'brightness(' + (0.45 + 0.55*Math.max(0, bdl)).toFixed(2) + ')';
        bearWrap.style.zIndex = String(5000 - Math.round(bpr.z*100));
        ensureAura();
        if(auraEl) auraEl.style.display = (magnetT > 0) ? 'block' : 'none';
        shotX = bpr.x; shotY = bpr.y;
        var aimW = add(cam.pos, mul(F.fwd, 5.0));
        var apr = project(aimW, cam, W, H);
        if(apr && !apr.occl){ shotAimX = apr.x; shotAimY = apr.y; }
      } else bearWrap.style.display = 'none';
    } else bearWrap.style.display = 'none';
  } else if(bearWrap) bearWrap.style.display = 'none';
}

/* ---------- HUD И ПЕРЕКЛЮЧЕНИЕ ПЛАНЕТ ---------- */
function updHud(){
  var unlocked = PLANET_NAMES[0];
  for(var ui = 1; ui < PLANET_NAMES.length; ui++) if(expTotal >= expNeed(ui)) unlocked += ', ' + PLANET_NAMES[ui];
  var txt = 'ПЛАНЕТА: ' + PLANET_NAMES[planet] + (planet === FIN ? ' ★ ФИНАЛ' : '')
    + '\nОТКРЫТО: ' + unlocked
    + (mouseCtl ? '\nМЫШЬ: ВКЛ (P — вернуть курсор)' : '');
  txt += '\nD-ДАТА: ' + shinrartaDDate();
  var _app = shinrartaApproach();
  if(_app !== null) txt += '\nПРИШЕСТВИЕ: через ' + (_app/364).toFixed(1) + ' D-лет';
  /* OPT: кэш текста — не пишем в DOM, если значение не изменилось */
  if(inTransit) txt += '\nРЕЖИМ: ГИПЕРПРОСТРАНСТВО';
  if(targetIdx >= 0){
    var dtgt = inTransit ? len(sub(FT.pos, PW[targetIdx])) : len(sub(PW[targetIdx], PW[planet]));
    txt += '\nЦЕЛЬ: ' + PLANET_NAMES[targetIdx] + ' — ' + dtgt.toFixed(1) + ' а.е. — '
      + (unlockedIdx(targetIdx) ? 'G: ПРЫЖОК' : '\u{1F512} НУЖНО ' + expNeed(targetIdx) + ' EXP');
  }
  if(hudTxtEl){
    if(hudTxtEl.__last !== txt){ hudTxtEl.textContent = txt; hudTxtEl.__last = txt; }
  } else if(hud._last !== txt){ hud.textContent = txt; hud._last = txt; }
  var pct = Math.round(speed/CFG.SPD_MAX*100);
  if(hudThrSegEl) segSetN(hudThrSegEl, Math.max(0, Math.min(250, pct)), 3);
}

function trackFor(p){
  var e = (window.PLANETS_DB && PLANETS_DB.planets && PLANETS_DB.planets[p]) || null;
  if(e && e.track) return e.track;
  return (pKind(p) === 3) ? 'Star-1.ogg' : 'Music-' + (p % 3 + 1) + '.ogg';
}

/* ОБЛИК + АТМОСФЕРА: аудио-петля планеты из audio.loop (запускается рядом с музыкой) */
function applyAmbLoop(){
  try{
    var e = (window.PLANETS_DB && PLANETS_DB.planets && PLANETS_DB.planets[planet]) || null;
    var loopName = (e && e.audio && e.audio.loop) ? e.audio.loop : '';
    var vol = (e && e.audio && e.audio.vol != null) ? +e.audio.vol : 0.35;
    if(!loopName){
      if(sfx.ambLoop){ try{ sfx.ambLoop.pause(); sfx.ambLoop = null; }catch(_x){} }
      return;
    }
    if(!sfx.ambLoop) sfx.ambLoop = new Audio();
    sfx.ambLoop.loop = true;
    sfx.ambLoop.volume = Math.max(0, Math.min(1, vol));
    if(sfx.ambLoop.src !== window.location.href && sfx.ambLoop.getAttribute('data-src') !== loopName){
      sfx.ambLoop.setAttribute('data-src', loopName);
      sfx.ambLoop.src = relURL(loopName);
    }
    if(sfx.musicOn){ var p2 = sfx.ambLoop.play(); if(p2 && p2.catch) p2.catch(function(){}); }
  }catch(_) {}
}

function switchPlanet(dir){
  if(switching) return;
  var target = -1;
  if(dir > 0){
    if(planet >= FIN) return;
    var need = expNeed(planet + 1);
    if(expTotal < need){
      if(expFillEl){
        expFillEl.style.background = '#ff5a4a';
        setTimeout(function(){ if(expFillEl) expFillEl.style.background = 'linear-gradient(90deg,#0b4d1f,#7dff8a,#d6ffb0)'; }, 300);
      }
      return;
    }
    target = planet + 1;
  } else {
    if(planet === 0){
      /* назад с ХИТОМИ — только к уже открытой звезде: раньше времени не переключит */
      if(expTotal < expNeed(FIN)) return;
      target = FIN;
    } else {
      target = planet - 1;
    }
  }
  switching = true;
  magnetT = 0; freezeT = 0;
  for(var swi = shots.length - 1; swi >= 0; swi--){ if(shots[swi].el && shots[swi].el.parentNode) shots[swi].el.parentNode.removeChild(shots[swi].el); }
  shots.length = 0;
  fadeEl.style.opacity = '1';
  setTimeout(function(){
    planet = target;
    if(sfx.music && sfx.started){
      try{ sfx.music.pause(); sfx.music.src = trackFor(planet); }catch(e){}
    }
    updHud();
    fadeEl.style.opacity = '0';
    if(sfx.musicOn) tryMusic();
    setTimeout(function(){ switching = false; }, 300);
  }, 300);
}

/* ---------- ПАУЗА: панель Управление / Механики / Правила ---------- */
function setPaused(v){
  if(paused === v) return;
  paused = v;
  if(v && document.pointerLockElement) document.exitPointerLock();
  if(pauseEl) pauseEl.style.display = v ? 'flex' : 'none';
  if(sfx.music){
    if(v) sfx.music.pause();
    else if(sfx.musicOn && sfx.started) tryMusic();
  }
  if(fsdAudio && warp){
    if(v){ try{ fsdAudio.pause(); }catch(e){} }
    else if(sfx.musicOn){ try{ var wp = fsdAudio.play(); if(wp && wp.catch) wp.catch(function(){}); }catch(e){} }
  }
}
function initPausePanel(){

  pauseEl.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:92;display:none;flex-direction:column;align-items:center;gap:9px;background:#0c150c;border:6px outset #950;border-radius:10px;padding:18px 26px;box-shadow:0 20px 40px rgba(0,0,0,.7);max-width:min(600px,92vw);max-height:86vh;overflow:auto;';
  pauseEl.innerHTML =

/* ===== ГЛОБАЛЬНЫЙ ТАЙМЕР: СИНХРОНИЗАЦИЯ ПО ДАТЕ КОМПЬЮТЕРА =====
   Эпо́ха (константа ниже) — момент, когда планеты стоят в позициях реестра.
   t = (сейчас − эпо́ха) в D-сутках. Режим 1:1: 1 реальный день = 1 D-сутка.
   Орбиты круговые: радиус и наклонение берутся из pos реестра, период — Кеплер:

   Пересчёт векторов — раз в ORBIT_SYNC_MS (минута), между обновлениями позиции стоят. */
var SHINRARTA_EPOCH = new Date('2026-01-01T00:00:00Z');
var ORBIT_SYNC_MS = 60000;
function shinrartaDays(){
  if(!SHINRARTA_EPOCH || !SHINRARTA_EPOCH.getTime()) return 0;
  return (Date.now() - SHINRARTA_EPOCH.getTime())/86400000;
}
function shinrartaDDate(){
  var d = Math.max(0, Math.floor(shinrartaDays()));
  return 'D' + Math.floor(d/364) + ' · мес ' + (Math.floor((d%364)/28)+1) + ' · день ' + ((d%28)+1);
}
function shinrartaApproach(){
  /* D-суток до ближайшего пришествия (соединение Шинрарта-С ↔ Диовкрад) */
  var f = -1, s = -1;
  for(var i=0;i<PLANETS_DB.planets.length;i++){
    if(PLANETS_DB.planets[i].name === 'Шинрарта-С') f = i;
    if(PLANETS_DB.planets[i].name === 'Диовкрад') s = i;
  }
  if(f < 0 || s < 0) return null;
  var pf = PLANETS_DB.planets[f], ps = PLANETS_DB.planets[s];
  if(!pf.orbP || !ps.orbP) return null;
  var phiF = Math.atan2(pf.pos[2], pf.pos[0]), phiS = Math.atan2(ps.pos[2], ps.pos[0]);
  var om = 2*Math.PI*(1/pf.orbP - 1/ps.orbP); /* рад/D-сутку: внутренняя догоняет */
  if(om <= 0) return null;
  var d = ((phiF - phiS) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
  return (d > 1e-9) ? (2*Math.PI - d)/om : 0;
}
function orbitalInit(){
  for(var i=0;i<PLANETS_DB.planets.length;i++){
    var e = PLANETS_DB.planets[i];
    var x=e.pos[0], y=e.pos[1], z=e.pos[2];
    var r = Math.sqrt(x*x+y*y+z*z);
    if(r < 0.001){ e.orbR=0; e.orbP=0; e.orbRW=null; continue; } /* Шинрарта-A — якорь */
    var hl = Math.sqrt(x*x+z*z);
    e.orbR = r;
    e.orbP = 27.2*Math.pow(r/19.5, 1.5);                /* период, D-суток */
    e.orbRW = (hl>1e-9) ? [-z*r/hl, 0, x*r/hl] : null;  /* поперечник r·w (CCW) */
  }
}
function orbitalApply(){
  var arrs = [];
  if(typeof PW !== 'undefined' && PW && PW.length) arrs.push(PW);
  if(window.PW && arrs.indexOf(window.PW) < 0) arrs.push(window.PW);
  var days = shinrartaDays();
  for(var a=0;a<arrs.length;a++){
    var A = arrs[a];
    for(var i=0;i<A.length && i<PLANETS_DB.planets.length;i++){
      var e = PLANETS_DB.planets[i];
      if(!e.orbRW) continue;
      var dA = 2*Math.PI*days/e.orbP, c = Math.cos(dA), s = Math.sin(dA), p = e.pos, w = e.orbRW;
      A[i][0] = p[0]*c + w[0]*s;
      A[i][1] = p[1]*c;
      A[i][2] = p[2]*c + w[2]*s;
    }
  }
}
orbitalInit();

/* ---------- НЕБО ГИПЕРПРОСТРАНСТВА: 3D-скайбокс — звёзды в мировых направлениях,
   вращаются со взглядом (крен/тангаж/рысканье/мышь), как ночное небо у планет ---------- */
var hypCv = null, hypCtx = null, hypStars = null, hypBand = null, hypConst = null,
    hypNeb = null, hypT = 0, hypOnLast = false;
function initHypSky(){
  if(hypCv) return;
  hypCv = document.createElement('canvas');
  hypCv.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;display:none;';
  hypCv.setAttribute('data-keep','1');
  var gb = document.getElementById('glbg');
  if(gb && gb.parentNode) gb.parentNode.insertBefore(hypCv, gb.nextSibling);
  else document.body.appendChild(hypCv);
  hypCtx = hypCv.getContext('2d');
}
function hypRand(a){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function hypGenStars(){
  hypStars = []; hypBand = [];
  var NG = norm([0.32, 0.86, 0.38]);              /* плоскость «млечного пути» */
  var A = norm(cross(NG, [1, 0, 0])), B = norm(cross(NG, A));
  var i, u, phi, s, d;
  for(i = 0; i < 620; i++){                        /* фоновые звёзды по всей сфере */
    u = hypRand(1000 + i)*2 - 1; phi = hypRand(2000 + i)*6.28318; s = Math.sqrt(1 - u*u);
    hypStars.push({ d: [s*Math.cos(phi), u, s*Math.sin(phi)],
      r: 0.5 + hypRand(3000 + i)*1.5, a: 0.25 + hypRand(4000 + i)*0.7,
      ph: hypRand(5000 + i)*6.28, sp: 0.35 + hypRand(6000 + i)*1.5,
      bl: hypRand(7000 + i) < 0.16 });
  }
  for(i = 0; i < 780; i++){                        /* звёзды, прижатые к млечному пути */
    u = (hypRand(9000 + i)*2 - 1) * 0.16; phi = hypRand(11000 + i)*6.28318;
    d = norm(add(mul(A, Math.cos(phi)), mul(B, Math.sin(phi))));
    d = norm(add(d, mul(NG, u)));
    hypStars.push({ d: d, r: 0.4 + hypRand(12000 + i)*1.2, a: 0.2 + hypRand(13000 + i)*0.65,
      ph: hypRand(14000 + i)*6.28, sp: 0.3 + hypRand(15000 + i)*1.3,
      bl: hypRand(16000 + i) < 0.12 });
  }
  for(i = 0; i < 230; i++){                        /* мягкое свечение вдоль полосы */
    phi = hypRand(17000 + i)*6.28318;
    d = norm(add(mul(A, Math.cos(phi)), mul(B, Math.sin(phi))));
    hypBand.push({ d: d, r: 26 + hypRand(18000 + i)*60, a: 0.02 + hypRand(19000 + i)*0.05 });
  }
  hypConst = [];                                   /* 5 созвездий из ярких звёзд */
  for(var c = 0; c < 5; c++){
    u = hypRand(21000 + c)*2 - 1; phi = hypRand(22000 + c)*6.28318; s = Math.sqrt(1 - u*u);
    var cd = [s*Math.cos(phi), u, s*Math.sin(phi)], pts = [];
    for(i = 0; i < 6; i++){
      pts.push(norm(add(cd, mul(norm([hypRand(23000 + c*10 + i)*2 - 1, hypRand(24000 + c*10 + i)*2 - 1, hypRand(25000 + c*10 + i)*2 - 1]), 0.10 + hypRand(26000 + c*10 + i)*0.07))));
    }
    hypConst.push(pts);
  }
  hypNeb = [                                       /* туманности холодные космические */
    { d: norm([0.7, 0.25, 0.6]),   r: 210, a: 0.085, col: '123,92,255' },
    { d: norm([-0.6, 0.4, 0.5]),  r: 170, a: 0.07,  col: '72,140,255' },
    { d: norm([0.2, -0.65, -0.6]), r: 190, a: 0.06,  col: '96,120,255' }
  ];
}
function drawHypSky(dt, cam){
  if(!hypCv) initHypSky();
  var on = gameOn && !!(inTransit || warp);
  /* курсор: прячем в суперкруизе и варпе, показываем у планеты и на паузе */
  var cur = (on && !paused) ? 'none' : '';
  if(document.documentElement.style.cursor !== cur) document.documentElement.style.cursor = cur;
  var bg0 = document.getElementById('glbg');
  /* ГИПЕРПРОСТРАНСТВО рендерит webGL-фон(#glbg, uHyper=1) — готовый рендер ХИТОМИ.
     2D-канвас hypCv не нужен и скрыт. */
  if(bg0) bg0.style.opacity = '';
  if(hypCv) hypCv.style.display = 'none';
  if(!on){ hypOnLast = false; return; }
  hypOnLast = true;
  return; /* гиперпространство = webGL-шейдер (#glbg), 2D-канвас отключён */
  hypOnLast = true;
  var W = window.innerWidth, H = window.innerHeight;
  if(hypCv.width !== W || hypCv.height !== H){ hypCv.width = W; hypCv.height = H; }
  var ctx = hypCtx;
  hypT += (dt || 0.016);
  if(!hypStars) hypGenStars();
  var BIG = 1e6, i, pr;
  for(i = 0; i < hypNeb.length; i++){              /* туманности — под звёздами */
    var nb = hypNeb[i];
    pr = project(mul(nb.d, BIG), cam, W, H);
    if(pr && !pr.occl){
      var gr = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, nb.r);
      gr.addColorStop(0, 'rgba(' + nb.col + ',' + nb.a + ')');
      gr.addColorStop(1, 'rgba(' + nb.col + ',0)');
      ctx.fillStyle = gr;
      ctx.fillRect(pr.x - nb.r, pr.y - nb.r, nb.r*2, nb.r*2);
    }
  }
  for(i = 0; i < hypBand.length; i++){             /* свечение млечного пути */
    var bd = hypBand[i];
    pr = project(mul(bd.d, BIG), cam, W, H);
    if(pr && !pr.occl){
      var gb2 = ctx.createRadialGradient(pr.x, pr.y, 0, pr.x, pr.y, bd.r);
      gb2.addColorStop(0, 'rgba(110,125,175,' + bd.a.toFixed(3) + ')');
      gb2.addColorStop(1, 'rgba(110,125,175,0)');
      ctx.fillStyle = gb2;
      ctx.fillRect(pr.x - bd.r, pr.y - bd.r, bd.r*2, bd.r*2);
    }
  }
  for(i = 0; i < hypStars.length; i++){            /* звёзды: проекция направления + мерцание */
    var st = hypStars[i];
    pr = project(mul(st.d, BIG), cam, W, H);
    if(!pr || pr.occl) continue;
    var tw = 0.72 + 0.28*Math.sin(hypT*st.sp + st.ph);
    var al = Math.min(1, st.a*tw);
    if(st.r > 1.4){                                /* крупные звёзды — с ореолом */
      ctx.fillStyle = 'rgba(255,244,214,' + (al*0.35).toFixed(3) + ')';
      ctx.fillRect(pr.x - 2.2, pr.y - 2.2, 4.4, 4.4);
    }
    ctx.fillStyle = st.bl ? ('rgba(160,190,255,' + al.toFixed(3) + ')') : ('rgba(226,232,244,' + al.toFixed(3) + ')');
    ctx.fillRect(pr.x, pr.y, st.r, st.r);
  }
  ctx.strokeStyle = 'rgba(150,170,230,0.22)';      /* созвездия: линии между звёздами */
  ctx.lineWidth = 1;
  for(var c2 = 0; c2 < hypConst.length; c2++){
    var P0 = null, cl = hypConst[c2], L = cl.length;
    for(i = 0; i <= L; i++){
      pr = project(mul(cl[i % L], BIG), cam, W, H);
      if(pr && !pr.occl){
        ctx.fillStyle = 'rgba(210,225,255,0.95)';
        ctx.fillRect(pr.x - 1.5, pr.y - 1.5, 3, 3);
        if(P0){ ctx.beginPath(); ctx.moveTo(P0.x, P0.y); ctx.lineTo(pr.x, pr.y); ctx.stroke(); }
        P0 = pr;
      } else P0 = null;
    }
  }
}

/* ================= ☩ ПРОЦЕДУРНЫЕ НЕБЕСНЫЕ ТЕЛА ☩ =================
   Рендер 1:1: разрешение канвы равно размеру тела на экране, перерисовка
   каждый кадр. Без LOD и троттлинга. Текстуры суши/облаков/сыра

var PB_TEX = null, PB_HOLES = null, PB_RB = null, PB_RF = null;

}
function pbVn(px, py, pz, sd){
  var xi = Math.floor(px), yi = Math.floor(py), zi = Math.floor(pz);
  var xf = px - xi, yf = py - yi, zf = pz - zi;
  var sx = xf*xf*(3-2*xf), sy = yf*yf*(3-2*yf), sz = zf*zf*(3-2*zf);
  var c000 = pbHash(xi,yi,zi,sd), c100 = pbHash(xi+1,yi,zi,sd);
  var c010 = pbHash(xi,yi+1,zi,sd), c110 = pbHash(xi+1,yi+1,zi,sd);
  var c001 = pbHash(xi,yi,zi+1,sd), c101 = pbHash(xi+1,yi,zi+1,sd);
  var c011 = pbHash(xi,yi+1,zi+1,sd), c111 = pbHash(xi+1,yi+1,zi+1,sd);
  var x00 = c000+(c100-c000)*sx, x10 = c010+(c110-c010)*sx;
  var x01 = c001+(c101-c001)*sx, x11 = c011+(c111-c011)*sx;
  var y0 = x00+(x10-x00)*sy, y1 = x01+(x11-x01)*sy;
  return y0+(y1-y0)*sz;
}
function pbFbm(px, py, pz, sd){
  var v = 0.55*pbVn(px, py, pz, sd);
  v += 0.275*pbVn(px*2.07, py*2.07, pz*2.07, sd+11);
  v += 0.1375*pbVn(px*4.28, py*4.28, pz*4.28, sd+23);
  return v/0.9625;
}
function pbInitTex(){
  if(PB_TEX) return;
  var TW = 512, TH = 256;
  PB_HOLES = [];
  for(var h = 0; h < 16; h++){
    var ta = pbHash(h,1,2,7)*Math.PI*2, pa = Math.acos(2*pbHash(h,3,4,9)-1);
    PB_HOLES.push({ d: [Math.sin(pa)*Math.cos(ta), Math.cos(pa), Math.sin(pa)*Math.sin(ta)], r: 0.07 + 0.07*pbHash(h,5,6,3) });
  }
  PB_TEX = [];
  for(var k = 0; k < PLANET_NAMES.length; k++){
    if(pKind(k) === 3){ PB_TEX.push(null); continue; } /* пульсар: без текстуры */
    var terr = new Uint8ClampedArray(TW*TH*3), cloud = new Uint8ClampedArray(TW*TH);
    for(var y = 0; y < TH; y++){
      var lat = (0.5 - y/(TH-1))*Math.PI;
      var cl_ = Math.cos(lat), sl_ = Math.sin(lat);
      for(var x = 0; x < TW; x++){
        var lon = x/TW*Math.PI*2;
        var vx = cl_*Math.cos(lon), vy = sl_, vz = cl_*Math.sin(lon);
        var i3 = (y*TW+x)*3, r1, g1, b1;
        if(k === 1){ /* ЧИЗИЯ: сыр */
          var chN = pbFbm(vx*2.3, vy*2.3, vz*2.3, 41);
          r1 = Math.round(255*(0.72+0.28*chN)); g1 = Math.round(233*(0.7+0.3*chN)); b1 = Math.round(40+120*chN);
          var rind = Math.min(1, Math.max(0, (Math.abs(lat)-0.95)/0.5));
          r1 = Math.round(r1*(1-rind)+138*rind); g1 = Math.round(g1*(1-rind)+92*rind); b1 = Math.round(b1*(1-rind));
          for(var h2 = 0; h2 < 16; h2++){
            var dd2 = vx*PB_HOLES[h2].d[0] + vy*PB_HOLES[h2].d[1] + vz*PB_HOLES[h2].d[2];
            if(dd2 > Math.cos(PB_HOLES[h2].r)){ r1 = 92; g1 = 58; b1 = 0; }
            else if(dd2 > Math.cos(PB_HOLES[h2].r*1.25)){
              r1 = Math.round(r1*0.6+37); g1 = Math.round(g1*0.6+23); b1 = Math.round(b1*0.4);
            }
          }
        } else {
          var e2 = pbFbm(vx*2.1, vy*2.1, vz*2.1, 3+k*17);
          var grn = (k === 0);
          if(e2 > 0.52){
            var lm = Math.min(1, (e2-0.52)/0.3);
            r1 = grn ? Math.round(214-89*lm) : Math.round(236-60*lm);
            g1 = grn ? 255 : Math.round(216-105*lm);
            b1 = grn ? Math.round(176-38*lm) : 255;
          } else {
            var om = Math.max(0, (e2-0.3)/0.22);
            r1 = grn ? Math.round(3+8*om) : Math.round(23+51*om);
            g1 = grn ? Math.round(26+51*om) : Math.round(5+24*om);
            b1 = grn ? Math.round(11+20*om) : Math.round(39+81*om);
          }
        }
        terr[i3] = r1; terr[i3+1] = g1; terr[i3+2] = b1;
        cloud[y*TW+x] = Math.round(255*pbFbm(vx*3.1+7.3, vy*3.1, vz*3.1+2.2, 61+k*7));
      }
    }
    PB_TEX.push({ tw: TW, th: TH, terr: terr, cloud: cloud });
  }
}
function renderPlanetBody(k, cv, size, L, simT){
  pbInitTex();
  var cw, ch;
  if(pKind(k) === 1){ cw = Math.ceil(size*2.6); ch = Math.ceil(size*1.4); }
  else if(pKind(k) === 3){ cw = Math.ceil(size*2.4); ch = Math.ceil(size*2.4); }
  else { cw = Math.ceil(size); ch = Math.ceil(size); }
  if(cv.width !== cw || cv.height !== ch){ cv.width = cw; cv.height = ch; }
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.transform = 'translate(' + (-cw*0.5) + 'px,' + (-ch*0.5) + 'px)';
  if(pKind(k) === 3){ pbPulsar(cv.getContext('2d'), cw, ch, simT); return; }
  if(pKind(k) === 1){ pbCheese(cv.getContext('2d'), cw, ch, simT, L); return; }
  pbPlanetBody(k, cv.getContext('2d'), cw, ch, simT, L);
}
function pbSample(tex, u, v){
  var xi = Math.min(tex.tw-1, Math.floor(u*tex.tw)), yi = Math.min(tex.th-1, Math.floor(v*tex.th));
  var ci = (yi*tex.tw + xi)*3;
  return [tex.terr[ci], tex.terr[ci+1], tex.terr[ci+2], tex.cloud[yi*tex.tw + xi]];
}
function pbSpherePixel(tex, nx, ny, spin, drift, L, out){
  var r2 = nx*nx + ny*ny;
  if(r2 > 1) return false;
  var nz = Math.sqrt(1-r2);
  var cA = Math.cos(spin), sA = Math.sin(spin);
  var rx = nx*cA + nz*sA, rz = -nx*sA + nz*cA;
  var uT = Math.atan2(rz, rx)/(Math.PI*2) - spin; uT -= Math.floor(uT);
  var uC = Math.atan2(rz, rx)/(Math.PI*2) - drift; uC -= Math.floor(uC);
  var vv = 0.5 - Math.asin(ny)/Math.PI;
  var c = pbSample(tex, uT, vv);
  var cA2 = c[3]*0.00075*255/100*0.0; /* облака: доля 0..1 */
  cA2 = (c[3]/255)*0.75;
  var diff = Math.max(0, nx*L[0] - ny*L[1] + nz*L[2]);
  /* ЛОД убран: планета показывается «как есть» — текстура поверхности всегда
     различима, без чёрной ночной стороны. Объём оставляет мягкий терминатор. */
  var sh = (0.62 + 0.38*diff)*(0.72 + 0.28*nz);
  out[0] = (c[0]*(1-cA2) + 255*cA2)*sh;
  out[1] = (c[1]*(1-cA2) + 255*cA2)*sh;
  out[2] = (c[2]*(1-cA2) + 255*cA2)*sh;
  out[3] = 255;
  return true;
}
function pbPlanetBody(k, ctx, S, simT, L){
  var tex = PB_TEX[k];
  var img = ctx.createImageData(S, S);
  var d = img.data, out = [0,0,0,0];
  var spin = simT*0.05, drift = simT*0.09;
  for(var py = 0; py < S; py++){
    var ny = 2*(py+0.5)/S - 1;
    for(var px = 0; px < S; px++){
      if(pbSpherePixel(tex, 2*(px+0.5)/S - 1, ny, spin, drift, L, out)){
        var o = (py*S+px)*4;
        d[o] = out[0]; d[o+1] = out[1]; d[o+2] = out[2]; d[o+3] = 255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}
function pbRings(ctx, cx, cy, R, front){
  var bands = ['#f7cc1d','#fff0a0','#d9a80e','#f7cc1d','#8a5c00','#ffe9a8','#c98f0a'];
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-0.35);
  ctx.scale(1, 0.32);
  for(var i = 0; i < 7; i++){
    var rr = (1.08 + i*0.128)*R;
    ctx.strokeStyle = bands[i];
    ctx.lineWidth = R*0.055;
    ctx.globalAlpha = (i === 4) ? 0.35 : 0.85;
    ctx.beginPath();
    ctx.arc(0, 0, rr, front ? 0 : Math.PI, front ? Math.PI : Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function pbCheese(ctx, cw, ch, simT, L){
  ctx.clearRect(0, 0, cw, ch);
  var R = ch/2.8, cx = cw*0.5, cy = ch*0.5;
  if(!PB_RB){ PB_RB = document.createElement('canvas'); PB_RF = document.createElement('canvas'); }
  if(PB_RB.width !== cw || PB_RB.height !== ch){ PB_RB.width = cw; PB_RB.height = ch; PB_RF.width = cw; PB_RF.height = ch; }
  var cb = PB_RB.getContext('2d'), cf = PB_RF.getContext('2d');
  cb.clearRect(0, 0, cw, ch); cf.clearRect(0, 0, cw, ch);
  pbRings(cb, cx, cy, R, false);
  pbRings(cf, cx, cy, R, true);
  ctx.drawImage(PB_RB, 0, 0);
  var tex = PB_TEX[1];
  var x0 = Math.max(0, Math.floor(cx-R)), x1 = Math.min(cw, Math.ceil(cx+R));
  var y0 = Math.max(0, Math.floor(cy-R)), y1 = Math.min(ch, Math.ceil(cy+R));
  var img = ctx.createImageData(x1-x0, y1-y0);
  var d = img.data, out = [0,0,0,0];
  var spin = simT*0.05, drift = simT*0.09;
  for(var py = y0; py < y1; py++){
    var ny = 2*(py+0.5-cy)/(R*2);
    for(var px = x0; px < x1; px++){
      if(pbSpherePixel(tex, 2*(px+0.5-cx)/(R*2), ny, spin, drift, L, out)){
        var o = ((py-y0)*(x1-x0) + (px-x0))*4;
        d[o] = out[0]; d[o+1] = out[1]; d[o+2] = out[2]; d[o+3] = 255;
      }
    }
  }
  ctx.putImageData(img, x0, y0);
  ctx.drawImage(PB_RF, 0, 0);
}
function pbPulsar(ctx, cw, ch, simT){
  ctx.clearRect(0, 0, cw, ch);
  var cx = cw*0.5, cy = ch*0.5, R = cw/4.8;
  var pulse = 0.15 + 0.85*(0.5 + 0.5*Math.sin(Math.PI*2*simT/0.8));
  var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R*2.15);
  g.addColorStop(0, 'rgba(255,255,255,' + (0.95*pulse).toFixed(3) + ')');
  g.addColorStop(0.25, 'rgba(190,225,255,' + (0.55*pulse).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(120,170,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cw, ch);
  var ax = simT*0.35;
  for(var sgn = -1; sgn <= 1; sgn += 2){
    var dx = Math.cos(ax)*sgn, dy = Math.sin(ax)*sgn;
    for(var seg = 0; seg < 3; seg++){
      var L2 = R*(1.4 + seg*0.35);
      var flick = 0.5 + 0.5*pbHash(Math.floor(simT*13), seg, sgn, 5);
      ctx.strokeStyle = 'rgba(200,225,255,' + (0.32*pulse*flick/(seg+1)).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, R*(0.34 - seg*0.09));
      ctx.beginPath();
      ctx.moveTo(cx + dx*R*0.4, cy + dy*R*0.4);
      ctx.lineTo(cx + dx*L2, cy + dy*L2);
      ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,' + (0.9*pulse).toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(cx, cy, R*0.55, 0, Math.PI*2); ctx.fill();
}
