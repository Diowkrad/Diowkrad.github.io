function projectW(p, cam, W, H){
  var v = sub(p, cam.pos);
  var dist = len(v);
  var z = dot(v, cam.fwd);
  if(z < 0.01) return null;
  var ux = dot(v, cam.right)/(z*CFG.FOV_TAN);
  var uy = dot(v, cam.up)/(z*CFG.FOV_TAN);
  var sx = (ux*H + W)/2;
  var sy = (H - uy*H)/2;
  if(sx < -140 || sx > W + 140 || sy < -140 || sy > H + 140) return null;
  return { x: sx, y: sy, z: z };
}
/* ☩ НЕБО: тела сортируются по дальности, рендер канвой 1:1 (без LOD), каждый кадр ☩ */
function drawPlanetsSky(cam, W, H, bgSim){
  initSky();
  var retDrawn = false;
  if(!gameOn){
    for(var hz = 0; hz < skyWrapEls.length; hz++) skyWrapEls[hz].style.display = 'none';
    skyRet.style.display = 'none';
    return;
  }
  var sun = sunDirNow(bgSim);
  /* свет в экранных координатах: [вправо, вниз, вглубь] */
  var L = [dot(sun, cam.right), -dot(sun, cam.up), dot(sun, cam.fwd)];
  var order = [];
  for(var k = 0; k < PLANET_NAMES.length; k++){
    if(k === planet && !inTransit) continue;
    var wp = inTransit ? PW[k] : sub(PW[k], PW[planet]);
    var pr = inTransit ? projectW(wp, cam, W, H) : project(wp, cam, W, H);
    var edgeLbl = false;
    if(!pr){
      /* LBL-EDGE: центр сферы за кадром, но силуэт касается экрана —
         считаем проекцию без отсечения и зажимаем метку в кадр */
      var vF = sub(wp, cam.pos), zF = dot(vF, cam.fwd);
      if(zF > 0.01){
        var fux = dot(vF, cam.right)/(zF*CFG.FOV_TAN), fuy = dot(vF, cam.up)/(zF*CFG.FOV_TAN);
        var fx = (fux*H + W)/2, fy = (H - fuy*H)/2;
        var frad = Math.min(H*2.2, (1/zF)*H)*0.5;
        var hidden = false;
        if(!inTransit){
          var dP2 = len(cam.pos), dF2 = len(vF);
          var dirP2 = mul(cam.pos, -1/(dP2||1)), dirF2 = mul(vF, 1/(dF2||1));
          var sepA2 = Math.acos(Math.max(-1, Math.min(1, dot(dirP2, dirF2))));
          hidden = (sepA2 + Math.asin(Math.min(1, 1/(dF2||1))) <= Math.asin(Math.min(1, 1/(dP2||1))));
        }
        if(!hidden && fx > -frad && fx < W + frad && fy > -frad && fy < H + frad){
          pr = { x: Math.max(26, Math.min(W - 26, fx)), y: Math.max(20, Math.min(H - 30, fy)), z: zF };
          edgeLbl = true;
        }
      }
    }
    if(pr && pr.occl){
      /* occl = луч к ЦЕНТРУ задет текущей планетой; подпись прячем только если
         скрыт ВЕСЬ силуэт: sep + asin(1/dF) <= asin(1/dP) (обе сферы R=1). */
      var dP = len(cam.pos), dvF = sub(wp, cam.pos), dF = len(dvF);
      var dirP = mul(cam.pos, -1/(dP||1));
      var dirF = mul(dvF, 1/(dF||1));
      var sepA = Math.acos(Math.max(-1, Math.min(1, dot(dirP, dirF))));
      var rP = Math.asin(Math.min(1, 1/(dP||1)));
      var rF = Math.asin(Math.min(1, 1/(dF||1)));
      if(sepA + rF <= rP) continue;
      /* виден хотя бы край силуэта — подпись оставляем (координаты уже в pr) */
    }
    if(!pr) continue;
    order.push({ k: k, pr: pr, wp: wp, edge: edgeLbl });
  }
  order.sort(function(a, b){ return b.pr.z - a.pr.z; }); /* дальние раньше, ближние поверх */
  var drawn = {};
  for(var o = 0; o < order.length; o++){
    var k2 = order[o].k, pr2 = order[o].pr, wp2 = order[o].wp;
    var isEdge = order[o].edge;
    drawn[k2] = true;
    /* 3D-ЛОД вынесен в WebGL-шейдер (#glbg) — 2D-канвас дальних планет скрываем.
       Оставляем только мишень-ретикл и метку, чтобы цели/коллайдеры работали как раньше. */
    var size = Math.max(3, Math.min(H*2.2, (1/pr2.z)*H));
    var w2 = skyWrapEls[k2], cv = skyCvEls[k2], lbl = skyLblEls[k2];
    w2.style.display = 'block';
    w2.style.transform = 'translate(' + pr2.x.toFixed(1) + 'px,' + pr2.y.toFixed(1) + 'px)';
    if(cv) cv.style.display = 'none';
    lbl.style.display = 'block';
    lbl.style.top = (isEdge ? 10 : size*0.5 + 7).toFixed(1) + 'px';
    var un = unlockedIdx(k2);
    lbl.style.color = un ? '#7dff8a' : '#ff5a4a';
    lbl.textContent = un ? PLANET_NAMES[k2] : '\u{1F512} ' + PLANET_NAMES[k2];
    if(targetIdx === k2 && !isEdge){
      retDrawn = true;
      skyRet.style.display = 'block';
      var rs = size*1.8 + 14;
      skyRet.style.transform = 'translate(' + pr2.x.toFixed(1) + 'px,' + pr2.y.toFixed(1) + 'px)';
      skyRet.firstChild.style.width = skyRet.firstChild.style.height = rs.toFixed(1) + 'px';
    }
  }
  if(!retDrawn) skyRet.style.display = 'none';
  /* канвы-призраки: всё, что не попало в кадр, прячем */
  for(var k3 = 0; k3 < skyWrapEls.length; k3++) if(!drawn[k3]) skyWrapEls[k3].style.display = 'none';
}
/* ☩ ЗВЁЗДЫ-ЛОДЫ (межзвёздная механика): проецируем каждую на экран как дальний ориентир.

function drawStarsSky(cam, W, H){

    var sxS = (uxS*H + W)/2, syS = (H - uyS*H)/2;

/* Отрисовка 2D-FSD-туннеля (страйки + градиент + вспышка выхода). Общая для фазы A
   межзвёздного прыжка и для межпланетного прыжка. */
function drawWarpTunnel(W, H, ctx, inten, streakSpd, dt){
  ctx.clearRect(0, 0, W, H);
  var cx = W/2, cy = H/2, R = Math.sqrt(cx*cx + cy*cy);
  ctx.globalCompositeOperation = 'lighter';
  if(warpStreaks === null){
    warpStreaks = [];
    for(var i = 0; i < 150; i++) warpStreaks.push({ a: srand()*Math.PI*2, r: srand()*1.2, s: 0.5 + srand()*1.2, w: 0.5 + srand()*1.6 });
  }
  for(var j = 0; j < warpStreaks.length; j++){
    var st = warpStreaks[j];
    st.r += st.s*streakSpd*dt*1.6;
    if(st.r > 1.35){ st.r = srand()*0.25; st.a = srand()*Math.PI*2; }

    ctx.lineWidth = st.w;

    ctx.lineTo(cx + Math.cos(st.a)*(rr - tail), cy + Math.sin(st.a)*(rr - tail));

  g.addColorStop(1, 'rgba(140,190,255,0)');

    inten = Math.max(0, 1 - pe);
    streakSpd = Math.max(0.2, 1.6*(1 - pe));
  }
  warpCv.style.display = 'block';
  drawWarpTunnel(W, H, ctx, inten, streakSpd, dt);
  if(warp.t >= t2){
    var pf = (warp.t - t2)/FSD_EXIT;
    if(pf > 0.65){
      ctx.fillStyle = 'rgba(255,255,255,' + (0.9*Math.min(1, (pf - 0.65)/0.35)).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);

  }

}
/* ☩ СМЕНА ЗВЁЗДНОЙ СИСТЕМЫ: подменяем живую таблицу PLANETS_DB.planets новым набором
   и пересобираем всё, что от неё зависит. Прогресс (EXP/HP/запасы/диски) сохраняется —
   сбрасывается только мир предметов, чтобы тела успели отродиться в новой системе. */
function loadStarSystem(si){
  var key = (StarsDB[si] && StarsDB[si].sys) || 'home';
  var set = SYSTEM_SETS[key] || HOME_PLANETS;
  currentSystem = key; /* прячем лод системы, куда вошли */
  PLANETS_DB.planets = set;
  PLANET_NAMES = set.map(function(p){ return p.name; });
  PW = set.map(function(p){ return p.pos.slice(); });
  /* window.PW — геттер только для чтения: переприсваиваем PW, а не window.PW */
  FIN = set.length - 1;
  /* звезда системы — тело kind 'star-gl' (точка 0,0,0). На её орбиту телепортируем мишку. */
  var starIdx = 0;
  for(var _sk = 0; _sk < set.length; _sk++){ if(pKind(_sk) === 4){ starIdx = _sk; break; } }
  if(starIdx >= set.length) starIdx = set.length - 1;
  CAMR0 = 1.0 + 1000.0/bodyRadiusKm(starIdx);
  /* точка прилёта к SOL — с зазором от звезды (не вплотную); у остальных систем как есть */
  if(key === 'sol') CAMR0 = 5.0;
  /* очистка старого мира предметов и орбит */
  for(var _i = ITEMS.length - 1; _i >= 0; _i--){ if(ITEMS[_i] && ITEMS[_i].el && ITEMS[_i].el.parentNode) ITEMS[_i].el.parentNode.removeChild(ITEMS[_i].el); }
  ITEMS.length = 0;
  /* старт на орбите ЗВЕЗДЫ новой системы, как при обычном начале */
  planet = starIdx; inTransit = false; targetIdx = -1; starSel = -1;
  if(F.pos){
    if(key === 'sirius'){
      /* точка прилёта к SIRIUS — фиксированная координата (цель со скрина): [5.84, -0.21, 1.10] */
      F.pos = [5.84, -0.21, 1.10];
    } else {
      F.pos = [Math.cos(A0)*CAMR0, Math.sin(A0)*CAMR0, 0];
    }
    resetBasis();
  }
  setSpaceMode();
  /* орбиты: пересчёт под новый набор тел */
  orbitalInit();
  orbitalApply();
  /* отрод мира предметов новой системы */
  genWorld();
  lastHpMax = -1;
  if(sfx.music && sfx.started){ try{ sfx.music.pause(); sfx.music.src = trackFor(starIdx); }catch(e){} }
  if(sfx.musicOn) tryMusic();
  updHud();
  /* ОБЛИК + АТМОСФЕРА: цвет HUD планеты через --accent */
  try{
    var _ph = (PLANETS_DB && PLANETS_DB.planets && PLANETS_DB.planets[planet] && PLANETS_DB.planets[planet].hud);
    document.documentElement.style.setProperty('--accent', (_ph && /^#[0-9a-fA-F]{6}$/.test(_ph)) ? _ph : '#4f8ee9');
  }catch(_h){};
  /* ОБЛИК + АТМОСФЕРА: аудио-петля планеты (audio.loop) */
  applyAmbLoop();
  updBottomPanel();
  toastFx('СИСТЕМА: ' + StarsDB[si].name, '#4ae8ff');
}

function commitStarJump(si){

function fsdJump(dir){
  if(!gameOn || paused || switching || warp) return;
  /* МЕЖЗВЁЗДНЫЙ ПЕРЕЛЁТ: G при выделенном звёздном лоде (U) сменяет систему */
  if(dir > 0 && starSel >= 0){

    if(fsdCharge < 1){ toastFx('FSD: НУЖЕН 1 ЗАРЯД', '#ff5a4a'); return; }
    fsdCharge--; fsdChargeProgress = 0; fsdActiveRate = 0;

/* ---------- ГЛАВНЫЙ ЦИКЛ ИГРЫ ---------- */
var simT = 0, lastT = performance.now();
/* ☩ P32 CORE-SYNC: фиксированный шаг 20 Гц (50 мс). Механика идёт тиками,
   рендер остаётся на rAF: мир воспроизводим, сейв/реплей честны. */
var FIX_DT = 1/20, MAX_TICKS = 8, simAcc = 0;
function loop(now){
  requestAnimationFrame(loop);
  try{
    var dt = Math.min((now - lastT)/1000, 0.1);
    lastT = now;
    if(paused) dt = 0;
    var bgSim = (typeof window.__bgSim === 'number') ? window.__bgSim : simT*60.0;
    var W = window.innerWidth, H = window.innerHeight;
    var cam;
    if(gameOn){
      if(!paused){
      /* ☩ детерминированный тик: механика — фиксированными шагами, «лавина» гасится */
      simAcc += dt;
      var __ticks = 0;
      while(simAcc >= FIX_DT && __ticks < MAX_TICKS){
        simAcc -= FIX_DT; __ticks++;
        simT += FIX_DT;
        if(warp) updWarp(FIX_DT); else physics(FIX_DT);
        /* FSD-заряд: активная зарядка у НЕЙТРОННЫХ (пульсаров, jets.on) и ОБЫЧНЫХ звёзд (star-gl),
           1 сегмент за FSD_NEUTRON_TIME / FSD_STAR_TIME сек. Пассивная регенерация — макс 1 сегмент
           за FSD_PASSIVE_TIME сек, без отображения в HUD. */
        if(!warp && gameOn && !inTransit){
          var _rate = 0;
          if(pKind(planet) === 3){ /* пульсар/нейтронная: нужен включённый jets */
            var _eJ = PLANETS_DB.planets[planet].fx && PLANETS_DB.planets[planet].fx.jets;
            if(_eJ && _eJ.on) _rate = FSD_NEUTRON_TIME;
          } else if(pKind(planet) === 4){ /* обычная звезда (star-gl) */
            _rate = FSD_STAR_TIME;
          }
          fsdActiveRate = _rate;
          if(_rate > 0 && fsdCharge < fsdMax){
            fsdChargeProgress = Math.min(1, fsdChargeProgress + FIX_DT/_rate);
            if(fsdChargeProgress >= 1){ fsdChargeProgress = 0; fsdCharge++; toastFx('FSD ЗАРЯД: ' + fsdCharge + '/7', '#4ae8ff'); }
          }
          /* пассивная регенерация: максимум 1 сегмент за 180с, один раз */
          if(fsdCharge < fsdMax && fsdPassiveGiven === 0){
            fsdPassiveT += FIX_DT;
            if(fsdPassiveT >= FSD_PASSIVE_TIME){ fsdPassiveT = 0; fsdPassiveGiven = 1; fsdCharge++; toastFx('FSD ПАССИВ: +1', '#4ae8ff'); }
          }
        } else if(!inTransit){
          fsdChargeProgress = 0; fsdActiveRate = 0;
        }
        if(pepperCd > 0) pepperCd = Math.max(0, pepperCd - FIX_DT);
        if(immuneT > 0) immuneT = Math.max(0, immuneT - FIX_DT);
        if(boostOn){
          boostLeft -= FIX_DT;
          boostFuel = Math.max(0, boostFuel - CFG.BOOST_DRAIN*FIX_DT);
          if(boostLeft <= 0 || boostFuel <= 0) boostOn = false;
        } else if(boostFuel < 100){
          boostFuel = Math.min(100, boostFuel + FIX_DT/CFG.BOOST_REGEN);
        }
        boostMul += ((boostOn ? CFG.BOOST_MULT : 1) - boostMul)*Math.min(1, FIX_DT*1.6);
        if(magnetT > 0) magnetT = Math.max(0, magnetT - FIX_DT);
        if(freezeT > 0) freezeT = Math.max(0, freezeT - FIX_DT);
        if(hotDenyT > 0) hotDenyT = Math.max(0, hotDenyT - FIX_DT);
        if(pepBanT > 0){
          pepBanT -= FIX_DT;
          if(pepBanT <= 0){
            pepBanT = 0;
            for(var pi = 0; pi < ITEMS.length; pi++){
              var pit = ITEMS[pi];
              if(pit && pit.kind === 'pepper'){ pit.dead = false; respawn(pit); }
            }
          }
        }
        ensureSnow();
        tickShots(FIX_DT);
        invTickAll();
      }
      if(simAcc >= FIX_DT*MAX_TICKS) simAcc = 0; /* защита от «лавины» */
      if(snowEl) snowEl.style.opacity = (freezeT > 0) ? '1' : '0';
      if(lensEl) lensEl.style.display = (immuneT > 0) ? 'block' : 'none';
      updBottomPanel();
      }
      OCCL_Y = 0;
      var CP = inTransit ? FT : F;
      cam = { pos: CP.pos, fwd: CP.fwd, up: CP.up, right: CP.right };
      window.__gameState = { active: true, planet: planet,
        pos: CP.pos, fwd: CP.fwd, up: CP.up, right: CP.right };
    } else {
      var camA = 2*Math.PI*bgSim/2275.9;
      var _bcamR = 1.0 + CAMERA_ALT_KM / bodyRadiusKm(window.__splashPlanet || 0);
      var cx = Math.cos(camA)*_bcamR, cy = Math.sin(camA)*_bcamR - (pKind(window.__splashPlanet || 0) === 3 ? 0.14 : 0);
      var f0x = -Math.sin(camA), f0y = Math.cos(camA);
      var u0x = Math.cos(camA), u0y = Math.sin(camA);
      var f1x = f0x*0.78 - u0x*0.22, f1y = f0y*0.78 - u0y*0.22;
      var fl = Math.sqrt(f1x*f1x + f1y*f1y) || 1;
      f1x /= fl; f1y /= fl;
      var r1z = f1x*u0y - f1y*u0x;
      OCCL_Y = (window.__splashPlanet === 3) ? 0.14 : 0;
      cam = { pos: [cx, cy, 0], fwd: [f1x, f1y, 0], right: [0, 0, r1z], up: [-r1z*f1y, r1z*f1x, 0] };
      window.__gameState = { active: false };
    }
    drawSprites(cam, W, H, bgSim, dt);
    drawPlanetsSky(cam, W, H, bgSim);
    drawHypSky(dt, cam);
    drawStarsSky(cam, W, H);
    updFsdChargeUi();
    updHud();
  }catch(e){
    gameErr('ИГРА: ошибка кадра — ' + (e && e.message ? e.message : e));
  }
}

/* ☩ INV: ИНВЕНТАРЬ (Minecraft-сетка). Ресурсы перенесены со счётчика segPanel.

var INV_OPEN = false;

var INV_PANEL = null, INV_GRID = null;
var invSel = 'cake';
var INV = [
  { id:'cake',   name:'КЕКС',  icon:'\u{1F9C1}',
    get:function(){ return provCk; },
    set:function(v){ provCk = Math.max(0, v); },
    meta:{ triggers:{} } },
  { id:'cheese', name:'СЫР',   icon:'\u{1F9C0}',
    get:function(){ return provCh; },
    set:function(v){ provCh = Math.max(0, v); },
    meta:{ triggers:{} } },
  { id:'stock',  name:'ЗАПАС', icon:'\u{1F31D}',
    get:function(){ return moonStock; },
    set:function(v){ moonStock = Math.max(0, Math.min(moonCap, v)); },
    meta:{ triggers:{} } },
  { id:'pepper', name:'ПЕРЦЫ', icon:'\u{1F336}\uFE0F',
    get:function(){ return pepperInv; },
    set:function(v){ pepperInv = Math.max(0, v); },
    meta:{ triggers:{} } }
];
function invRes(id){
  for(var i=0;i<INV.length;i++) if(INV[i].id === id) return INV[i];
  return null;
}
/* ---------- ДВИЖОК ТРИГГЕРОВ ----------
   meta.triggers = { onTick: [шаги], onT: [...], onRMB: [...], onLMB: [...] }
   Шаг: { if:{cond}, then:[..], else:[..] } | { for:{var,from,to}, body:[..] }
        { while:{cond}, body:[..] } | { switch:{field, case:{v:[..]}}, default }
        действие: { add/sub/set:{target:кол-во} }, { effect:'shield|magnet|freeze|flash' } */
function invVal(res, field){
  if(field === 'count') return res.get();
  if(field === 'pts') return pts;
  if(field === 'exp') return expTotal;
  if(field === 'hp') return hpCur;
  if(field === 'fuel') return boostFuel;
  if(field === 'stock') return moonStock;
  var r = invRes(field);
  return r ? r.get() : 0;
}
function invCond(cond, ctx){
  if(!cond) return false;
  if(cond.and){ for(var i=0;i<cond.and.length;i++) if(!invCond(cond.and[i], ctx)) return false; return true; }
  if(cond.or){ for(var j=0;j<cond.or.length;j++) if(invCond(cond.or[j], ctx)) return true; return false; }
  var lhs = invVal(ctx.res, cond.field || cond.f || 'count');
  var op = cond.op || '>=';
  var rhs = (typeof cond.val === 'number') ? cond.val : invVal(ctx.res, cond.val || 'count');
  if(op === 'eq') return lhs === rhs;
  if(op === 'ne') return lhs !== rhs;
  if(op === '>')  return lhs > rhs;
  if(op === '>=') return lhs >= rhs;
  if(op === '<')  return lhs < rhs;
  if(op === '<=') return lhs <= rhs;
  return false;
}
function invApply(a, ctx){
  if(!a) return;
  var res = ctx.res;
  if(a.add){ for(var k in a.add){ var v=a.add[k];
    if(k==='count' && res) res.set(res.get()+v);
    else if(k==='pts') pts+=v;
    else if(k==='exp') expTotal+=v;
    else if(k==='hp') hpCur=Math.max(0,Math.min(hpMax,hpCur+v));
    else if(k==='fuel') boostFuel=Math.min(100,boostFuel+v);
    else { var r=invRes(k); if(r) r.set(r.get()+v); }
  } }
  if(a.sub){ for(var s in a.sub){ var w=a.sub[s];
    if(s==='count' && res) res.set(res.get()-w);
    else if(s==='pts') pts-=w;
    else if(s==='exp') expTotal-=w;
    else if(s==='hp') hpCur=Math.max(0,hpCur-w);
    else if(s==='fuel') boostFuel=Math.max(0,boostFuel-w);
    else { var r2=invRes(s); if(r2) r2.set(r2.get()-w); }
  } }
  if(a.set){ for(var t in a.set){ var u=a.set[t];
    if(t==='count' && res) res.set(u);
    else if(t==='pts') pts=u;
    else if(t==='exp') expTotal=u;
    else if(t==='hp') hpCur=Math.max(0,Math.min(hpMax,u));
    else if(t==='fuel') boostFuel=Math.max(0,Math.min(100,u));
    else { var r3=invRes(t); if(r3) r3.set(u); }
  } }
  if(a.effect){
    if(a.effect==='shield'){ immuneT = CFG.SHIELD_T; ensureLens(); }
    else if(a.effect==='magnet') magnetT = MAG_T;
    else if(a.effect==='freeze') freezeT = CFG.FREEZE_T;
    else if(a.effect==='flash') doFlash();
  }
}
function invRun(steps, ctx){
  if(!steps) return;
  for(var i=0;i<steps.length;i++){
    var s = steps[i];
    if(!s) continue;
    if(s.if){ if(invCond(s.if, ctx)) invRun(s.then||[], ctx); else invRun(s.else||[], ctx); }
    else if(s.for){
      var from = s.for.from||0, to = s.for.to||0;
      for(var v=from; v<=to; v++){ ctx.loopVar=v; ctx.loopName=s.for.var||'i'; invRun(s.for.body||[], ctx); }
    }
    else if(s.while){
      var g=0;
      while(invCond(s.while, ctx) && g<1000){ g++; invRun(s.while.body||[], ctx); }
    }
    else if(s.switch){
      var sv = invVal(ctx.res, s.switch.field||s.switch.on||'count');
      var ca = s.switch.case || {};
      var key = String(sv);
      if(ca[key]) invRun(ca[key], ctx);
      else if(ca['default']) invRun(ca['default'], ctx);
    }
    else { invApply(s, ctx); }
  }
}
function invFire(triggerName, res){
  var tg = res && res.meta && res.meta.triggers ? res.meta.triggers[triggerName] : null;
  if(!tg) return;
  invRun(tg, { res: res });
  invUpdateCounts();
  saveScore();
}
function invTickAll(){
  if(!gameOn || gameOver) return;
  for(var i=0;i<INV.length;i++){
    var tg = INV[i].meta && INV[i].meta.triggers ? INV[i].meta.triggers.onTick : null;
    if(tg) invRun(tg, { res: INV[i] });
  }
  invUpdateCounts();
  saveScore();
}
/* ПКМ по перчику: случайное вознаграждение. Сыр/кекс 40%+40%, запас 20% (пониженный шанс).
   ПКМ расходует 1 перчик и НЕ наносит урон. */
function invPepperLuck(){
  if(!gameOn || gameOver) return;
  if(pepperInv < 1) return;
  pepperInv--;
  var r = Math.random()*100;
  if(r < 40){ provCh++; }
  else if(r < 80){ provCk++; }
  else { if(moonStock < moonCap) moonStock++; }
  invUpdateCounts();
  saveScore();
}
/* Диск с историей: ПКМ включает/выключает локальный файл Storry-1.mp3.
   Громкость — как у музыки в игре (0.45). Воспроизводится только одна запись за раз. */
var diskAudio = null, diskPlaying = false, diskCurrent = null;
function invDiskToggle(disId){
  var dis = disId ? diskById(disId) : null;
  if(!dis || dis.have < 1) return;
  if(diskCurrent === disId && diskPlaying){
    try{ diskAudio.pause(); diskAudio.currentTime = 0; }catch(e){}
    diskPlaying = false;
    diskCurrent = null;
    return;
  }
  if(diskPlaying && diskAudio){ try{ diskAudio.pause(); diskAudio.currentTime = 0; }catch(e){} }
  if(!diskAudio || diskAudio.__file !== dis.file){
    diskAudio = null;
    try{ diskAudio = new Audio(relURL(dis.file)); }catch(e){ return; }
    diskAudio.__file = dis.file;
    diskAudio.volume = 0.45;
    diskAudio.loop = false;
  }
  diskPlaying = true;
  diskCurrent = disId;
  try{ var p = diskAudio.play(); if(p && p.catch) p.catch(function(){}); }catch(e){}
}
/* ---------- UI: ПАНЕЛЬ + СЕТКА + ОТКРЫТИЕ/ЗАКРЫТИЕ (клавиша I) ---------- */
function initInvPanel(){
  if(INV_PANEL) return;
  INV_PANEL = document.createElement('div');
  INV_PANEL.id = 'invPanel';
  INV_PANEL.setAttribute('data-keep','1');
  INV_PANEL.innerHTML = '<h3>\u{1F9F2} ИНВЕНТАРЬ</h3>'
    + '<div id="invTabs"><button class="inv-tab' + (INV_TAB==='res'?' on':'') + '" data-tab="res">\u{1F9F2} Ресурсы</button><button class="inv-tab' + (INV_TAB==='disk'?' on':'') + '" data-tab="disk">\u{1F4C0} Диски</button></div><div id="invGrid"></div><div id="invHint">ЛКМ — выбрать · ПКМ — триггер · T — использовать · I/Esc — закрыть</div>';
  document.body.appendChild(INV_PANEL);
  INV_GRID = document.getElementById('invGrid');
  var tabs = INV_PANEL.querySelectorAll('.inv-tab');
  for(var _t=0; _t<tabs.length; _t++){
    (function(btn){
      btn.addEventListener('click', function(){
        INV_TAB = btn.getAttribute('data-tab');
        for(var _s=0; _s<tabs.length; _s++){ tabs[_s].classList.toggle('on', tabs[_s]===btn); }
        invRefresh();
      });
    })(tabs[_t]);
  }
  invRefresh();
}
function invRefresh(){
  if(!INV_GRID) return;
  INV_GRID.innerHTML = '';
  if(INV_TAB === 'disk'){
    for(var di=0; di<DISKS.length; di++){
      var dis = DISKS[di];
      var cell = document.createElement('div');
      cell.className = 'inv-slot disk-slot';
      cell.style.opacity = (dis.have >= 1) ? '1' : '0.35';
      cell.innerHTML = '<div class="inv-ico">'+dis.icon+'</div>'
        + '<div class="inv-name" style="color:' + (dis.have>=1 ? '#ffd700' : '#888') + ';">'+dis.name+'</div>'
        + '<div class="inv-cnt">' + (dis.have>=1 ? 'В ИНВЕНТАРЕ' : 'НЕ НАЙДЕН') + '</div>';
      (function(disId){
        cell.addEventListener('mousedown', function(ev){
          if(ev.button === 2){ ev.preventDefault(); invDiskToggle(disId); return; }
        });
        cell.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
      })(dis.id);
      INV_GRID.appendChild(cell);
    }
    return;
  }
  for(var i=0;i<INV.length;i++){
    var r = INV[i];
    if(r.get() <= 0) continue;
    var cell = document.createElement('div');
    cell.className = 'inv-slot' + (invSel === r.id ? ' inv-sel' : '');
    cell.dataset.id = r.id;
    var nTrig = 0;
    if(r.meta && r.meta.triggers){ for(var t in r.meta.triggers) nTrig++; }
    cell.innerHTML = '<div class="inv-ico">'+r.icon+'</div>'
      + '<div class="inv-name">'+r.name+'</div>'
      + '<div class="inv-cnt">'+r.get()+'</div>'
      + (nTrig ? '<div class="inv-meta">TRG</div>' : '');
    (function(rid){
      cell.addEventListener('mousedown', function(ev){
        if(ev.button === 2){
          ev.preventDefault();
          if(rid === 'pepper'){ invPepperLuck(); }
          invFire('onRMB', invRes(rid));
          return;
        }
        invSel = rid;
        invRefresh();
        invFire('onLMB', invRes(rid));
      });
      cell.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
    })(r.id);
    INV_GRID.appendChild(cell);
  }
}
function invUpdateCounts(){
  if(!INV_GRID) return;
  var cells = INV_GRID.children;
  for(var i=0;i<cells.length;i++){
    var id = cells[i].dataset.id, r = invRes(id);
    var c = cells[i].querySelector('.inv-cnt');
    if(r && c){ var v = r.get(); if(c._v !== v){ c.textContent = v; c._v = v; } }
    if(r) cells[i].style.display = (r.get() <= 0) ? 'none' : '';
  }
}
function invToggle(open){
  if(open === undefined) open = !INV_OPEN;
  INV_OPEN = open;
  if(INV_PANEL) INV_PANEL.style.display = INV_OPEN ? 'flex' : 'none';
  if(INV_OPEN){ invRefresh(); }
}

initInvPanel();
initTopPanel();
initBottomPanel();
initGoPanel();
initPausePanel();
applyGameMode();
updHud();
requestAnimationFrame(loop);
window.__LOAD && __LOAD.mark('ГОТОВО');

}catch(e){
  gameErr('ИГРА: ошибка запуска — ' + (e && e.message ? e.message : e));
}
})();
